name: build, verify, publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build the single-file site
        run: npm run build
      - name: Refuse to ship a dataset that is not referentially whole
        run: |
          node -e "
          const d = require('./data/dataset.slim.json');
          const ids = m => new Set(d[m].map(r => r.id));
          const acc = ids('Accounts'), con = ids('Contacts'), dea = ids('Deals'), cam = ids('Campaigns');
          const bad =
            d.Event_Contacts.filter(e => !con.has(e.Origin_Contact) || !acc.has(e.Account_Name)).length +
            d.Meetings.filter(m => !acc.has(m.Account_Name) || !cam.has(m.Campaign)).length +
            d.Messages.filter(m => !dea.has(m.Deal)).length;
          if (bad) { console.error(bad + ' dangling references in the slim dataset'); process.exit(1); }
          console.log('dataset is referentially whole');
          "
      - name: Refuse to ship anything that looks like a real identifier
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          # Two classes of leak. The first is obvious: credentials, hosts, org identifiers.
          # The second is subtler and is what actually got through once — the original org's
          # module names, copied across during a fidelity pass and landing in a column
          # heading on a public page.
          #
          # What this deliberately no longer flags:
          #   the employer's name on its own. The About page is a CV and names every employer
          #   in plain text; a scan that forbids the name cannot coexist with that. What is
          #   still forbidden is anything that identifies the ORG rather than the company —
          #   its mail domain, its CRM hosts, its org ids, its module names.
          #   Credential words are matched only when something is assigned to them: the word
          #   refresh_token in a code sample is vocabulary, not a secret.
          #   Base64 payloads are stripped before matching. An embedded photograph will
          #   contain any three-letter sequence you care to name, and did.

          PAT    = re.compile(r"(zcrm\.zoho|crmplus\.zoho|crm\.zoho\.[a-z]+/crm/org"
                              r"|sk-ant-|xoxb-|@room8group|dragonlake)", re.I)
          CRED   = re.compile(r"(refresh_token|client_secret|access_token|api[_-]?key)"
                              r"[\"']?\s*[:=]\s*[\"'][^\"']{8,}", re.I)
          SCHEMA = re.compile(r"(Game_Title|Studio_Solutions|Blue_?Sheet|Green_?Sheet"
                              r"|CustomModule[0-9]+|61496[0-9]{6,}|5511000[0-9]{5,}|org2006[0-9]+)", re.I)
          B64    = re.compile(r"data:[a-z0-9.+/-]+;base64,[A-Za-z0-9+/=\s]+", re.I)

          bad = []
          for root in ('src', 'data', 'platform', 'build.mjs'):
              p = pathlib.Path(root)
              if not p.exists():
                  continue
              files = [p] if p.is_file() else [f for f in p.rglob('*')
                                               if f.suffix in {'.js', '.html', '.mjs', '.json'}]
              for f in files:
                  text = B64.sub('data:[payload stripped]', f.read_text(encoding='utf-8', errors='ignore'))
                  for label, rx in (('identifier', PAT), ('credential', CRED), ('original schema name', SCHEMA)):
                      for m in rx.finditer(text):
                          line = text.count('\n', 0, m.start()) + 1
                          bad.append(f'{f}:{line}: {label}: ' + m.group(0)[:80].replace('\n', ' '))
          if bad:
              print('\n'.join(bad))
              print('::error::found an identifier, a credential or an original schema name')
              sys.exit(1)
          print('clean')
          PY
      - run: npm test
      - name: Build with every section switched on, and test the hidden ones
        run: npm run build:all && npm run test:hidden
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  publish:
    name: publish to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # turn Pages on from the workflow instead of requiring a click in Settings,
          # so a fresh clone of this repo deploys without any manual setup
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
