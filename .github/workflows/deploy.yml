name: build, verify, publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build the single-file site
        run: npm run build
      - name: Refuse to ship a dataset that is not referentially whole
        run: |
          node -e "
          const d = require('./data/dataset.slim.json');
          const ids = m => new Set(d[m].map(r => r.id));
          const acc = ids('Accounts'), con = ids('Contacts'), dea = ids('Deals'), cam = ids('Campaigns');
          const bad =
            d.Event_Contacts.filter(e => !con.has(e.Origin_Contact) || !acc.has(e.Account_Name)).length +
            d.Meetings.filter(m => !acc.has(m.Account_Name) || !cam.has(m.Campaign)).length +
            d.Messages.filter(m => !dea.has(m.Deal)).length;
          if (bad) { console.error(bad + ' dangling references in the slim dataset'); process.exit(1); }
          console.log('dataset is referentially whole');
          "
      - name: Refuse to ship anything that looks like a real identifier
        run: |
          # Two classes of leak. The first is obvious: credentials, hosts, org identifiers.
          # The second is subtler and is what actually got through once — an internal
          # abbreviation and the original org's module names, copied across during a
          # fidelity pass and landing in a column heading on a public page.
          PAT='(room8|roomeight|r8g|zcrm\.zoho|crmplus\.zoho|crm\.zoho\.[a-z]+/crm/org|sk-ant-|xoxb-|refresh_token|client_secret|@room8group|dragonlake)'
          SCHEMA='(Game_Title|Studio_Solutions|Blue_?Sheet|Green_?Sheet|Miller.?Hei|CustomModule[0-9]+|61496[0-9]{6,}|5511000[0-9]{5,}|org2006[0-9]+)'
          FOUND=$(grep -rniE "$PAT" --include='*.js' --include='*.html' --include='*.json' --include='*.mjs' \
                  src data platform build.mjs 2>/dev/null || true)
          FOUND2=$(grep -rniE "$SCHEMA" --include='*.js' --include='*.html' --include='*.mjs' \
                   src data platform 2>/dev/null || true)
          if [ -n "$FOUND$FOUND2" ]; then
            echo "$FOUND"; echo "$FOUND2"
            echo "::error::found an identifier, a credential or an original schema name"; exit 1
          fi
          echo "clean"
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  publish:
    name: publish to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # turn Pages on from the workflow instead of requiring a click in Settings,
          # so a fresh clone of this repo deploys without any manual setup
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
