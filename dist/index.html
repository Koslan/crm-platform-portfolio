<title>Zoho Platform Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EDE9; --line:#D3DBD6; --line-strong:#B6C2BC;
  --ink:#141D19; --ink-2:#3D4A45; --ink-3:#6B7A74;
  --accent:#1F6F5C; --accent-ink:#12463A; --accent-soft:#DCEAE5;
  --ok:#2F7D4F; --warn:#A9662B; --crit:#9E3A2E; --idle:#7B8A84;
  --ok-bg:#DFEEE4; --warn-bg:#F5E7D8; --crit-bg:#F3DEDA; --idle-bg:#E7EBE9;
  --shadow:0 1px 2px rgba(20,29,25,.06), 0 8px 24px -16px rgba(20,29,25,.28);
  --rail:264px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1512; --surface:#151E1A; --surface-2:#1C2723; --line:#28352F; --line-strong:#3A4A43;
    --ink:#E3EBE7; --ink-2:#AEBCB6; --ink-3:#7E8E87;
    --accent:#4FB39A; --accent-ink:#8FD6C4; --accent-soft:#1B322C;
    --ok:#5FBE85; --warn:#D2954F; --crit:#D9705F; --idle:#8A9A93;
    --ok-bg:#16301F; --warn-bg:#33261A; --crit-bg:#331D1A; --idle-bg:#1E2825;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1512; --surface:#151E1A; --surface-2:#1C2723; --line:#28352F; --line-strong:#3A4A43;
  --ink:#E3EBE7; --ink-2:#AEBCB6; --ink-3:#7E8E87;
  --accent:#4FB39A; --accent-ink:#8FD6C4; --accent-soft:#1B322C;
  --ok:#5FBE85; --warn:#D2954F; --crit:#D9705F; --idle:#8A9A93;
  --ok-bg:#16301F; --warn-bg:#33261A; --crit-bg:#331D1A; --idle-bg:#1E2825;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; text-wrap:balance; margin:0}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 0 40px;
}
.brand{padding:0 20px 20px; border-bottom:1px solid var(--line); margin-bottom:16px}
.brand .name{font-family:"IBM Plex Serif",serif; font-size:17px; font-weight:600; letter-spacing:-.01em}
.brand .role{font-size:12.5px; color:var(--ink-3); margin-top:3px}
.navgroup{padding:0 12px; margin-bottom:20px}
.navgroup h4{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  margin:0 0 7px; padding:0 8px;
}
.navlink{
  display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:5px;
  color:var(--ink-2); font-size:13.5px; cursor:pointer; border-left:2px solid transparent;
}
.navlink:hover{background:var(--surface-2); color:var(--ink); text-decoration:none}
.navlink.on{background:var(--accent-soft); color:var(--accent-ink); border-left-color:var(--accent); font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--idle)}
.dot.live{background:var(--ok)} .dot.emul{background:var(--warn)} .dot.note{background:var(--line-strong)}

/* ---------- main ---------- */
main{padding:0 0 80px; min-width:0}
.wrap{max-width:900px; padding:0 44px}
.wrap.wide{max-width:1280px}
.topbar{
  border-bottom:1px solid var(--line); background:var(--surface);
  padding:14px 44px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  position:sticky; top:0; z-index:5;
}
.crumb{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); letter-spacing:.04em}
.spacer{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid transparent; white-space:nowrap;
}
.chip.live{background:var(--ok-bg); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.chip.emul{background:var(--warn-bg); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip.note{background:var(--idle-bg); color:var(--ink-3); border-color:var(--line)}
.chip.plain{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}

.pagehead{padding:38px 0 0}
.pagehead h1{font-size:31px; letter-spacing:-.015em; line-height:1.2}
.pagehead .sub{color:var(--ink-2); font-size:16px; margin-top:10px; max-width:62ch}
.metarow{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}

section.block{margin-top:34px}
section.block > h2{
  font-size:12px; font-family:"IBM Plex Mono",monospace; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:16px;
}
section.block p{margin:0 0 12px; max-width:66ch; color:var(--ink-2)}
section.block p strong{color:var(--ink); font-weight:600}
section.block ul{margin:0 0 12px; padding-left:20px; max-width:66ch; color:var(--ink-2)}
section.block li{margin-bottom:6px}
section.block li::marker{color:var(--line-strong)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow)}
.stage{
  border:1px dashed var(--line-strong); border-radius:9px; background:var(--surface-2);
  min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:38px 24px; color:var(--ink-3);
}
.stage .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.stage .hint{font-size:13.5px; max-width:44ch}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px}
.tile{
  display:block; padding:16px 17px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); cursor:pointer; color:inherit;
}
.tile:hover{border-color:var(--line-strong); text-decoration:none; box-shadow:var(--shadow)}
.tile h3{font-size:16px; margin-bottom:5px; letter-spacing:-.01em}
.tile p{font-size:13.5px; color:var(--ink-3); margin:0 0 11px; line-height:1.5}
.tile .foot{display:flex; gap:6px; flex-wrap:wrap}

table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
   text-transform:uppercase; color:var(--ink-3); font-weight:500}
td.num{font-variant-numeric:tabular-nums; text-align:right}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--surface)}

.callout{
  border-left:3px solid var(--warn); background:var(--warn-bg); color:var(--ink);
  padding:13px 16px; border-radius:0 7px 7px 0; font-size:14px; max-width:66ch;
}
.callout.acc{border-left-color:var(--accent); background:var(--accent-soft)}
.callout p:last-child{margin-bottom:0}
.callout .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; display:block; margin-bottom:5px; color:var(--ink-2)}

.kv{display:grid; grid-template-columns:150px minmax(0,1fr); gap:2px 18px; font-size:14px}
.kv dt{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); padding-top:4px}
.kv dd{margin:0 0 10px; color:var(--ink-2)}


/* ---------- platform console ---------- */
.console{display:grid; gap:12px}
.qbox{
  width:100%; min-height:96px; resize:vertical; padding:12px 14px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:13px; line-height:1.6;
}
.qbox:focus{outline:2px solid var(--accent); outline-offset:1px}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
button.act{
  font:500 13px/1 "IBM Plex Sans",sans-serif; padding:9px 15px; border-radius:7px; cursor:pointer;
  border:1px solid var(--accent); background:var(--accent); color:#fff;
}
button.act:hover{filter:brightness(1.08)}
button.ghost{
  font:400 12.5px/1 "IBM Plex Mono",monospace; padding:7px 11px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
}
button.ghost:hover{border-color:var(--line-strong); color:var(--ink)}
button.ghost[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.result{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); letter-spacing:.03em}
.errbox{
  border-left:3px solid var(--crit); background:var(--crit-bg); color:var(--ink);
  padding:11px 14px; border-radius:0 7px 7px 0; font-family:"IBM Plex Mono",monospace; font-size:12.5px;
}
.counters{display:flex; flex-wrap:wrap; gap:7px}
.counter{
  border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:7px 11px; min-width:96px;
}
.counter b{display:block; font-family:"IBM Plex Mono",monospace; font-size:16px; font-variant-numeric:tabular-nums}
.counter span{font-size:10.5px; color:var(--ink-3); letter-spacing:.05em; text-transform:uppercase}

@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line)}
  .wrap,.topbar{padding-left:20px; padding-right:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="app">
  <nav class="rail">
    <div class="brand">
      <div class="name">Zoho Platform Field Notes</div>
      <div class="role">CRM platform engineering &middot; interfaces, integrations, org tooling</div>
    </div>
    <div id="nav"></div>
  </nav>
  <main>
    <div class="topbar">
      <span class="crumb" id="crumb">overview</span>
      <span class="spacer"></span>
      <span class="chip plain">Synthetic data</span>
      <span class="chip plain">No client records</span>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>/* ------------------------------------------------------------------
   mockZoho — a stand-in for the CRM Embedded App SDK.
   Serves widget code from a generated dataset held in memory.
   Deliberately reproduces platform behaviour that widgets must cope
   with: 200-record paging, lookup fields returned as {id,name},
   picklist validation, mandatory-field rejection, and — behind the
   failure switch — latency, throttling, expired tokens and rejects.
------------------------------------------------------------------ */
(function (root) {
  'use strict';

  const LOOKUPS = {
    Contacts:{ Account_Name:'Accounts' },
    Programmes:{ Account_Name:'Accounts' },
    Deals:{ Account_Name:'Accounts', Programme:'Programmes' },
    Meetings:{ Account_Name:'Accounts', Campaign:'Campaigns', Deal:'Deals' },
    Event_Contacts:{ Account_Name:'Accounts', Campaign:'Campaigns', Origin_Contact:'Contacts' },
    Messages:{ Deal:'Deals' },
    Potentials:{ Programme:'Programmes' },
    Accounts:{ Main_Parent_Account:'Accounts' }
  };
  const DISPLAY = { Accounts:'Account_Name', Contacts:'Full_Name', Deals:'Deal_Name',
    Programmes:'Name', Campaigns:'Name', Meetings:'Name', Service_Catalog:'Name',
    Event_Contacts:'id', Messages:'Thread_Topic', Users:'full_name', Potentials:'Solutions' };
  const RELATED = {
    Accounts:{ Contacts:['Contacts','Account_Name'], Deals:['Deals','Account_Name'] },
    Campaigns:{ Event_Contacts:['Event_Contacts','Campaign'], Meetings:['Meetings','Campaign'] },
    Deals:{ Messages:['Messages','Deal'], Meetings:['Meetings','Deal'] },
    Contacts:{ Event_Contacts:['Event_Contacts','Origin_Contact'] },
    Programmes:{ Deals:['Deals','Programme'], Potentials:['Potentials','Programme'] }
  };
  const PICKLISTS = {
    Meetings:{ Meeting_Status:['Booked','Held','Declined'] },
    Event_Contacts:{ Attending_Status:['Investigating','Yes','No'],
      Meeting_Status:['Open','Contacted','Meeting booked','Meeting held','Meeting declined'],
      Priority:['P1','P2','P3'] },
    Deals:{ Stage:['0. Prospecting','1. Qualification','2. Proposal','3. Confirmation','4. Won','5. Lost'] }
  };
  const MANDATORY = { Meetings:['Name'], Accounts:['Account_Name'], Contacts:['Last_Name'] };
  const PAGE_MAX = 200;                      // the platform ceiling, reproduced on purpose

  /* ---------------- failure switch ---------------- */
  const chaos = { mode:'off', latency:0, seed:7 };
  const nextRand = () => (chaos.seed = (chaos.seed * 1103515245 + 12345) >>> 0) / 4294967296;
  function err(code, message, details){ const e = new Error(message); e.code = code; e.details = details || {}; return e; }
  async function gate(){
    const wait = chaos.latency || (chaos.mode === 'slow' ? 900 : 0);
    if (wait) await new Promise(r => setTimeout(r, wait + nextRand() * 250));
    if (chaos.mode === 'throttle' && nextRand() < 0.55) throw err('TOO_MANY_REQUESTS','Rate limit reached. Retry after 30 seconds.',{retry_after:30});
    if (chaos.mode === 'expired') throw err('INVALID_TOKEN','The access token has expired.',{});
    if (chaos.mode === 'reject' && nextRand() < 0.5) throw err('INTERNAL_ERROR','The request could not be completed.',{});
  }

  /* ---------------- store ---------------- */
  let DB = {}, ORIGINAL = null, index = {};
  function reindex(){
    index = {};
    for (const [mod, rows] of Object.entries(DB)) {
      if (!Array.isArray(rows)) continue;
      const m = new Map(); rows.forEach(r => m.set(String(r.id), r)); index[mod] = m;
    }
  }
  function load(data){ DB = JSON.parse(JSON.stringify(data)); ORIGINAL = JSON.stringify(data); reindex(); }
  function reset(){ if (ORIGINAL) { DB = JSON.parse(ORIGINAL); reindex(); } }
  const rows = mod => (Array.isArray(DB[mod]) ? DB[mod] : []);
  const nameOf = (mod, rec) => rec ? (rec[DISPLAY[mod]] ?? rec.Name ?? rec.id) : null;

  function hydrate(mod, rec){
    if (!rec) return null;
    const out = { ...rec };
    const map = LOOKUPS[mod] || {};
    for (const [field, target] of Object.entries(map)) {
      const v = rec[field];
      if (v == null) { out[field] = null; continue; }
      const t = index[target] && index[target].get(String(v));
      out[field] = t ? { id: String(v), name: nameOf(target, t) } : { id: String(v), name: null };
    }
    return out;
  }
  function resolvePath(mod, rec, path){
    const parts = String(path).split('.');
    if (parts.length === 1) return rec[parts[0]];
    const target = (LOOKUPS[mod] || {})[parts[0]];
    if (!target) return undefined;
    const t = index[target] && index[target].get(String(rec[parts[0]]));
    return t ? t[parts[1]] : null;
  }

  /* ---------------- COQL subset ---------------- */
  function tokenize(q){
    const re = /\s*("(?:[^"]|"")*"|'(?:[^']|'')*'|>=|<=|!=|[()=<>,]|[A-Za-z_][\w.]*|-?\d+(?:\.\d+)?|\*)/y;
    const out = []; let i = 0;
    while (i < q.length) {
      re.lastIndex = i; const m = re.exec(q);
      if (!m) { if (/^\s+$/.test(q.slice(i))) break; throw err('INVALID_QUERY','Cannot parse near: '+q.slice(i,i+24)); }
      out.push(m[1]); i = re.lastIndex;
    }
    return out;
  }
  const unq = s => (/^['"]/.test(s) ? s.slice(1,-1).replace(/''/g,"'").replace(/""/g,'"') : s);

  function parseCoql(q){
    const t = tokenize(q); let p = 0;
    const peek = () => t[p], take = () => t[p++];
    const kw = w => (t[p] || '').toLowerCase() === w;
    const expect = w => { if (!kw(w)) throw err('INVALID_QUERY','Expected "'+w+'"'); p++; };

    expect('select');
    const select = [];
    do { if (peek() === ',') p++; select.push(take()); } while (peek() === ',');
    expect('from');
    const module = take();
    let where = null, order = null, dir = 'asc', limit = PAGE_MAX, offset = 0;

    if (kw('where')) { p++; where = parseOr(); }
    if (kw('order')) { p++; expect('by'); order = take();
      if (kw('asc') || kw('desc')) dir = take().toLowerCase(); }
    if (kw('limit')) { p++; const a = Number(take());
      if (peek() === ',') { p++; offset = a; limit = Number(take()); } else limit = a; }
    if (kw('offset')) { p++; offset = Number(take()); }
    return { select, module, where, order, dir, limit: Math.min(limit, PAGE_MAX), offset };

    function parseOr(){ let l = parseAnd(); while (kw('or')) { p++; l = { op:'or', l, r:parseAnd() }; } return l; }
    function parseAnd(){ let l = parseTerm(); while (kw('and')) { p++; l = { op:'and', l, r:parseTerm() }; } return l; }
    function parseTerm(){
      if (peek() === '(') { p++; const e = parseOr(); if (peek() !== ')') throw err('INVALID_QUERY','Unbalanced parenthesis'); p++; return e; }
      const field = take();
      if (kw('is')) { p++; if (kw('not')) { p++; expect('null'); return { field, cmp:'notnull' }; } expect('null'); return { field, cmp:'null' }; }
      if (kw('in')) { p++; if (peek() !== '(') throw err('INVALID_QUERY','Expected "(" after IN'); p++;
        const vals = []; while (peek() !== ')') { if (peek() === ',') { p++; continue; } vals.push(unq(take())); }
        p++; return { field, cmp:'in', value:vals }; }
      if (kw('not')) { p++; expect('in'); p++;
        const vals = []; while (peek() !== ')') { if (peek() === ',') { p++; continue; } vals.push(unq(take())); }
        p++; return { field, cmp:'notin', value:vals }; }
      if (kw('like')) { p++; return { field, cmp:'like', value:unq(take()) }; }
      const op = take();
      if (!['=','!=','>','<','>=','<='].includes(op)) throw err('INVALID_QUERY','Unsupported operator "'+op+'"');
      return { field, cmp:op, value:unq(take()) };
    }
  }
  function evalWhere(node, mod, rec){
    if (!node) return true;
    if (node.op) return node.op === 'and'
      ? evalWhere(node.l, mod, rec) && evalWhere(node.r, mod, rec)
      : evalWhere(node.l, mod, rec) || evalWhere(node.r, mod, rec);
    const raw = resolvePath(mod, rec, node.field);
    const v = raw == null ? null : String(raw);
    switch (node.cmp) {
      case 'null': return raw == null || raw === '';
      case 'notnull': return !(raw == null || raw === '');
      case 'in': return v != null && node.value.includes(v);
      case 'notin': return v == null || !node.value.includes(v);
      case 'like': {
        if (v == null) return false;
        const rx = new RegExp('^' + node.value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.') + '$','i');
        return rx.test(v);
      }
      default: {
        const a = isFinite(raw) && raw !== null && raw !== '' ? Number(raw) : v;
        const b = isFinite(node.value) && node.value !== '' ? Number(node.value) : node.value;
        switch (node.cmp) {
          case '=':  return a == b;
          case '!=': return a != b;
          case '>':  return a > b;
          case '<':  return a < b;
          case '>=': return a >= b;
          case '<=': return a <= b;
        }
      }
    }
  }
  function runCoql(query){
    const q = parseCoql(query);
    if (!Array.isArray(DB[q.module])) throw err('INVALID_MODULE','No module named "'+q.module+'"');
    let list = rows(q.module).filter(r => evalWhere(q.where, q.module, r));
    const total = list.length;
    if (q.order) {
      const f = q.order, s = q.dir === 'desc' ? -1 : 1;
      list = list.slice().sort((a,b) => {
        const x = resolvePath(q.module,a,f), y = resolvePath(q.module,b,f);
        if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
        return (x > y ? 1 : x < y ? -1 : 0) * s;
      });
    }
    const page = list.slice(q.offset, q.offset + q.limit);
    const star = q.select.includes('*');
    const data = page.map(r => {
      if (star) return { ...r };
      const o = {};
      for (const f of q.select) o[f] = resolvePath(q.module, r, f) ?? null;
      if (!q.select.includes('id')) o.id = r.id;
      return o;
    });
    return { data, info:{ count:data.length, total, more_records: q.offset + data.length < total } };
  }

  /* ---------------- writes ---------------- */
  function validate(mod, payload, isCreate){
    for (const f of (MANDATORY[mod] || [])) {
      if (isCreate && (payload[f] == null || payload[f] === ''))
        throw err('MANDATORY_NOT_FOUND','Required field not found', { api_name:f });
    }
    for (const [f, allowed] of Object.entries(PICKLISTS[mod] || {})) {
      if (f in payload && payload[f] != null && payload[f] !== '' && !allowed.includes(payload[f]))
        throw err('INVALID_DATA','Value not part of the picklist', { api_name:f, expected:allowed });
      if (f in payload && payload[f] === '')
        throw err('INVALID_DATA','An empty value is not accepted for a picklist', { api_name:f });
    }
    for (const [k, v] of Object.entries(payload)) if (v === null && isCreate) delete payload[k];
  }
  let seq = 7300000000000;
  function insert(mod, payload){
    validate(mod, payload, true);

/* ---------- helpers ---------- */
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const q = (r, s) => r.querySelector(s);
const qa = (r, s) => Array.from(r.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, '0');
const dmy = d => `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;
const parseDT = s => { const m = /^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})$/.exec(s || ''); return m ? { day:`${m[1]}.${m[2]}.${m[3]}`, min:+m[4]*60 + +m[5] } : null; };
const hhmm = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
const esc = v => String(v).replace(/'/g, "''");
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

async function coqlAll(query, cap = 1200) {
  const out = []; let offset = 0;
  for (;;) {
    const r = await ZOHO.CRM.API.coql({ select_query: `${query} limit 200 offset ${offset}` });
    out.push(...r.data);
    if (!r.info.more_records || out.length >= cap) return { rows: out, total: r.info.total };
    offset += 200;
  }
}

/* ---------- page ---------- */
const Page = {
  async mount(host, campaignId) {
    if (!document.getElementById('ecp-css')) {
      const st = document.createElement('style'); st.id = 'ecp-css'; st.textContent = CSS; document.head.appendChild(st);
    }
    const c = (await ZOHO.CRM.API.getRecord({ Entity:'Campaigns', RecordID:campaignId })).data[0];
    this.c = c;
    const days = [];
    for (let d = new Date(c.Start), end = new Date(c.End); d <= end; d.setDate(d.getDate()+1)) days.push(new Date(d));
    this.days = days;

    host.classList.add('ecp');
    host.innerHTML = `
      ${this.banner(c)}
      <div class="tabs" role="tablist">
        ${['Overview','Contacts','Meetings'].map((t,i)=>`<button role="tab" data-t="${t}" aria-selected="${i===0}">${t}</button>`).join('')}
        ${['Meetings Visual','At A Glance','Timeline','Mobile View'].map(t=>`<button role="tab" disabled style="opacity:.4;cursor:default">${t}</button>`).join('')}
      </div>
      <div class="body" id="ecp-body"></div>`;

    q(host,'.tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-t]'); if (!b) return;
      qa(host,'.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      this.tab(b.dataset.t);
    });

/* ---------- tab: contacts ---------- */
const Contacts = {
  state:{ view:'prep', filters:new Set(), search:'', rows:null },
  async render(b, P) {
    b.innerHTML = `<div class="panel">
      <div class="tools">
        <h4 style="margin:0 14px 0 0">All contacts</h4>
        <span class="cnt" data-f=""><b id="c-all">—</b>all</span>
        <span class="cnt" data-f="shown"><b id="c-shown">—</b>shown</span>
        <span class="cnt" data-f="target"><b id="c-t">—</b>targets</span>
        <span class="cnt" data-f="booked"><b id="c-b">—</b>booked</span>
        <span class="cnt" data-f="open"><b id="c-o">—</b>open</span>
        <span class="grow"></span>
        <span class="seg" id="c-view">
          <button data-v="old">Old UI</button><button data-v="prep" aria-pressed="true">Event preparation</button><button data-v="full">Full view</button>
        </span>
        <button class="ver" title="Widget version">v2.3.0</button>
      </div>
      <div class="tools" id="c-chips">
        ${[['target','Targets only'],['last','Met last year'],['src1','Partner directory'],['src2','Event app'],['nosrc','No source'],
           ['P1','P1'],['P2','P2'],['P3','P3'],['booked','Booked'],['held','Held'],['declined','Declined'],['open','Open'],['contacted','Contacted']]
          .map(([k,l])=>`<button class="chip2" data-k="${k}">${l}</button>`).join('')}
        <span class="grow"></span>
        <input class="search" id="c-search" placeholder="Search account, contact, title…">
      </div>
      <div id="c-load" class="load">Loading contacts…</div>
      <div class="tw" id="c-tw">${Array.from({length:12},()=>`<div style="display:flex;gap:10px;padding:9px 10px">${
        [90,150,120,70,60,80,110].map(w=>`<div class="sk" style="width:${w}px"></div>`).join('')}</div>`).join('')}</div>
    </div>`;

    const S = this.state;
    const upd = () => this.draw(b);
    q(b,'#c-view').onclick = e => { const x = e.target.closest('button[data-v]'); if(!x) return;
      qa(b,'#c-view button').forEach(y=>y.setAttribute('aria-pressed', String(y===x))); S.view = x.dataset.v; upd(); };
    q(b,'#c-chips').onclick = e => { const x = e.target.closest('button[data-k]'); if(!x) return;
      const k = x.dataset.k; S.filters.has(k) ? S.filters.delete(k) : S.filters.add(k);
      x.setAttribute('aria-pressed', String(S.filters.has(k))); upd(); };
    q(b,'#c-search').oninput = e => { S.search = e.target.value.toLowerCase(); upd(); };
    qa(b,'.cnt').forEach(c => c.onclick = () => { const f = c.dataset.f; if(!f) { S.filters.clear();
      qa(b,'#c-chips button').forEach(y=>y.setAttribute('aria-pressed','false')); } else {
      S.filters.has(f) ? S.filters.delete(f) : S.filters.add(f);
      const btn = q(b,`#c-chips button[data-k="${f}"]`); if (btn) btn.setAttribute('aria-pressed', String(S.filters.has(f))); }
      upd(); });

    const t0 = performance.now();
    const { rows } = await coqlAll(
      `select id, Attending_Status, Meeting_Status, Priority, Source, Is_Target, Met_Last_Year, Added_By, BD_Comment,
       Origin_Contact.Full_Name, Origin_Contact.Title, Origin_Contact.Email,
       Account_Name.Account_Name, Account_Name.Country, Account_Name.Cooperation_Status
       from Event_Contacts where Campaign = '${P.c.id}'`);
    S.rows = rows;
    q(b,'#c-load').textContent =
      `${rows.length} contacts loaded in ${Math.ceil(rows.length/200)} pages · ${Math.round(performance.now()-t0)} ms`;
    this.draw(b);
    P.refreshHeader();
  },

  keep(r) {
    const S = this.state, f = S.filters;
    if (S.search) {
      const h = [r['Origin_Contact.Full_Name'], r['Origin_Contact.Title'], r['Account_Name.Account_Name']].join(' ').toLowerCase();
      if (!h.includes(S.search)) return false;
    }
    const grp = (keys, test) => { const on = keys.filter(k => f.has(k)); return !on.length || test(on); };
    if (f.has('target') && !r.Is_Target) return false;
    if (f.has('last') && !r.Met_Last_Year) return false;
    if (!grp(['src1','src2','nosrc'], on => on.some(k =>
        k === 'nosrc' ? !r.Source : r.Source === (k === 'src1' ? 'Partner Directory' : 'Event App')))) return false;
    if (!grp(['P1','P2','P3'], on => on.includes(r.Priority))) return false;
    const ms = { booked:'Meeting booked', held:'Meeting held', declined:'Meeting declined', open:'Open', contacted:'Contacted' };
    if (!grp(Object.keys(ms), on => on.some(k => r.Meeting_Status === ms[k]))) return false;
    return true;
  },

  draw(b) {
    const S = this.state; if (!S.rows) return;
    const list = S.rows.filter(r => this.keep(r));
    const n = k => S.rows.filter(k).length;
    q(b,'#c-all').textContent   = S.rows.length;
    q(b,'#c-shown').textContent = list.length;
    q(b,'#c-t').textContent     = n(r => r.Is_Target);
    q(b,'#c-b').textContent     = n(r => r.Meeting_Status === 'Meeting booked');
    q(b,'#c-o').textContent     = n(r => r.Meeting_Status === 'Open');

    const full = S.view === 'full', old = S.view === 'old';
    const pill = v => v === 'Meeting held' ? `<span class="pill ok">held</span>`
      : v === 'Meeting booked' ? `<span class="pill book">booked</span>`
      : v === 'Meeting declined' ? `<span class="pill no">declined</span>`
      : v === 'Contacted' ? `<span class="pill info">contacted</span>` : `<span class="pill ghost">open</span>`;
    const cols = ['','Contact','Title','Account','Country','Attending','Meeting status','Priority','Source']
      .concat(full ? ['Added by','Comment'] : []);
    const head = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
    const body = list.slice(0, 300).map(r => `<tr>
      <td>${r.Is_Target ? '<span class="pill info">target</span>' : '<span style="color:var(--ink-3)">—</span>'}</td>
      <td>${E(r['Origin_Contact.Full_Name'])}</td>
      <td class="wrap">${E(r['Origin_Contact.Title'])}</td>
      <td class="wrap">${E(r['Account_Name.Account_Name'])}</td>
      <td>${E(r['Account_Name.Country'])}</td>
      <td>${E(r.Attending_Status)}</td>
      <td>${pill(r.Meeting_Status)}<span class="lock" title="Set from meetings — not editable here">&#128274;</span></td>
      <td>${r.Priority ? `<span class="prio ${r.Priority}">${r.Priority}</span>` : '<span style="color:var(--ink-3)">—</span>'}</td>
      <td>${r.Source ? E(r.Source) : '<span style="color:var(--ink-3)">—</span>'}</td>
      ${full ? `<td>${E(r.Added_By)}</td><td class="wrap">${E(r.BD_Comment || '—')}</td>` : ''}
    </tr>`).join('');

    q(b,'#c-tw').innerHTML = list.length
      ? `<table class="d" ${old ? 'style="font-size:11.5px"' : ''}><thead>${head}</thead><tbody>${body}</tbody></table>`
        + (list.length > 300 ? `<div class="none">Showing the first 300 of ${list.length} matching rows.</div>` : '')
      : `<div class="none">${S.filters.size || S.search
          ? 'Nothing matches these filters. <a href="#" id="c-clear">Clear them</a>'
          : 'No contacts are linked to this campaign yet.'}</div>`;
    const cl = q(b,'#c-clear');
    if (cl) cl.onclick = e => { e.preventDefault(); S.filters.clear(); S.search = '';
      q(b,'#c-search').value = ''; qa(b,'#c-chips button').forEach(y=>y.setAttribute('aria-pressed','false')); this.draw(b); };
  }
};

  state:{ day:null, filters:new Set(), search:'', rows:null },
  async render(b, P) {

    b.innerHTML = `<div class="panel">
      <div class="tools">

       Meeting_Type, Target_Priority, Owner, Recap, Attendees_String, Sync_State,
       Account_Name.Account_Name from Meetings where Campaign = '${P.c.id}'`);
    // sortable key from "DD.MM.YYYY HH:MM" -> "YYYYMMDDHHMM"; blanks sort last
    const key = r => { const v = r.Meeting_DateTime_String || '';
      return v.length < 16 ? '\uffff' : v.slice(6,10) + v.slice(3,5) + v.slice(0,2) + v.slice(11,16); };
    S.rows = rows.slice().sort((a,c) => key(a) < key(c) ? -1 : key(a) > key(c) ? 1 : 0);
    q(b,'#m-load').textContent = `${rows.length} meetings loaded · ${new Set(rows.map(r=>r['Account_Name.Account_Name'])).size} accounts`;

  draw(b) {
    const S = this.state; if (!S.rows) return;
    const list = S.rows.filter(r => {
      const p = parseDT(r.Meeting_DateTime_String);
      if (S.day && (!p || p.day !== S.day)) return false;
      if (S.search && ![r.Name, r['Account_Name.Account_Name'], r.Owner].join(' ').toLowerCase().includes(S.search)) return false;
      const f = S.filters;
      if (f.has('recap') && !r.Recap) return false;
      if (f.has('norecap') && r.Recap) return false;
      if (f.has('room') && !r.Meeting_Room) return false;
      if (f.has('spot') && r.Meeting_Room) return false;
      const st = ['Booked','Held','Declined'].filter(k => f.has(k));
      if (st.length && !st.includes(r.Meeting_Status)) return false;
      return true;
    });
    const mins = list.reduce((a,r) => a + (+r.Meeting_Duration || 0), 0);
    q(b,'#m-all').textContent   = S.rows.length;
    q(b,'#m-shown').textContent = list.length;
    q(b,'#m-acc').textContent   = new Set(list.map(r=>r['Account_Name.Account_Name'])).size;
    q(b,'#m-rec').textContent   = list.filter(r=>r.Recap).length;
    q(b,'#m-bk').textContent    = list.filter(r=>r.Meeting_Status==='Booked').length;
    q(b,'#m-hl').textContent    = list.filter(r=>r.Meeting_Status==='Held').length;
    q(b,'#m-hrs').textContent   = Math.round(mins/60);

    const sync = s => s==='in_sync' ? '<span class="pill ok">in sync</span>'
      : s==='outdated' ? '<span class="pill info">outdated</span>'
      : s==='incorrect' ? '<span class="pill no">incorrect</span>'
      : s==='not_in_crm' ? '<span class="pill ghost">not in calendar</span>'
      : '<span class="pill ghost">no dates</span>';
    q(b,'#m-tw').innerHTML = list.length ? `<table class="d">
      <thead><tr><th>Date</th><th>Recap</th><th>Account</th><th>Meeting</th><th>Priority</th><th>Status</th>
      <th>Owner</th><th>Min</th><th>Room</th><th>Spot</th><th>Calendar</th><th>Team</th></tr></thead>
      <tbody>${list.map(r => { const p = parseDT(r.Meeting_DateTime_String); return `<tr>
        <td>${p ? `${p.day.slice(0,5)} <span style="color:var(--ink-3)">${hhmm(p.min)}</span>` : '<span style="color:var(--ink-3)">—</span>'}</td>
        <td>${r.Recap ? '<span class="pill ok">&#10003;</span>' : '<span style="color:var(--ink-3)">—</span>'}</td>
        <td class="wrap">${E(r['Account_Name.Account_Name'])}</td>
        <td class="wrap">${E(r.Meeting_Type)}</td>
        <td>${r.Target_Priority ? `<span class="prio ${r.Target_Priority}">${r.Target_Priority}</span>` : '<span style="color:var(--ink-3)">—</span>'}</td>
        <td>${r.Meeting_Status === 'Held' ? '<span class="pill ok">held</span>'
             : r.Meeting_Status === 'Declined' ? '<span class="pill no">declined</span>' : '<span class="pill book">booked</span>'}</td>
        <td>${E(r.Owner)}</td><td>${r.Meeting_Duration}</td>
        <td>${r.Meeting_Room ? E(r.Meeting_Room) : '<span style="color:var(--ink-3)">—</span>'}</td>
        <td>${r.Spot ? E(r.Spot) : '<span style="color:var(--ink-3)">—</span>'}</td>
        <td>${sync(r.Sync_State)}</td>
        <td class="wrap">${E(r.Attendees_String)}</td></tr>`; }).join('')}</tbody></table>`
      : `<div class="none">No meetings match these filters.</div>`;
  }
};

/* ---------- create meeting wizard ---------- */
const Wizard = {
  async open(P) {
    this.P = P;
    this.s = { step:1, account:null, purpose:'', buyers:[], team:[], duration:60,
      day: dmy(P.days[0]), spot:null, room: P.c.rooms[0] ? P.c.rooms[0].name : null, slot:null, done:false };
    const mask = el(`<div class="ecp-mask ecp"><div class="ecp-mod">
      <div class="hd"><h3>Create event meeting</h3><span class="ver" style="margin-left:8px">v2.0.5</span><button class="x" title="Close">&times;</button></div>
      <div class="steps">${['Account','Participants','Place &amp; time','Availability','Review']
        .map((t,i)=>`<div data-s="${i+1}"><b>${i+1}</b>${t}</div>`).join('')}</div>
      <div class="pane" id="w-pane"></div>
      <div class="ft"><button class="btn sec" id="w-back">Back</button><span class="msg" id="w-msg"></span>
        <span class="sp"></span><button class="btn" id="w-next">Continue</button></div>
    </div></div>`);
    document.body.appendChild(mask);
    this.mask = mask;
    q(mask,'.x').onclick = () => this.close();
    mask.addEventListener('click', e => { if (e.target === mask) this.close(); });
    q(mask,'#w-back').onclick = () => { if (this.s.step > 1) { this.s.step--; this.draw(); } };
    q(mask,'#w-next').onclick = () => this.next();
    this.draw();
  },
  close() { this.mask.remove(); },

  blocker() {
    const s = this.s;
    if (s.step === 1 && !s.account) return 'Pick an account to continue.';
    if (s.step === 2 && !s.buyers.length) return 'At least one buyer is required.';
    if (s.step === 2 && !s.team.length) return 'At least one person from our side is required.';
    if (s.step === 3 && !s.room && !s.spot) return 'Choose a meeting room, or name a spot.';
    if (s.step === 3 && s.room) {
      const cap = (this.P.c.rooms.find(r => r.name === s.room) || {}).cap || 0;
      const total = s.buyers.length + s.team.length;
      if (total > cap) return `Room capacity is ${cap}; this meeting has ${total} people. Remove people or change the room.`;
    }
    if (s.step === 4 && s.slot == null) return 'Pick a start time.';
    return '';
  },

  async next() {
    const s = this.s;
    if (this.blocker()) return;
    if (s.step === 5) return this.submit();
    s.step++;
    this.draw();
  },

  draw() {
    const s = this.s, m = this.mask;
    qa(m,'.steps div').forEach(d => { const n = +d.dataset.s;
      d.classList.toggle('on', n === s.step); d.classList.toggle('done', n < s.step); });
    q(m,'#w-back').style.visibility = s.step > 1 && !s.done ? 'visible' : 'hidden';
    q(m,'#w-next').textContent = s.step === 5 ? 'Book the meeting' : 'Continue';
    q(m,'#w-next').style.display = s.done ? 'none' : '';
    const pane = q(m,'#w-pane');
    this['step'+s.step](pane);
    const b = this.blocker();
    q(m,'#w-msg').textContent = b;
    q(m,'#w-next').disabled = !!b;
  },

  async step1(pane) {
    const s = this.s;
    pane.innerHTML = `<span class="lab">Which account is this meeting with?</span>
      <input class="ti" id="w-acc" placeholder="Type at least two characters…" value="${E(s.account ? s.account.name : '')}">
      <div class="hint">Search runs against the CRM through the emulated platform layer.</div>
      <div id="w-hits" style="margin-top:14px"></div>`;
    const inp = q(pane,'#w-acc'), hits = q(pane,'#w-hits');
    const run = async () => {
      const v = inp.value.trim();
      if (v.length < 2) { hits.innerHTML = ''; return; }
      const r = await ZOHO.CRM.API.searchRecord({ Entity:'Accounts', Query:`(Account_Name:starts_with:${v})` });
      hits.innerHTML = r.data.length ? r.data.slice(0,8).map(a => `<div class="room" data-id="${a.id}" data-n="${E(a.Account_Name)}">
          <div style="width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font:600 12px/1 'IBM Plex Mono',monospace">${E(a.Account_Name.slice(0,2).toUpperCase())}</div>
          <div><div class="nm">${E(a.Account_Name)}</div><div class="mt">${E(a.Country)} · ${E(a.Cooperation_Status)}</div></div>
          <div class="tick">&#10003;</div></div>`).join('')
        : `<div class="none">Nothing starts with “${E(v)}”.</div>`;
    };
    inp.oninput = run;
    hits.onclick = async e => { const r = e.target.closest('[data-id]'); if (!r) return;
      s.account = { id:r.dataset.id, name:r.dataset.n }; s.buyers = [];
      inp.value = s.account.name; this.draw(); };
    if (s.account) run();
  },

  async step2(pane) {
    const s = this.s, P = this.P;
    pane.innerHTML = `<div class="two">
      <div><span class="lab">Purpose of the meeting</span>
        <textarea class="ta" rows="3" id="w-purpose" placeholder="What are we trying to achieve?">${E(s.purpose)}</textarea>
        <div class="hint" id="w-left"></div>
        <span class="lab" style="margin-top:18px">Buyers — from ${E(s.account.name)}</span>
        <div id="w-buyers" class="peep"><span class="hint">Loading contacts…</span></div></div>
      <div><span class="lab">Our side</span><div id="w-team" class="peep"></div>
        <div class="hint">Everyone listed on the campaign record.</div></div></div>`;
    const ta = q(pane,'#w-purpose'), left = q(pane,'#w-left');
    const count = () => left.textContent = `${255 - ta.value.length} characters left`;
    ta.oninput = () => { s.purpose = ta.value.slice(0,255); count(); }; count();

    const { rows } = await coqlAll(
      `select id, Full_Name, Title from Contacts where Account_Name = '${esc(s.account.id)}' and Contact_Status = 'Working'`, 200);
    const bx = q(pane,'#w-buyers');
    bx.innerHTML = rows.length
      ? rows.slice(0,40).map(c => `<button data-id="${c.id}" data-n="${E(c.Full_Name)}" aria-pressed="${s.buyers.some(b=>b.id===c.id)}">${E(c.Full_Name)} <span style="opacity:.6">· ${E(c.Title)}</span></button>`).join('')
      : `<span class="hint">This account has no active contacts. Add one on the account record first.</span>`;
    bx.onclick = e => { const b = e.target.closest('button[data-id]'); if (!b) return;
      const i = s.buyers.findIndex(x => x.id === b.dataset.id);
      i < 0 ? s.buyers.push({ id:b.dataset.id, name:b.dataset.n }) : s.buyers.splice(i,1);
      b.setAttribute('aria-pressed', String(i < 0)); this.refreshBlocker(); };

    const tx = q(pane,'#w-team');
    tx.innerHTML = P.c.attendees.map(a => `<button data-n="${E(a.Name1)}" aria-pressed="${s.team.includes(a.Name1)}">${E(a.Name1)} <span style="opacity:.6">· ${E(a.Functions)}</span></button>`).join('');
    tx.onclick = e => { const b = e.target.closest('button[data-n]'); if (!b) return;
      const n = b.dataset.n, i = s.team.indexOf(n);
      i < 0 ? s.team.push(n) : s.team.splice(i,1);
      b.setAttribute('aria-pressed', String(i < 0)); this.refreshBlocker(); };
  },

  step3(pane) {
    const s = this.s, P = this.P;
    pane.innerHTML = `<div class="two">
      <div><span class="lab">Duration</span><div class="peep" id="w-dur">
          ${[30,45,60,90,120].map(d=>`<button data-d="${d}" aria-pressed="${s.duration===d}">${d} min</button>`).join('')}</div>
        <span class="lab" style="margin-top:18px">Day</span><div class="peep" id="w-day">
          ${P.days.map(d=>`<button data-d="${dmy(d)}" aria-pressed="${s.day===dmy(d)}">${pad2(d.getDate())}.${pad2(d.getMonth()+1)} <span style="opacity:.6">${DOW[d.getDay()]}</span></button>`).join('')}</div>
        <div class="hint">Campaign runs ${E(P.c.Start)} to ${E(P.c.End)}.</div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:18px;font-size:13px">
          <input type="checkbox" id="w-nr" ${s.room ? '' : 'checked'}> Not in a meeting room</label>
        <div id="w-spotwrap" style="margin-top:10px;${s.room ? 'display:none' : ''}">
          <span class="lab">Where instead</span>
          <input class="ti" id="w-spot" list="w-spots" value="${E(s.spot || '')}" placeholder="Name the place">
          <datalist id="w-spots">${P.c.spots.map(x=>`<option value="${E(x)}">`).join('')}</datalist></div>
      </div>
      <div><span class="lab">Meeting room</span><div id="w-rooms" ${s.room ? '' : 'style="opacity:.4;pointer-events:none"'}>
        ${P.c.rooms.map(r=>`<div class="room" data-n="${E(r.name)}" aria-pressed="${s.room===r.name}">
          <div><div class="nm">${E(r.name)}</div><div class="mt">${E(r.from)}–${E(r.to)} · up to ${r.cap} people</div></div>
          <div class="tick">&#10003;</div></div>`).join('')}</div>
        <div class="hint" id="w-cap"></div></div></div>`;
    const cap = () => { const r = P.c.rooms.find(x => x.name === s.room);
      q(pane,'#w-cap').textContent = r ? `Capacity ${s.buyers.length + s.team.length} of ${r.cap}` : ''; };
    q(pane,'#w-dur').onclick = e => { const b = e.target.closest('button[data-d]'); if(!b) return;
      s.duration = +b.dataset.d; s.slot = null; this.draw(); };
    q(pane,'#w-day').onclick = e => { const b = e.target.closest('button[data-d]'); if(!b) return;
      s.day = b.dataset.d; s.slot = null; this.draw(); };
    q(pane,'#w-rooms').onclick = e => { const r = e.target.closest('[data-n]'); if(!r) return;
      s.room = r.dataset.n; s.slot = null; this.draw(); };
    q(pane,'#w-nr').onchange = e => { s.room = e.target.checked ? null : (P.c.rooms[0]||{}).name; s.slot = null; this.draw(); };
    const sp = q(pane,'#w-spot'); if (sp) sp.oninput = e => { s.spot = e.target.value; this.refreshBlocker(); };
    cap();
  },

  async step4(pane) {
    const s = this.s, P = this.P;
    pane.innerHTML = `<div class="tools"><span class="seg" id="w-mode">
        <button data-m="sug" aria-pressed="true">Suggested times</button><button data-m="grid">15-minute grid</button></span>
      <span class="grow"></span><span class="hint" id="w-tz">Times in ${E(P.c.Time_Zone_String)}</span></div>
      <div id="w-slots"><span class="hint">Working out who is free…</span></div>`;

    const day = s.day;
    const { rows } = await coqlAll(
      `select id, Meeting_DateTime_String, Meeting_Duration, Meeting_Room, Attendees_String, Meeting_Status
       from Meetings where Campaign = '${P.c.id}' and Meeting_DateTime_String like '${day}%'`, 400);
    const busy = rows.filter(r => r.Meeting_Status !== 'Declined').map(r => {
      const p = parseDT(r.Meeting_DateTime_String);
      return p ? { from:p.min, to:p.min + (+r.Meeting_Duration || 30), room:r.Meeting_Room,
                   who:String(r.Attendees_String || '').split(',').map(x=>x.trim()) } : null;
    }).filter(Boolean);

    const room = P.c.rooms.find(r => r.name === s.room);
    const [oh,om] = (room ? room.from : '09:00').split(':').map(Number);
    const [ch,cm] = (room ? room.to   : '18:00').split(':').map(Number);
    const open = oh*60+om, close = ch*60+cm;

    const clash = start => {
      const end = start + s.duration;
      const hitRoom = s.room && busy.find(b => b.room === s.room && b.from < end && start < b.to);
      if (hitRoom) return { block:true, why:'room is taken' };
      const hitWho = busy.find(b => b.from < end && start < b.to && b.who.some(w => s.team.includes(w)));
      if (hitWho) return { block:true, why:'someone from our side is busy' };
      return { block:false };
    };
    const grid = [];
    for (let t = open; t + s.duration <= close; t += 15) grid.push({ t, ...clash(t) });
    this._grid = grid;

    const render = mode => {
      const list = mode === 'sug' ? grid.filter(g => !g.block).filter((_,i) => i % 2 === 0).slice(0, 12) : grid;
      q(pane,'#w-slots').innerHTML = list.length ? list.map(g => `
        <div class="slot ${g.block ? 'busy' : ''}" data-t="${g.t}" aria-pressed="${s.slot === g.t}">
          ${hhmm(g.t)} – ${hhmm(g.t + s.duration)}
          ${g.block ? `<span class="why">${g.why}</span>` : `<span class="why">free</span>`}</div>`).join('')
        : `<div class="none">Nothing is free on this day for a ${s.duration}-minute meeting. Try a shorter slot or another day.</div>`;
      q(pane,'#w-slots').onclick = e => { const d = e.target.closest('.slot:not(.busy)'); if (!d) return;
        s.slot = +d.dataset.t; this.draw(); };
    };
    q(pane,'#w-mode').onclick = e => { const b = e.target.closest('button[data-m]'); if(!b) return;
      qa(pane,'#w-mode button').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); render(b.dataset.m); };
    render('sug');
  },

  step5(pane) {
    const s = this.s, P = this.P;
    if (s.done) return;
    pane.innerHTML = `<span class="lab">Review</span>
      <dl class="kvs">
        <dt>Account</dt><dd>${E(s.account.name)}</dd>
        <dt>When</dt><dd>${E(s.day)} · ${hhmm(s.slot)}–${hhmm(s.slot + s.duration)} (${s.duration} min)</dd>
        <dt>Where</dt><dd>${E(s.room || s.spot)}</dd>
        <dt>Time zone</dt><dd>${E(P.c.Time_Zone_String)} — the campaign's zone, not your device's</dd>
        <dt>Buyers</dt><dd>${s.buyers.map(b=>E(b.name)).join(', ')}</dd>
        <dt>Our side</dt><dd>${s.team.map(E).join(', ')}</dd>
        <dt>Purpose</dt><dd>${E(s.purpose || '—')}</dd>
      </dl>
      <div class="hint" style="margin-top:16px">Booking writes a record through the emulated platform layer. Nothing leaves your browser.</div>`;
  },

  async submit() {
    const s = this.s, P = this.P, m = this.mask;
    q(m,'#w-next').disabled = true; q(m,'#w-msg').textContent = 'Writing the record…';
    try {
      const res = await ZOHO.CRM.API.insertRecord({ Entity:'Meetings', APIData:{
        Name:`${P.c.Name} — ${s.account.name}`,
        Meeting_DateTime_String:`${s.day} ${hhmm(s.slot)}`,
        Meeting_Date:`${s.day.slice(6)}-${s.day.slice(3,5)}-${s.day.slice(0,2)}`,
        Meeting_Duration:s.duration, Meeting_Room:s.room, Spot:s.room ? null : s.spot,
        Meeting_Status:'Booked', Meeting_Type:'Discovery', Owner:s.team[0] || null,
        Account_Name:s.account.id, Campaign:P.c.id, Time_Zone:P.c.Time_Zone_String,
        Attendees_String:s.team.join(', '), Sync_State:'not_in_crm',
        participants:s.buyers.map(b => ({ Name1:b.name, Type:'Economic Buyer', Group:'External' }))
      }});
      s.done = true;
      q(m,'#w-msg').textContent = '';
      q(m,'#w-pane').innerHTML = `<div class="res"><div class="tickbig">&#10003;</div>
        <h3 style="font:600 18px/1 'IBM Plex Serif',serif;margin:0">Meeting booked</h3>
        <div style="color:var(--ink-2);font-size:13.5px">${E(s.account.name)} · ${E(s.day)} at ${hhmm(s.slot)} · ${E(s.room || s.spot)}</div>
        <div class="hint">Record ${E(res.data[0].details.id)} created. The calendar invitation is a server-side step and is not part of this demo — the record is marked <b>not in calendar</b> so the reconciliation screen has something to find.</div>
        <button class="btn sec" id="w-close" style="margin-top:8px">Back to the campaign</button></div>`;
      q(m,'#w-close').onclick = () => { this.close(); P.tab(P.current); };
      this.draw();
    } catch (e) {
      q(m,'#w-next').disabled = false;
      q(m,'#w-msg').textContent = `${e.code || 'ERROR'} — ${e.message}` + (e.details && e.details.api_name ? ` (field: ${e.details.api_name})` : '');
    }
  },

  refreshBlocker() { const b = this.blocker();
    q(this.mask,'#w-msg').textContent = b; q(this.mask,'#w-next').disabled = !!b; }
};

window.EventCampaignPage = Page;
})();
</script>
<script>

  {id:'deal-conversations', t:'Deal Conversations', kind:'live',

   see:'A message view inside the deal record: threads with a context badge, channel name and issue key; messages with colour-coded avatars, attachments and a review flag. A second tab shows tracker comments with a translation badge and a composer.',
   does:['Collapse and expand threads, search across text and authors',

   why:['A flat record list is rebuilt into a thread tree, with collapse state preserved',
        'Push is made idempotent by a hidden marker inside the comment body, so a ten-minute sync never duplicates',

const FLOWS = [
  {id:'chat-recap', t:'Meeting Recap from Chat', kind:'emul',

   does:['Start from a message in the meeting chat','Search accounts inside the card and pick one',

   why:['No step ever holds a synchronous request open while a person thinks — the cards are callback subscriptions',

   stack:'Emulated chat shell, adaptive cards, orchestration trace'},

  {id:'chat-tracker', t:'Chat to Tracker, through the CRM', kind:'emul',

   see:'Three panes: the chat thread, the CRM record it resolves to, and the issue. The metadata block at the top of the thread drives the match; the trace panel shows which key matched and how confident it was.',
   does:['Read a thread that carries a metadata block','Watch it resolve to a deal, with match source and confidence',

const CASES = {
  'Integration and sync':[
    {id:'delta-sync', t:'Delta sync with a checkpoint per page',
     sub:'Seventeen mailboxes, no background workers, no persistent storage, and a hard function timeout.',
     body:[
      ['The constraint','A full re-read every run means thousands of events and a guaranteed timeout. The calendar API offers a delta link, but there is nowhere to keep it: a scheduled function has no state between runs, and the scripting language has no supported way to write an organisation variable.'],
      ['What was built','One variable per mailbox, written through a connector call. Paging is a walk over a pre-built list of page numbers with a completion flag, because the language has no while loop. The checkpoint is written on every page, not at the end, so a break on page forty does not undo the work. Three error classes get three different reactions: an invalid sync token clears the variable and falls back to a full delta in the same run; throttling stops the mailbox but deliberately leaves the checkpoint alone; a missing item marks the mailbox skipped. Once a month a forced full resync clears the drift that deltas accumulate.'],
      ['The trade','Events deleted upstream are counted and logged but not removed, so history attached to deals survives. Page size is lower than the default: slower runs, but heavy calendars stopped failing. A hundred-page ceiling per mailbox means a run can end unfinished — the status and the saved checkpoint guarantee the next one continues.']]},
    {id:'transcript-match', t:'Matching transcripts by score, not by key',
     sub:'No shared identifier, overlapping meetings, and durations that never agree.',
     body:[
      ['The constraint','A transcript arrives with its own identifier, its own clock and its own attendee list. Time is the only shared signal, and it is weak: a sixty-minute meeting may have run twenty-two, so "same time" becomes an overlap problem between intervals of different length.'],
      ['What was built','A score rather than a boolean. Overlap is measured as two coverage ratios; the larger is taken so a meeting nested inside another still scores full, and a penalty proportional to the duration gap is subtracted. Modifiers follow: a service hint, e-mail addresses lifted out of the transcript body and intersected with the attendee list, a penalty when a transcript already exists. The strongest modifier is the recording owner — a bonus when they are present, a penalty when the attendee list is populated and they are not. Above the score sits a gate: if the owner is known and the best candidate does not contain them, a second pass runs, and if nothing qualifies the automatic link is refused outright.'],
      ['The trade','Two thresholds instead of one. The link is written above forty; the transcript text is only copied into the meeting above sixty. "I think this is the meeting" and "I am willing to write data into it" are deliberately different decisions, and every candidate is kept with its score for a human to review.']]},
    {id:'webhook-repair', t:'A receiver that repairs its own payload',
     sub:'Six event types, out-of-order delivery, and a rejection means the event is gone.',
     body:[
      ['The constraint','Events are not re-sent. A rejected write is a lost event, and the reason is unknown in advance: a date format, a length, a missing mandatory field, or a duplicate rule.'],
      ['What was built','A five-attempt loop that reads the field name out of the CRM error and rewrites the payload between attempts. A missing mandatory field gets a marked placeholder; any other named field is dropped and the attempt repeats; a duplicate error carrying a record id switches the operation from create to update. When the culprit cannot be identified the loop stops on purpose instead of spinning. Everything dropped or substituted comes back in the response, so the record is saved degraded but visible. Idempotency is separate: a rolling journal of processed event ids on the record itself.'],
      ['The trade','The rolling journal means a very old event could in theory be processed twice — the alternative was a record and an API call per event. A placeholder in a mandatory field puts marked rubbish in the data, which still beats a missing record.']]},
    {id:'attachments', t:'Attachments as links, after proving the proxy was the problem',
     sub:'A 200 with an empty body, and a platform that cannot restrict a file to a role.',
     body:[
      ['The constraint','Three at once. The tracker is only reachable through a corporate proxy. The proxy answers the upload endpoint with 200 and an empty body, and no attachment appears. And the tracker itself cannot limit a file by visibility — a comment can be closed to a role, a file is visible to everyone who can see the issue. The files that needed closing were the ones with rates in them.'],
      ['What was built','First, localisation by experiment rather than guesswork: downloading from storage works; building a multipart body works and 160 KB takes 0.88 seconds, so the bytes really do leave; JSON endpoints through the same proxy answer with content, including validation errors. Conclusion: the multipart body is what is lost. The fix is not a file but a remote link — a JSON call carrying a stable global id. JSON passes the proxy, the global id makes a ten-minute sync idempotent, and the link inherits the permissions of the storage it points at, which solves the third problem too.'],
      ['The trade','The file is not physically in the tracker; someone without access to the folder hits a login. Accepted deliberately, because the alternative hands rates to everyone who can open the issue.']]}],
  'Platform and tooling':[
    {id:'code-extraction', t:'Extracting org code the platform will not export',
     sub:'No API returns the list of functions. Not one.',
     body:[
      ['The constraint','Without a list there is no way to download even the functions whose per-id endpoint works. The documented parameter rejects every value; the CLI exports metadata and widgets, never automation.'],
      ['What was built','A negative result first, recorded rather than hidden: fifty-five parameter values and roughly a hundred and fifty combinations of endpoint, API version and headers, across production, sandbox and the interface domain. Then four routes in order — ids harvested from a captured session, a console script running under session cookies, a function deployed inside the org that calls the closed endpoint from the inside where authorisation differs, and finally the interface’s own internal call. Fifteen hundred functions in ten to fifteen minutes.'],
      ['The trade','The route depends on a browser session that expires in about half an hour and on an internal object the vendor may rename. So it is written up as a reproducible procedure with its failure points named, not as a one-off trick.']]},
    {id:'org-snapshot', t:'A config snapshot in git, standing in for the change history the platform lacks',
     sub:'Who changed which rule, and when, is not a question the platform answers.',
     body:[
      ['The constraint','Half the configuration is not exposed to the documented API at all — schedules, client scripts, buttons, webhooks, connections, approvals, pipelines. Those live behind the interface domain and a session token, and every setting sits on its own API version with no way to predict it.'],
      ['What was built','A twenty-five minute refresh covering modules and layouts, rules, buttons, views, blueprints, schedules, webhooks, connections, roles and profiles. Versions were found empirically and pinned; response diagnostics are written to their own file so it is visible which endpoints answered at all. The snapshot lives in git, and the diff between commits does the job the missing change history would have done.'],
      ['The trade','An explicit list of what is not covered and needs a manual export. The gaps are declared up front rather than discovered later.']]},
    {id:'org-audit', t:'Classifying fifteen hundred functions across five entry points',
     sub:'The platform keeps no reverse references, so "is this dead" has no direct answer.',
     body:[
      ['The constraint','A function can be reached from a rule, a schedule, a button, a widget, or another function. Five channels, five different places to look, and none of them linked.'],
      ['What was built','One index across all five, so every function judged dead carries an explicit trail — not found in the rule map, not in schedules, not on a button, not in the widget grep, not called by another function — plus a cycle check among the orphans. Alongside it: buttons deleted without their functions, rules sharing identical criteria, and rules marked active that had never once run because their criteria referenced a renamed field.'],
      ['The trade','And the point of the whole exercise. One class of function was unreachable by the same method — a different identifier namespace, with a name match rate of one in twenty-two. Rather than omitting it, the report opens with a completeness section stating plainly that anything called only from there is misclassified, and listing three ways to close the gap. An audit that names the limit of its own method is worth more than one that reads clean.']]}],
  'AI in the CRM':[
    {id:'loss-analysis', t:'Loss analysis in two stages, with the taxonomy in the prompt',
     sub:'A free-text answer is useless for reporting. It has to land in the company’s own categories.',
     role:'Prototyped the direction and contributed to the design; another engineer implemented and owned it.',
     body:[
      ['The constraint','The evidence is spread across the CRM, the issue tracker and analytics; the function time limit does not allow gathering it and reasoning about it in one call; and an unconstrained answer cannot be compared between deals.'],
      ['What was built','Roughly ten times more code gathering evidence than calling the model. Six sources, plus derived behavioural signals that exist nowhere as fields — how many times the start date moved, which stage the deal stalled in, whether this client had ever been won before. Tracker comments are filtered by author so the model reads the outside voice, not the CRM’s own echo. Then two stages: the first is explicitly forbidden to analyse and must list the holes in the data; its output is materialised as a record; the second reads that and does one thing — place the case in a seven-kilobyte taxonomy of thirty-eight causes with rules for choosing between them. A human can correct the middle and re-run only the second stage.'],
      ['The trade, said out loud','No structured output anywhere: the answer is parsed by markdown anchors and substring checks. Stop reasons are not inspected, so a truncated answer is indistinguishable from a complete one. And the category is never written to a structured field — the assignment is commented out — so the very reporting the pipeline exists for cannot be built. A schema, validation against the taxonomy, and a picklist field are the obvious repairs.']]},
    {id:'agent-journal', t:'A CRM agent with an action journal',
     sub:'Designed for this site, not run in production. Said plainly, because it would come out in the first question.',
     body:[
      ['The constraint','Three problems kill the naive version. Speech recognition mangles mixed-language technical vocabulary and company names. An agent granted write access can be wrong and nobody would know which record it touched — the built-in audit log exports only through the interface and is no control loop. And a command from a chat arrives with no context about which record is meant.'],
      ['What was built','A speech layer with a domain vocabulary supplied as an initial prompt. An intent layer that must return a structured intent — module, record, fields, operation — validated against the live field list, refusing rather than guessing. Entity resolution that reuses the priority chain from the meeting work and asks again when the answer is ambiguous. Execution through the CRM’s own tool interface, with one hard condition: every action writes to a journal module — time, channel, the original utterance, the parsed intent, the target record, a before/after diff, the result. And a confirmation screen showing that diff for anything above a risk threshold.'],
      ['The trade','The journal duplicates what the record already holds. Taken deliberately: without it the agent is opaque, and an opaque agent does not survive its first disputed edit. The risk threshold is a list of fields rather than a judgement call — crude, but predictable and explainable.']]}],
  'Interfaces':[
    {id:'reconciliation', t:'Reconciliation with a third column',
     sub:'"Sixty minutes here, forty-five there" does not tell anyone what it should be.',
     body:[
      ['The constraint','Two columns are not enough to act on, and matching records across the two systems is itself ambiguous — the external identifier is missing on some of them.'],
      ['What was built','Three levels of matching with four in-memory indexes and constant-time updates after a single edit. A third column — the expected value — beside the two sources, and a diff view with a six-state legend. A status column with five states, bulk operations with progress and a per-row error log.'],
      ['The trade','Create and update semantics are deliberately separate in the payload builder: two fields are never written because of length ceilings, one is truncated, the meeting type is never overwritten from outside, and several fields are written only on creation so a sync cannot erase a human edit. Every exclusion carries the reason next to it.']]},
    {id:'time-model', t:'Two kinds of time on one screen',
     sub:'The platform accepts a valid-but-wrong timestamp without a word.',
     body:[
      ['The constraint','System fields are absolute instants; the business fields are wall-clock time in the event’s zone, stored as text. A browser helper silently substitutes the device zone, and the write succeeds.'],
      ['What was built','One rule: time follows the event, not the device. The offset is derived for the specific date, so daylight saving is included, and the string is assembled by hand. Wall-clock text round-trips untouched. A priority chain resolves the zone, and when the last fallback fires the interface says so. For the calendar API, a forty-zone dictionary translates Windows zone names — and an unknown name yields null rather than a silent UTC, because the silent version moved times by hours with no message anywhere.'],
      ['The cost that produced it','A zone was recalculated from country and state on every save, and an empty state returned an east-coast default. For a campaign on the west coast, all thirteen meetings created went out three hours wrong. The fix pins the zone once, keeps the lookup as a warned fallback, and surfaces the conflict. Verified across six device zones.']]}]
};

function renderRows(res){
  if (!res.data.length) return '<p class="result">No rows.</p>';
  const cols = Object.keys(res.data[0]);
  const cell = v => v == null ? '<span style="color:var(--ink-3)">null</span>'
    : (typeof v === 'object' ? esc(v.name ?? '') + ' <span style="color:var(--ink-3)">#' + esc(v.id) + '</span>' : esc(String(v)));
  return '<div class="scroll"><table><thead><tr>' + cols.map(c=>'<th>'+esc(c)+'</th>').join('')
    + '</tr></thead><tbody>' + res.data.slice(0,60).map(r=>'<tr>'
    + cols.map(c=>'<td'+(typeof r[c]==='number'?' class="num"':'')+'>'+cell(r[c])+'</td>').join('')
    + '</tr>').join('') + '</tbody></table></div>'
    + (res.data.length > 60 ? '<p class="result">Showing the first 60 of '+res.data.length+' returned rows.</p>' : '');
}

function wirePlatform(){
  const q = document.getElementById('q'), out = document.getElementById('out'), meta = document.getElementById('meta');
  if (!q) return;
  q.value = SAMPLE_QUERIES[0][1];
  const run = async () => {
    out.innerHTML = ''; meta.textContent = 'running…';
    const t0 = performance.now();
    try {
      const res = await ZOHO.CRM.API.coql({ select_query: q.value.replace(/\s+/g,' ').trim() });
      const ms = Math.round(performance.now() - t0);
      meta.textContent = res.info.count + ' of ' + res.info.total + ' matching · more_records=' + res.info.more_records + ' · ' + ms + ' ms';
      out.innerHTML = renderRows(res);
    } catch (e) {
      meta.textContent = '';
      out.innerHTML = '<div class="errbox"><b>' + esc(e.code || 'ERROR') + '</b> — ' + esc(e.message)
        + (e.details && Object.keys(e.details).length ? '<br>details: ' + esc(JSON.stringify(e.details)) : '') + '</div>';
    }
  };
  document.getElementById('run').onclick = run;
  q.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run(); });
  document.getElementById('samples').onclick = e => {
    const b = e.target.closest('button[data-q]'); if (!b) return;
    q.value = SAMPLE_QUERIES[+b.dataset.q][1]; run();
  };
  document.getElementById('chaos').onclick = e => {
    const b = e.target.closest('button[data-m]'); if (!b) return;
    mockZoho.chaos.mode = b.dataset.m;
    document.querySelectorAll('#chaos button[data-m]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    run();
  };
  document.getElementById('reset').onclick = () => { mockZoho.reset(); meta.textContent = 'data reset'; out.innerHTML = ''; };
  run();
}

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [kind,id] = h.split('/');
  let body, crumb;
  if (!kind){ body = viewOverview(); crumb = 'overview'; }
  else if (kind==='event'){ body = viewEventPage(); crumb = 'live demo / event campaign page'; }
  else if (kind==='platform'){ body = viewPlatform(); crumb = 'platform emulator'; }
  else if (kind==='how'){ body = viewAbout(); crumb = 'about / how this site works'; }
  else if (kind==='demo'){ const it = DEMOS.find(d=>d.id===id);
    body = it ? viewDemo(it,'live demo') : viewOverview(); crumb = 'live demo / '+id; }
  else if (kind==='flow'){ const it = FLOWS.find(d=>d.id===id);
    body = it ? viewDemo(it,'emulated flow') : viewOverview(); crumb = 'emulated flow / '+id; }
  else if (kind==='case'){ const it = Object.values(CASES).flat().find(d=>d.id===id);
    body = it ? viewCase(it) : viewOverview(); crumb = 'write-up / '+id; }
  else { body = viewOverview(); crumb = 'overview'; }

  document.getElementById('view').innerHTML = body;
  document.getElementById('crumb').textContent = crumb;
  document.querySelectorAll('.navlink').forEach(a =>
    a.classList.toggle('on', a.getAttribute('href') === (location.hash || '#/')));
  document.getElementById('view').classList.toggle('wide', kind==='event');
  if (kind==='platform') wirePlatform();
  if (kind==='event') wireEventPage();
  window.scrollTo(0,0);
}

buildNav();
addEventListener('hashchange', route);
route();
</script>
