      ['refuse','When should automation refuse?','Score thresholds, ambiguous matches, and the queue a person works instead.']],
     body:[
      ['The common shape','Every one of these crosses a boundary the CRM does not own. On the other side sits a calendar that cannot be asked about every meeting, a chat card that cannot fetch a row, an events feed that never re-sends, a tracker whose files cannot be closed to a role, and a conference export whose company column is regularly wrong. None of that can be fixed from this side, so the work is deciding — in writing, before the code — what the CRM is allowed to believe, what it is allowed to overwrite, and where it should stop and hand the row to a person. Eight of those decisions follow, ordered by the question each one answers.'],
      ['Who owns the field?',
       'Three of these are the same argument in different clothes: two systems hold a value, both have a legitimate claim to it, and something has to decide which one is allowed to be right. The answer is never “whichever wrote last”, because that rule silently prefers the system that runs most often over the one that knows most.', 'who-owns'],
      ['Which system is allowed to be right','A meeting exists in a calendar, in the CRM, in a chat thread and in an issue. Each has a legitimate claim on part of it. Left alone, every sync overwrites the previous one and the humans stop trusting the record. Written down as a table, this settles most arguments before they start. Enforcement lives in the payload builder, where create and update are separated: two fields are never written at all because of length ceilings, one is truncated, and several are written only on creation so a sync cannot erase a human edit. The mechanism is what matters, so those fields are not named in the matrix below.'],
      ['One field, two systems, and a rule about who wins','A meeting is held, or declined, or still booked. Deciding it from the calendar means asking the calendar about every meeting, every hour — impossible at any real volume. Deciding it from the CRM alone means never learning about cancellations, because a cancellation happens in the calendar and the CRM row simply becomes a past meeting that looks attended. So: two processes, each authoritative over exactly one thing. The hourly one works only from CRM data, computing an end time from the start plus the duration with two fallbacks, and moves a row from booked to held; it never touches a declined row, because that is a final state. The second and much more expensive one is authoritative over one question only — was this cancelled — and asks the calendar about rows already marked held, where a cancelled flag and a missing event both mean declined. It walks one month per run, capped at a few hundred rows, so a full year takes twelve passes and a cancelled meeting can sit mislabelled for a while: the deliberate price of not calling the calendar hourly for everything. The month is a constant in the code rather than a parameter — crude, but the run is then perfectly reproducible. The write result comes back in three different shapes depending on the path taken, so success is checked three ways in sequence; and a row locked by a state machine refuses the write with a marker buried inside the response body rather than a status code, so those are counted as skipped, not as failures, because they are neither.'],
      ['Keeping what a human typed through an automatic resync','Every time a meeting updates from the calendar, its participant list is rebuilt: internal people matched against the staff directory, external ones against the account’s contacts. But the calendar knows nothing about buyer roles — economic, technical, user, coach — and those are exactly what somebody sat down and worked out. So existing participants are read first and indexed by a composite key of address and role; for each external address the rebuild checks all four roles for an existing key before assigning anything, and restores the role it finds. Only a genuinely new person gets a default. Historic rows carry the old spelling of those roles, from before the picklist was renamed, so a second pass maps the old values onto the new ones rather than quietly dropping the classification on every record created before the rename. What stays risky is the write path: the roles live in a subform, and a subform is replaced wholesale rather than patched row by row, so anything not in the array being sent stops existing. The role-restoring logic makes the content correct and does nothing about that. Saying so is more useful than implying the problem is solved.'],
      ['How does the sync resume?',
       'Three more are about what happens after a run stops halfway. Events are not re-sent, a person filling in a form is slower than any request will wait, and a corporate proxy fails in a way that looks exactly like the other system rejecting you. Each of these needed a checkpoint, a callback, or a way to prove which side actually broke.', 'resume'],
      ['A receiver that repairs its own payload','Events are not re-sent. A rejected write is a lost event, and the reason is unknown in advance: a date format, a length, a missing mandatory field, or a duplicate rule. So a five-attempt loop reads the field name out of the CRM error and rewrites the payload between attempts — a missing mandatory field gets a marked placeholder, any other named field is dropped and the attempt repeats, and a duplicate error carrying a record id switches the operation from create to update. When the culprit cannot be identified the loop stops on purpose instead of spinning. Everything dropped or substituted comes back in the response, so the record is saved degraded but visible. Idempotency is separate: a rolling journal of processed event ids on the record itself, which means a very old event could in theory be processed twice — the alternative was a record and an API call per event. A placeholder in a mandatory field puts marked rubbish in the data, which still beats a missing record.'],
      ['A two-card wizard in a chat, with nothing held open','A person takes minutes to fill in a form; a synchronous call has seconds. The trigger has to answer quickly, and a card is not an application: it has no state, cannot fetch more rows, and ends when it is submitted. Holding the request open while somebody thinks is not slow — it is impossible. So every human step is a callback subscription rather than a wait: the card posts, the flow suspends, the answer arrives as a new event. Around the card sits a loop — the card reports which button was pressed, and if it was a search rather than a submit, the loop reissues the card with fresh results, which is how a search across hundreds of accounts happens inside something that cannot fetch. The loop is bounded, a fixed number of iterations and half an hour, so a card somebody forgot about cannot hold a run open indefinitely. One detail is worth keeping: a dropdown returns exactly one value, so when the opportunity already linked to the meeting belongs to a different account it travels as a marked value — a prefix the saving function recognises and strips — and both ends know the choice was deliberate, through a control that cannot carry a flag. The first design edited the previous card in place, which meant tracking message identifiers and lost a race whenever two events arrived close together; replacing the card instead costs a little clutter in the chat and removes the entire class of problem.'],
      ['Attachments as links, after proving the proxy was the problem','Three constraints at once. The tracker is only reachable through a corporate proxy; the proxy answers the upload endpoint with 200 and an empty body, and no attachment appears; and the tracker itself cannot limit a file by visibility — a comment can be closed to a role, a file is visible to everyone who can see the issue, and the files that needed closing were the ones with rates in them. Localisation came by experiment rather than guesswork: downloading from storage works; building a multipart body works and 160 KB takes 0.88 seconds, so the bytes really do leave; JSON endpoints through the same proxy answer with content, including validation errors. Conclusion: the multipart body is what is lost. The fix is not a file but a remote link — a JSON call carrying a stable global id. JSON passes the proxy, the global id makes a ten-minute sync idempotent, and the link inherits the permissions of the storage it points at, which solves the third problem too. The file is not physically in the tracker, so someone without access to the folder hits a login — accepted deliberately, because the alternative hands rates to everyone who can open the issue.'],
      ['When should automation refuse?',
       'The last two are the ones where the correct behaviour was to stop. Both had enough evidence to make a confident guess and not enough to be right, and a confident wrong link is more expensive than no link at all — it gets believed. Both end in a queue a person works rather than a decision the system made alone.', 'refuse'],
      ['Matching transcripts by score, not by key','A transcript arrives with its own identifier, its own clock and its own attendee list. Time is the only shared signal, and it is weak: a sixty-minute meeting may have run twenty-two, so “same time” becomes an overlap problem between intervals of different length. The answer is a score rather than a boolean. Overlap is measured as two coverage ratios and the larger is taken, so a meeting nested inside another still scores full, with a penalty proportional to the duration gap subtracted. Modifiers follow: a service hint, e-mail addresses lifted out of the transcript body and intersected with the attendee list, a penalty when a transcript already exists. The strongest modifier is the recording owner — a bonus when they are present, a penalty when the attendee list is populated and they are not. Above the score sits a gate: if the owner is known and the best candidate does not contain them, a second pass runs, and if nothing qualifies the automatic link is refused outright. Two thresholds instead of one: the link is written above forty, the transcript text is only copied into the meeting above sixty. “I think this is the meeting” and “I am willing to write data into it” are deliberately different decisions, and every candidate is kept with its score for a human to review.'],
      ['Sorting a conference export into buckets instead of matching it','Several hundred rows, no shared key with anything, and half the company names in the file are wrong. There is no single identifier: profile URLs are written differently on each side, email is missing for many people, the company column is regularly wrong, and enrichment names are sometimes mangled. So not a match — a classification, worked independently per bucket, as the funnel below sets out. Three write rules are what make the tool safe to run twice: a name is corrected only when the surname differs, because otherwise every Alex becomes an Alexander; title and email are filled only into an empty field and never over a live value; and everything else that merely differs is reported for a human to look at.'],
      ['What the eight have in common','Three habits, and they are the actual content of this page. Write the ownership rule down before the code, because a rule that lives only in someone’s head gets re-decided on every sync. Separate “I think this is right” from “I am willing to write it” — the two thresholds in the transcript matcher, the create-versus-update split in the payload builder, the fill-only-into-an-empty-field rule in the import. And leave the ambiguous rows to a person on purpose: the funnel above ends in two human buckets, the transcript matcher refuses a link rather than guessing, and the receiver itemises what it dropped instead of hiding it. Each of those costs throughput, and each was the right trade at this volume. Where it is not — the wholesale subform write, the month-long lag on a cancellation, the rolling idempotency journal — is named in the sections above rather than smoothed over.']]}],
  'Platform and tooling':[
    {id:'org-tooling', t:'Building tooling for an org that will not export itself',
     sub:'Five problems, one method: when the platform refuses to answer a question, build the instrument that answers it anyway — and say plainly what it still cannot see.',
     dg:{kind:'authority', at:5,
      aria:'Ownership matrix: seven operations against a simple invoke key and a full OAuth flow, with the rule the line follows the secret, not the convenience',
      cols:[{id:'simple',n:'Simple key (function invoke)'},{id:'oauth',n:'Full OAuth flow'}],
      rows:[
       {id:'call-fn', n:'Call a server-side function'},
       {id:'read', n:'Read records'},
       {id:'create', n:'Create'},
       {id:'update', n:'Update'},
       {id:'delete', n:'Delete'},
       {id:'query', n:'Run a query'},
       {id:'third-party', n:'Use a third-party credential'}
      ],
      cells:{
       'call-fn:simple':'owner', 'call-fn:oauth':'never',
       'read:simple':'never', 'read:oauth':'owner',
       'create:simple':'never', 'create:oauth':'owner',
       'update:simple':'never', 'update:oauth':'owner',
       'delete:simple':'never', 'delete:oauth':'owner',
       'query:simple':'never', 'query:oauth':'owner',
       'third-party:simple':'owner', 'third-party:oauth':'never'
      },
      rule:'The line follows the secret, not the convenience.',
      detail:{
       'call-fn:simple':{t:'Call a server-side function — simple key', d:'The simple key that lets an outside script invoke a server-side function.'},
       'third-party:simple':{t:'Third-party credential — stays behind the simple key', d:'Anything needing a third-party credential stays inside a server-side function and is invoked with the simple key, so the credential never leaves the platform.'},
       'read:oauth':{t:'Read — full OAuth flow', d:'Create, update, delete, query — everything that touches records goes directly over the full flow from the tool, with the token cached and refreshed a minute before it expires.'},
       'create:oauth':{t:'Create — full OAuth flow', d:'Batched at ninety per write, following the platform’s own limits.'},
       'delete:oauth':{t:'Delete — full OAuth flow', d:'Batched at a hundred per delete.'},
       'query:oauth':{t:'Query — full OAuth flow', d:'No more than a hundred values in a single set membership test.'}
      }
     },
     body:[
      ['One searchable system for the function estate','No API returns the list of functions — not one; the documented parameter rejects every value, and the CLI exports metadata and widgets, never automation. The fix begins with a negative result recorded rather than hidden: fifty-five parameter values and roughly a hundred and fifty endpoint, version and header combinations tried across production, sandbox and the interface domain. Then four routes in order — ids harvested from a captured session, a console script running under session cookies, a function deployed inside the org that calls the closed endpoint from the inside where authorisation differs, and finally the interface’s own internal call. More than a thousand functions in ten to fifteen minutes, in one place a person can grep. Everything below depends on the estate existing as text; none of it is reachable from a browser editor showing one function at a time.'],
      ['Dependencies and invocation paths','A function can be reached from a workflow rule, a schedule, a button, a widget, or another function — five channels, none of them linked to each other, and no reverse reference anywhere in the platform. One index across all five turns “is this still used?” into a question with an answer and a trail behind it: not in the rule map, not in schedules, not on a button, not in the widget grep, not called by any other function, plus a cycle check so a cluster of orphans calling only each other is not mistaken for live code. The same index answers the question in the other direction — what breaks if this changes — which is the one a reviewer actually needs before approving anything. It also surfaces what nobody was looking for: buttons deleted while their functions stayed behind, rules duplicating each other’s criteria, and rules marked active that had never once run, because a criterion still names a field that was renamed underneath it.'],
      ['Git as the missing change history','Half the configuration — schedules, client scripts, buttons, webhooks, connections, approvals, pipelines — sits behind the interface domain with no documented API, each setting on its own unpredictable API version. A twenty-five minute refresh covers modules, layouts, rules, buttons, views, blueprints, schedules, webhooks, connections, roles and profiles; the versions were found empirically and pinned, and response diagnostics are written to their own file so it stays visible which endpoints answered at all. The snapshot lives in git, and the diff between two commits does the job the platform’s absent change history would have done: who altered the criteria on that rule, and the day it stopped firing. What still needs a manual export is listed up front, so a gap in the history is a declared limitation rather than something discovered during an incident.'],
      ['Deploy and run after review','Once the estate is text under review, putting it back has to be as controlled as taking it out. Approved functions are deployed and executed through the same tooling instead of being pasted into the browser editor, and a deployment counts as successful only when an independent read returns what was meant to be written — the platform will accept a save and then serve something else, so the write itself is not evidence. Run output is captured against the change that produced it, which makes a failure attributable to a version rather than to a memory. The full pipeline around this — pull, analyse, review, deploy, run, verify — is its own write-up.'],
      ['External calls and credential boundaries','A connection is referenced by a literal string inside a function body: no index, no usage view, nothing that notices when a connection stops authenticating while code carries on calling it. A sweep across every function and widget script normalises each outbound call into a URL pattern and attaches it to its connection and, where one exists, the rule that triggers it — one row per service, carrying call volume, distinct files, methods, connections and the share of calls wrapped in error handling. The findings changed behaviour rather than filling a report: a large share of connections turned out never to be used at all; a handful had stopped authenticating and were still being called from hundreds of places, which means those calls had been failing silently; error-handling coverage across the busiest services was close to zero; and one shared credential appeared inline in hundreds of files, which makes rotation a refactor instead of a setting. The boundary drawn afterwards follows the secret rather than the convenience. Anything needing a third-party credential stays inside a server-side function invoked by a simple key, so the credential never leaves the platform; everything that touches records goes over the full authorisation flow, with an authorisation failure clearing the cached token and retrying, a rate limit respecting the interval the server asks for before falling back to bounded backoff, and batch sizes following the platform’s own ceilings — a hundred per delete, ninety per write, pages of two hundred for reads, no more than a hundred values in a single set membership test. Bulk loads pass an empty trigger list, suppressing every rule and state machine for the duration; without it, two hundred records fire the whole automation estate and the run stops being predictable. That suppression has a bill attached — legitimate automation has to be caught up separately afterwards — and it is paid deliberately rather than discovered later.'],
      ['What the audit still cannot prove','One class of function is unreachable by this method: it lives in a different identifier namespace, and matching it by name succeeds about once in twenty-two attempts. Anything called only from there is therefore misclassified, and the report opens with that fact rather than closing with it, naming three ways the gap could be closed. The reachability verdict is honest only inside its own five channels — it is evidence of absence there and nowhere else, so “dead” means no entry point was found among the things this method can see, which is a narrower claim than it looks. The extraction route underneath all of it rests on a browser session that expires in about half an hour and on an internal object the vendor is free to rename, which is why it is written up as a reproducible procedure with its failure points named rather than as a tool that will keep working. An audit that states the limit of its own method is worth more than one that reads clean.']]}],
  'AI in the CRM':[
    {id:'loss-analysis', t:'Loss analysis in two stages, with the taxonomy in the prompt',
     sub:'A free-text answer is useless for reporting. It has to land in the company’s own categories.',
     role:'Prototyped the direction and contributed to the design; another engineer implemented and owned it.',
     body:[
      ['The constraint','The evidence is spread across the CRM, the issue tracker and analytics; the function time limit does not allow gathering it and reasoning about it in one call; and an unconstrained answer cannot be compared between deals.'],
      ['What was built','Roughly ten times more code gathering evidence than calling the model. Six sources, plus derived behavioural signals that exist nowhere as fields — how many times the start date moved, which stage the deal stalled in, whether this client had ever been won before. Tracker comments are filtered by author so the model reads the outside voice, not the CRM’s own echo. Then two stages: the first is explicitly forbidden to analyse and must list the holes in the data; its output is materialised as a record; the second reads that and does one thing — place the case in a seven-kilobyte taxonomy of thirty-eight causes with rules for choosing between them. A human can correct the middle and re-run only the second stage.'],
      ['The trade, said out loud','No structured output anywhere: the answer is parsed by markdown anchors and substring checks. Stop reasons are not inspected, so a truncated answer is indistinguishable from a complete one. And the category is never written to a structured field — the assignment is commented out — so the very reporting the pipeline exists for cannot be built. A schema, validation against the taxonomy, and a picklist field are the obvious repairs.']]},
    {id:'agent-journal', t:'An agent allowed to write, and a journal that keeps it honest',
     sub:'Designed and built for this portfolio; not run against a production org. Said plainly, because it would come out anyway.',
     body:[
      ['Three problems, one screen','Recognition mangles mixed-language vocabulary and company names; a write-capable agent can be wrong with no control loop, because the platform’s own audit trail only exports through the interface; and a chat command names no record. The screen below is the answer to all three at once, not a description of one — try it.'],
      ['Why a journal and not a log file','Every action writes to a module, not a file: time, channel, utterance, parsed intent, target record, a before-and-after diff, the result. A module is a screen with filters. Above a risk threshold — a fixed list of fields, not a judgement the model makes — the diff is shown and the agent waits for a person.'],
      ['The trade','The journal duplicates what the record already holds; taken knowingly, because the alternative is an agent nobody can audit. What stays true even now it is live: nothing here runs against a real org, and the parsing is pre-recorded rather than a live model call, exactly like the rest of this site.']]},
    {id:'ai-workflow', t:'How AI-assisted delivery is verified',
     sub:'AI designs, generates and reviews across the org; source review, controlled deployment and automated checks decide what ships.',
     body:[
      ['Generation is not the bottleneck; verification is',
       'A model writes a Deluge function, a widget screen or a migration script in seconds. Establishing that any of it is correct — that it does what the ticket meant, that it did not quietly break one of the other things calling it, that it respects a platform limit nobody wrote down — takes the rest of the time. That ratio is the whole shape of the workflow. Everything below exists because typing was never the expensive part, and treating generated code as finished because it was fast is the specific mistake this is built to prevent.'],
      ['What AI actually does across the org',
       'It is used throughout delivery rather than at one step: designing new functions and interfaces before they are written, generating Deluge, JavaScript and Python, reviewing code that already exists, expanding test coverage, identifying which changes carry regression risk, analysing dependencies across the function estate, and keeping documentation level with what shipped. What makes that possible is not the model — it is that the org exists as text first. Against a browser editor showing one function at a time there is no context to reason with; against an extracted estate with a dependency index, the question “what else calls this” has an answer, and a review is about the system rather than the snippet on screen.'],
      ['The acceptance boundary',
       'None of that output ships because it looks right. A change goes through source review the same way any change would, and the reviewer is a person who remains accountable for it afterwards — AI-assisted authorship does not move ownership. Deployment runs through the tooling rather than the browser editor, and a save is only accepted when an independent read returns what was meant to be written. Behavioural checks run before promotion, and a failure stays attached to the change that caused it. The boundary is deliberately boring: it is the same boundary a team without AI would need, and the only thing AI changes is how much work arrives at it.'],
      ['The same gates, turned on this site',
       'This portfolio is one instance of that workflow rather than the subject of it, and it is the instance that can be shown. '+TEST_COUNT+' headless checks fail the build on any console error rather than only on a failed assertion, because a widget that throws quietly is a widget that fails silently in front of a reader. The build refuses to write a page whose inline scripts do not parse. A CI guard scans for anything shaped like a real org identifier, host, domain or credential and stops the build if it finds one, since a public portfolio is exactly the surface on which a leaked credential would sit unnoticed. The dataset generator is seeded, so a diff is reviewable rather than noise. And one rule holds across every pass: one surface at a time, with the discrepancies written down and agreed before anything is touched.'],
      ['What the gates cannot catch',
       'They catch form, not meaning. A console-clean, leak-free build that faithfully reproduces the wrong behaviour passes every check here, and the same is true in the org: a function can be reviewed, deployed, verified by read-back and still encode a rule the business never asked for. Fidelity to intent is held by the person who owns the change, not by the machinery around it. Saying “I use AI to build” describes nothing on its own; the gates are the part worth describing, and the honest version of the claim is that they move the risk from typing errors to reasoning errors rather than removing it.']]},
    {id:'mcp-product', t:'Scoped AI access to CRM',
     sub:'Typed operations over records and the platform tooling around them, with permissions, validation and the audit trail defined outside the model.',
     body:[
      ['What the MCP surface exposes',
       'Claude reaches the CRM through a scoped MCP surface rather than a general-purpose connection: a fixed set of typed operations over records — read, search and query, create, update, delete, related lists, and the field and layout metadata needed to know what a module actually contains — alongside the operations belonging to the tooling around the platform, so the same session that reads a record can pull a function, see what calls it, deploy an approved version and run it. The list is the boundary. There is no escape hatch letting a model compose an arbitrary request, which means the answer to “what could this do if it were wrong” is a list somebody wrote rather than a guess about a model.'],
      ['What remains outside model judgement',
       'A CRM workflow is mostly evidence-gathering, and a model dropped into the wrong part of one returns a plausible ungrounded answer instead of a correct one — so the split is stated as a rule rather than left to taste. Deterministic operations stay deterministic: a stage change, a lookup, a picklist validation, a query across two hundred records. Nothing about any of them improves when a model guesses. Classification and rewriting are where the model belongs: turning a rambling transcript into a recap, placing a loss reason inside a taxonomy, correcting a misheard company name. The record shapes, the required fields and the refusals live outside the model in the surface definition, where somebody can review them without having to read a prompt to find out what the system will accept.'],
      ['Skills as repeatable workflows',
       'A tool call is one action; the work is almost always a sequence of them, and retyping that sequence as a prompt is how it drifts. Reusable skills carry the sequence instead — pull the relevant functions, analyse what calls what, check a change against the platform’s constraints, deploy, run, verify — which turns one-off prompting into repeatable development, audit and operational workflows with the stages written down where a person can disagree with them. It also makes the process reviewable in the ordinary way: a skill is a file, so a change in how the org gets audited arrives as a diff rather than as a different mood on a different day.'],
      ['The function tooling behind the agent',
       'None of this works against a platform that will not show you its own code, and Zoho will not. The MCP surface is thin on purpose because the layer underneath it is not: the extraction that puts the whole function estate somewhere searchable, the dependency and invocation index, the configuration snapshot in git, and the deploy-and-run path with its read-back check. The agent is a way to reach that tooling in a sentence, not a capability of its own. Which is why the useful question about it is never how good the model is, but how complete the estate it can see happens to be — a confident answer drawn from a partial extraction is the failure mode worth worrying about here.'],
      ['Permissions, confirmation and auditability',
       'Access is scoped by the credentials the surface itself holds rather than by what the model is asked to do, so a request outside that scope fails at the boundary instead of inside the model’s judgement. Changes that matter are confirmed before they happen, and what was done stays attached to the change that caused it. Then the honest limit: MCP is access control, not correctness control. A well-typed call can carry a badly reasoned instruction, and nothing about a typed surface makes the instruction good — the validation, the risk gate and the person reading the diff are still the parts doing the real work. What the surface buys is narrower and worth having anyway: the damage a wrong instruction can do is bounded in advance by a list somebody wrote down.']]}],
  'Full-stack':[
    {id:'harness', t:'The test harness this site grew from',
     sub:'A widget only runs inside the CRM, and deploying to production to see if a change works is not verification.',
     body:[
      ['The constraint','Every widget on this site is an iframe the platform loads, initialised through an SDK it controls. There is no offline mode, no local server that behaves like the platform, and no sanctioned way to run a widget without a live org in front of it — so the only feedback loop on offer was pushing to production and watching.'],
      ['What was built','An offline test harness: stubbed SDK primitives plus a headless browser, so every widget on this site runs the same code it would run inside the CRM, against a generated dataset, with nothing live behind it. Checks spread across many files cover routing, the record pages, both booking wizards and the chat flow. The suite fails on any console error, not only a failed assertion — a widget that quietly logs and carries on is still a bug. `test/browser.mjs` locates Playwright wherever it happens to live, a local devDependency or a global CI install, so the same test files run unmodified in both places.'],
      ['The trade','The stand reproduces the surface of the SDK, not the platform underneath it. Anything a widget does through an undocumented call, a quirk of the real iframe host, or a platform-side limit this stand does not model will pass here and still need a first run against a real org — this catches regressions in what is already understood, not everything the platform can do.']]},
    {id:'generator', t:'A seeded dataset with deliberate defects',
     sub:'Random data makes every diff noisy; clean data makes the demo dishonest, because a real CRM is never this tidy.',
     body:[
      ['The constraint','A dataset regenerated differently on every run turns every code review into a diff against noise — nobody can tell whether a changed number is a bug or a new random seed. But a dataset scrubbed clean of the mess real CRMs accumulate would misrepresent the actual job: contacts with no email, meetings that drift out of sync with the calendar, and duplicate-looking records are not edge cases, they are Tuesday.'],
      ['What was built','A seeded generator: the same seed produces the same dataset every time, so a pull request changes exactly what it says it changes and nothing else. On top of that, defects are injected on purpose rather than accidental — contacts missing an email address, meetings whose stored time has drifted from what the calendar would say — because the widgets that handle those cases need something to handle. A trimmed copy, `dataset.slim.json`, ships with the build, alongside a referential-integrity check that fails outright if the trimming leaves a dangling reference behind.'],
      ['The trade','The trimmed dataset still runs to 1.13 MB inlined directly into the page. That is the cost of having no backend: every record the demos touch has to already be sitting in the browser before the first click.']]},
    {id:'ci-guards', t:'CI guards against leaks',
     sub:'A portfolio that leaks a real employer’s data is worse than no portfolio at all.',
     body:[
      ['The constraint','Every surface on this site is a rebuild of something that first existed inside a real org, which means every source file is a place a real identifier, host or naming convention could slip back in — a copy-pasted comment, a variable name carried over out of habit, a fixture value nobody thought to change.'],
      ['What was built','Three guards run in `deploy.yml` before anything ships: a referential-integrity check over the generated dataset, an identifier scan across the source files for anything shaped like a real org id, host, corporate domain or credential, and the full behavioural test run. Any one of the three failing blocks the deploy.'],
      ['The trade','The identifier scan matches shape, not meaning — a pattern search, not a reviewer who understands what it is looking at. What counts as safe to say about the work versus what must never cross over is a written map and a discipline followed by hand, not something a regular expression can enforce on its own.']]}],
  'Salesforce':[
    {id:'sf-sync', t:'Apex vs Deluge: the same sync, twice',
     sub:'The delta-sync pattern from the Zoho side, rebuilt on Salesforce primitives. Not the code — the decisions.',
     body:[
      ['The constraint','Same shape as the Deluge original running behind the event campaign page\'s calendar sync: seventeen mailboxes, a delta query per mailbox, a hard ceiling on how long any one unit of work may run, and three error classes that each need a different reaction — throttling should slow a mailbox rather than fail it, an invalid or expired token should fall back to a full read in the same run, and anything else should mark the mailbox skipped without taking the rest of the batch down.'],
      ['What was built','DeltaSyncJob, a Queueable that chains itself once per page — Apex has no while loop across transactions either, so the mechanism is the same idea as the Deluge page-number walk, just built on a primitive that can enqueue its own continuation. A Custom Object, Sync_Checkpoint__c, is written after every page — not just at the end — so a chain that dies on page forty resumes on page forty-one. Three error branches mirror the Deluge ones exactly: a 429 leaves the checkpoint untouched and re-chains with a delay; an invalid token clears itself and re-fetches as a full read inside the same execute(); anything else marks the checkpoint failed and returns without throwing, so one bad mailbox cannot take a batch job down. Config — page size, the per-transaction page ceiling, which Named Credential to call through — lives in a Custom Metadata Type, deployable and inspectable the same way the classes are. Every page also publishes a Platform Event, so a monitor component can show a run live without polling.'],
      ['The trade','Custom Object over Platform Cache for the checkpoint, deliberately: Platform Cache is faster but evaporates on a cache eviction or an org restart, and a checkpoint that quietly disappears mid-sync is worse than one that is a little slower to read. HttpCalloutMock replaces every external call in tests — this repository never contacts a real mail provider, in tests or otherwise. The comparison table below is the actual content of this page; read it end to end rather than the prose above, which only sets up why it exists.']]}
  ]
};

const ABOUT = {id:'how', t:'How this site works', kind:'note',
  sub:'Everything here runs in your browser against generated data. Nothing connects to a live system.',
  body:[
   ['The company is invented','All records belong to '+CO.name+', '+CO.what+'. Accounts, people, deals, meetings and conversations are generated. No client record, endpoint, credential or internal name from any employer appears anywhere on this site.'],
   ['The platform is emulated','The widgets are the real thing — the same code that runs inside the CRM, loaded in a frame exactly as the platform loads it. What sits underneath is a stand-in for the platform SDK: record reads and writes, a query interpreter with paging at the platform’s own ceiling, server-side function calls, and connection calls, all served from the generated dataset and held in memory. Edits persist for your session; Reset restores them.'],
   ['This layer already existed','It began as an offline test harness — stubs plus a headless browser — built because a widget cannot run outside the CRM and nobody wants to verify a change by deploying it to production. This site is that harness promoted to a product.'],
   ['Failure is a switch, not a story','A control turns on latency, rate limiting, rejected writes and expired tokens. Recovery paths are meant to be clicked, not described.'],
   ['The other systems are drawn, not cloned','Chat, tracker and calendar shells are simplified interfaces built for this site. They carry no third-party branding and are labelled as emulations. They exist so a flow that crosses four systems can be walked end to end.']]};


function viewEventPage(){
  return '<div class="pagehead"><h1>Event campaign page</h1>'
   + '<p class="sub">One CRM record, several widgets. This is how the work actually looks: a campaign header, '
   + 'a tabbed record page, a target list of several hundred contacts, a meeting schedule, and a booking wizard '
   + 'that checks who and what is free before it lets you continue.</p></div>'
   + '<section class="block"><h2>What to try</h2><ul>'
   + '<li><b>Contacts</b> — several hundred rows loaded in pages of two hundred, the platform ceiling. Filter chips '
   + 'combine as OR inside a group and AND across groups. Statuses derived from meetings carry a padlock.</li>'
   + '<li><b>Meetings</b> — counters recompute against whatever is filtered, including booked hours. The calendar '
   + 'column carries the five sync states the reconciliation work exists for.</li>'
   + '<li><b>Create Meeting</b> — the wizard refuses to continue and says why: no buyer, no room, capacity exceeded. '
   + 'Step four computes free slots from the meetings already in the CRM and names the reason a slot is blocked — '
   + 'the room is taken, or one of our people is already in something.</li>'
   + '<li>Book a meeting and it appears in the Meetings tab, marked <i>not in calendar</i> — because sending the '
   + 'invitation is a server-side step, and the screen says so rather than pretending.</li>'
   + '</ul></section>'
   + '<section class="block"><h2>The record</h2><div id="ecp-host"></div></section>'
   + '<section class="block"><h2>Why this is a platform task</h2>'
   + '<p>Three widgets and a wizard is a description of the artefacts, not of the work. The work is that one '
   + 'campaign record has to carry an event from a target list through booking, through the floor, to the '
   + 'follow-up afterwards — and that every surface touching it reads and writes the same data model. Build '
   + 'them as four separate tools and the schedule disagrees with the booking within a day; build them over one '
   + 'model and a conflict is a query rather than a phone call.</p>'
   + '<p>That is also what makes the ceilings unavoidable rather than incidental. The same query ceiling and '
   + 'the same write validation apply here as in production — so the target list pages at two hundred rows, the '
   + 'wizard genuinely refuses an incomplete booking, and a meeting that has not reached a calendar says so '
   + 'instead of pretending. A screen that hides its platform is a screenshot; this one has to survive it.</p></section>';
}

const PROMOTED = new Set(['solution-map','deal-conversations','contact-enrichment','chat-recap','meeting-board','event-contacts','chat-tracker']);
const REC = [
  {id:'solution',  t:'Solution map',           host:'SolutionMap',   arg:d=>{
     // pick the programme with the richest spread of states, so the matrix is not one colour
     const score = p => { const ds = d.Deals.filter(x=>x.Programme===p.id);
       return ds.length + new Set(ds.map(x=>x.Stage)).size*3 + (ds.some(x=>x.Stage==='4. Won')?12:0); };
     return d.Programmes.slice().sort((a,b)=>score(b)-score(a))[0].id; },
   sub:'A programme record, and the matrix its account plan is read from: service lines against business units, coloured by the latest deal on each cell, with unworked pipeline surfaced in pale blue and a business unit\'s whole potential — not just what it has already won — totalled in its header.',
   try:['Hover a cell that has a deal on it — the deals behind it float above, and the card stays up while your cursor is on it.',
        'Open the field guide from the header. The colour rule and the row order are documented in the product, not in a wiki nobody opens.',
        'Create an opportunity from a business-unit header — pick more than one service line, a primary contact and a stage, and watch Lost pull in its own loss-reason field. It is written through the emulator and the matrix redraws with it.'],
   /* The narrative used to end on a colour implementation detail. The
      colour rules belong in the field guide the widget already opens from
      its header; the page owes the reader the decision the screen exists
      to support, and the part of the picture it leaves out. */
   whyParts:[
    ['The decision this matrix supports',
     'An account manager preparing a programme review has one question a list of deals cannot answer: where are we already selling into this client, and where have we sold nothing at all? Laid out as business units against service lines it is visible at a glance instead of assembled by hand — a cell coloured by the stage of its latest deal, a pale blue cell where budget exists that nobody has picked up, and an empty run across a row where a whole service line has never been offered to anybody. Each column header totals that business unit’s whole potential rather than what it has already won, so the conversation starts from the size of the opportunity instead of the size of the invoice. And because the gap is found in a specific cell, the opportunity is created from that cell: the business unit and the service line are already decided, and the only things left to fill in are the ones a person genuinely has to choose.'],
    ['Why the platform could not draw it',
     'Nothing in the CRM produces a matrix; a report runs down a list, not across two axes. The grid, the stage colouring, the diagonal reveal on a cell holding more than one deal, the hover card that stays up while the cursor is on it, and the toasts after a write are all hand-built — and built to match what the production widget does at runtime rather than what a cleaner design would have preferred. The reading rules live in a field guide inside the product, reachable from the header: how a colour is chosen, why the rows are ordered as they are, what a pale cell means, and the one stage that prints in dark text. A colour scheme carrying this much meaning is either documented where it is used or quietly misread.'],
    ['What it deliberately does not show',
     'A cell carries the latest deal, not the history behind it. A service line won three years ago and lost twice since reads as its most recent outcome, and the two earlier attempts are not on the screen at all. Ordering ranks by amount, which favours large service lines over strategically important small ones without saying so. Both are deliberate — this screen exists to start a conversation about gaps, not to replace the deal records underneath it — but an account plan built from this view alone is a plan written entirely in the present tense.']
   ]},
  {id:'board',     t:'Meeting board (mobile)', host:'__BOARD__',     arg:d=>d.Campaigns[0].id, phone:true,
   sub:'The same event, on a phone. A room-by-room day, team load, and a bottom sheet that writes a recap back — built for a surface with no developer tools, so it carries its own.',
   try:['Tap the clash or travel counter — the day narrows to the meetings that caused it.',
        'Switch to Team: the load bar is share of an eight-hour day, and a double-booked person is flagged there too.',
        'Open a meeting, write a recap, and press Rephrase. The rewrite happens server-side, so no key is ever in this page; press again to undo.',
        'Tap the version badge in the header. That is the on-screen console — the only way to read an error on a phone inside the CRM app.'],
   /* Two different arguments used to share one paragraph: what a phone
      inside the CRM app takes away, and what a model is allowed to add
      back. They constrain each other, which is only visible once they are
      separate. */
   whyParts:[
    ['Mobile operating constraints',
     'The host application gives a widget running on a phone no developer tools whatsoever: no console, no inspector, no way to read an error that happened on somebody else’s device on a trade-show floor. So the interface carries its own — the version badge in the header opens an on-screen console with a ring buffer, and several of these bugs were never visible any other way. The rest follows from the same surface. Nothing here comes out of a component library: the room timeline, the lane layout for meetings that overlap, and the bottom sheet are all hand-built, because the binding constraint is not screen width but attention. The person using this is standing up, between conversations, and has seconds rather than minutes. Two alerts exist that the platform has no concept of — somebody booked into two meetings at once, and a move between places with under fifteen minutes to make it — because those are the two things that actually go wrong on a floor, and neither is a field anybody thought to model.'],
    ['AI-assisted recap, and the boundary around it',
     'The recap field is where a model earns its place on this screen. Typing a structured summary on a phone is the most expensive thing this interface asks of anyone, and turning a rough note into the shape the business expects is precisely the bounded task a model is good at. What makes it usable rather than alarming is the boundary drawn around it. The rewrite runs server-side, so no key is ever present in the page. The target record and the destination field are fixed by the interface and are not the model’s to choose. Pressing the same control again undoes the rewrite and gives back the original words, so nothing a person typed is lost to a suggestion they did not want. And it drafts, nothing more — the save stays a separate, deliberate act by the person whose name goes on the record.'],
    ['What this surface still cannot do',
     'The console is a ring buffer: it holds the recent past and drops the rest, so an error nobody looks at soon after it happens is gone for good. The clash and travel warnings are computed from the meetings the CRM holds, which means anything arranged outside the CRM does not exist for them — the alerts are accurate about the data they have and silent about the data they do not, and on a floor where people agree things in person that gap is not theoretical. Both are the same trade in different places: this screen is built to be honest about a small, verifiable picture rather than confident about a complete one it cannot actually see.']
   ]},
  {id:'tracker',   t:'Chat to issue tracker',  host:'__TRACKER__',   arg:()=>null,
   sub:'Two recreated application screens, not one CRM shell: a Teams thread on one side, the Jira issue it routes to on the other.',
   try:['Read the root message: the PITCH code inside it is the whole routing mechanism, resolved once and inherited by every reply.',
        'Run synchronization. The tagged replies land as comments on the Jira screen, and each one gets a one-time ticket reaction back in Teams.',
        'Run it again. The existing marker is found, nothing is posted twice, and no second reaction fires.',
        'Show the restricted example: the same run also produces a comment locked to a Jira project role, not just coloured differently.',
        'Show the missing-PITCH example: a thread with no code in its root is skipped safely, never guessed at.',
        'Open the technical details drawer to see the hidden markers and the deal each thread is filed against.'],
   dg:{kind:'chain', at:3,
    aria:'Six-step chain from a tagged Teams reply through a bounded Graph read, PITCH resolution, a CRM upsert, a Jira marker search and posting, with a branch for a duplicate marker and a loop back every ten minutes',
    steps:[
     {id:'tag', n:'Reply tagged', sub:'#jira / #jira_private'},
     {id:'read', n:'Read via Graph', sub:'bounded window'},
     {id:'resolve', n:'Resolve PITCH', sub:'from the root message', checkpoint:'inherited by every reply', fail:'no PITCH → skipped safely'},
     {id:'crm', n:'Upsert in CRM', sub:'Teams_Messages row', checkpoint:'state saved'},
     {id:'marker', n:'Search Jira marker', sub:'hidden in comment body'},
     {id:'post', n:'Post + confirm', sub:'comment, then one-time reaction', checkpoint:'In_Jira = true'}
    ],
    rails:[
     {from:'marker', to:'marker', kind:'branch', label:'marker exists → duplicate skipped'},
     {from:'post', to:'read', kind:'loop', label:'every ten minutes'}
    ],
    detail:{
     tag:{t:'Reply tagged in Teams', d:'#jira makes the resulting comment public; #jira_private restricts it to a Jira project role. An untagged reply is read but never sent anywhere.'},
     read:{t:'Read via Microsoft Graph, a bounded window at a time', d:'Each run reads a bounded slice of channel activity rather than a channel’s full history — the platform throttles Graph, and nothing here can afford to re-read everything every ten minutes.'},
     resolve:{t:'PITCH resolved once, from the root message', d:'The first valid PITCH code in a thread’s root message becomes the routing key for every reply beneath it. A code typed only into a reply is not enough — trusting it would mean re-deciding the routing on every message instead of once per thread.'},
     crm:{t:'Zoho CRM as the state store', d:'The thread is upserted into a Teams_Messages row before Jira is touched at all — message ids, PITCH, delivery state. Jira is never asked what it already has; the CRM already knows.'},
     marker:{t:'A marker hidden in the comment body', d:'Before posting, the run searches the issue for a hidden [crm-teams-msg:&lt;id&gt;] marker. Finding one is the whole duplicate check — a run that fires twice over the same reply never posts twice.'},
     post:{t:'Comment posted, reaction set once', d:'A public or role-restricted comment lands on the issue, then the source message gets a one-time 🎫 — proof the exact message reached Jira, not just that a sync ran.'},
     'rail:marker:marker':{t:'Marker already exists', d:'When the search on the marker step finds a hit, posting and the reaction are both skipped — the run reports a duplicate rather than writing a second comment.'}
    }
   },
   /* Four decisions, not one paragraph. As a single block the routing rule, the
      duplicate check, the attachment limit and the one-way choice read as a list
      of caveats; they are four separate design decisions, and the last one is a
      cost rather than a feature. */
   whyParts:[
    ['Routing belongs to the thread root',
     'The mapping lives on the thread\'s root message, not the channel, because one channel carries several PITCH discussions — the channel registry only says which channels to read at all. A PITCH code typed into a reply but never into the root is invisible to the router by design: honouring a later message would mean re-deciding the routing on every reply instead of once per thread, and a thread whose destination can change halfway is a thread nobody can audit. A root with no code is skipped and reported, never guessed at.'],
    ['Idempotency exists in both systems',
     'A run every ten minutes has to be safe to repeat, and one marker is not enough for that. The CRM holds a delivery flag on the stored message; each posted comment holds a hidden marker in its own body. Before posting, the run searches the issue for that marker, and finding one skips the comment and the acknowledgement together. The two survive different accidents — the CRM flag outlives a deleted Jira comment, the marker outlives a rebuilt CRM row — so the pair is what makes a replay a no-op rather than a second comment.'],
    ['Restricted comments do not make files private',
     'A comment can be locked to a Jira project role. A file attached to the same issue cannot. So attachments are never uploaded: only their names travel, as links back to the thread they came from, where the original permission model still applies. This is a limitation stated rather than solved — a restricted comment is exactly as private as the tracker\'s own role model, which is a weaker guarantee than the chat thread it was copied out of, and anyone using it should know that before they type.'],
    ['The integration is one-way on purpose',
     'Replies flow from the thread to the issue and never back. Two-way would mean deciding, on every edit, which side is authoritative for a comment both systems now hold, and that question has no good default — only a choice about whose edit gets silently discarded. The cost of refusing it is real and worth naming: someone who answers on the Jira issue has answered only on the Jira issue, and the thread will not show it.']
   ]},
  {id:'teams',     t:'Meeting recap from chat',host:'__TEAMS__',     arg:()=>null,
   sub:'The chat client on the left, the CRM record on the right, and a two-card flow between them. A trace panel shows every call as it is made.',
   try:['Pick the first chat and send the message to the CRM. The account is already resolved, and the card says which key resolved it.',
        'Pick the third chat instead: two accounts appear among the participants, so nothing is chosen for you.',
        'Try to save a three-word recap. The card refuses and says why.',
        'Watch the trace — the transcript pipeline starts on card one, so the recap is ready two steps later.'],
   dg:{kind:'chain', at:1,
    aria:'Seven-hop chain from reading the meeting record to writing the recap back, with a permission failure on listing transcripts',
    steps:[
     {id:'meeting', n:'Read meeting', sub:'CRM', checkpoint:'stage written on the record after every hop'},
     {id:'organiser', n:'Resolve organiser', sub:'directory identity'},
     {id:'join', n:'Join link → id', sub:'online-meeting id'},
     {id:'list', n:'List transcripts', sub:'source A', fail:'403'},
     {id:'download', n:'Download captions', sub:'VTT'},
     {id:'model', n:'Model call', sub:'captions → recap'},
     {id:'write', n:'Write summary', sub:'+ stage'}
    ],
    rails:[
     {from:'meeting', to:'meeting', kind:'async', label:'pipeline started on card 1', sub:'nothing waits for it'},
     {from:'list', to:'list', kind:'branch', label:'fallback: second source', demo:'cross-system'}
    ],
    detail:{
     meeting:{t:'Read meeting record', d:'Pulled from the CRM the moment the chain starts.'},
     organiser:{t:'Resolve organiser', d:'The organiser is resolved to a directory identity.'},
     join:{t:'Join link → online-meeting id', d:'The join link is turned into an online-meeting identifier.'},
     list:{t:'List transcripts — the main failure', d:'Access to transcripts was switched off at the tenant level with no warning, and every call started returning a permission error (403). The pipeline records the stage it reached on the record itself, so the answer to "why is this empty" is visible in the data rather than buried in a run log.'},
     download:{t:'Download captions', d:'Downloads the caption file for the transcript that was found.'},
     model:{t:'Model call', d:'The model call that turns captions into a recap.'},
     write:{t:'Write summary + stage', d:'Writes the recap and the stage the pipeline reached back onto the meeting record.'},
     'rail:meeting:meeting':{t:'Async pipeline start', d:'The whole chain is started the moment a person picks the account on the first card — long before anyone asks for a recap. Nothing waits for it.'},
     'rail:list:list':{t:'Fallback: second source', d:'When there is no transcript, a second source is matched by score rather than by key, with a gate that refuses the automatic link if the known recording owner is not among the candidates.', demo:'cross-system'}
    }
   },
   /* Four decisions the closing paragraph used to run together: which
      source is asked, what the recap has to look like, how the run is
      observed, and who is accountable for the text before it is stored. */
   whyParts:[
    ['Choosing the source is a different decision from writing the recap',
     'Meetings held in Teams have a Teams transcript. Meetings held anywhere else do not, and Krisp covers those. That choice is its own step with its own failure modes, not a branch buried inside the recap logic: read the meeting record, resolve the organiser to a directory identity, turn the join link into an online-meeting id, then ask whichever source owns that meeting for its captions. Everything downstream — the standard, the validation, the write-back — is identical whichever source answered, which is what makes a third provider a change to one step instead of a change to the workflow. Where no transcript exists at all, a candidate is matched by score rather than by key, and the automatic link is refused outright when the known recording owner is not among the candidates. The link is written at a lower score than the text is, because “I believe this is the meeting” and “I am willing to write data into it” are different decisions and deserve different thresholds.'],
    ['What the corporate standard requires, and why the model does not choose it',
     'A recap here is not a summary. The company’s own standard fixes which sections a recap must contain, requires commitments to be pulled out as action items rather than left inside the narrative, and sets the register — plain, factual, no hedging and no commitment nobody actually made — because these are read by people who were not in the room and cannot check. Each part is written to its own CRM field instead of one long note, so the next stage of the deal can be filtered and reported on rather than read one record at a time. The model’s task is bounded to producing that structure from the captions it was handed; the structure itself is not its to invent. A draft that comes back missing a required section, or too short to be a recap of anything, is refused with the reason on screen rather than saved short.'],
    ['The trace panel is the observability',
     'Every call the flow makes is written to the trace as it is made: the record read, the identity resolved, the source that answered, the step it stopped on. That panel is the primary proof this page offers, and it exists because of a real failure rather than a design preference. Transcript access was switched off at the tenant level with no warning and every listing call began returning a permission error; the pipeline records the stage it reached on the record itself, so “why is this empty” is answered by the data instead of by a run log nobody can reach. The same panel shows what the flow is not doing: no step holds a synchronous request open while a person thinks. Each card is a callback, and the recap pipeline starts the moment the account is picked — long before anyone asks for a recap — so two steps later the field is already filled.'],
    ['A person corrects it before anything is saved',
     'Nothing goes from the model straight into the record. The draft returns to the card the person is already looking at, and the save is a deliberate act rather than the end of a pipeline. When the linked opportunity belongs to a different account, that choice travels as a marked value through a control that can only hand back one string — awkward, and still better than inferring it. The cost is named rather than hidden: this flow cannot run unattended. A meeting nobody opens gets no recap, and a backlog of un-reviewed drafts is ordinary operating reality here, not an edge case. Buying auditability with somebody’s attention is the trade, and it is only worth it because the output is written into fields the business reports on.']
   ]},
 {id:'enrichment', t:'Contact enrichment',    host:'Enrichment',   arg:()=>'6100000000008',

function viewRecord(r){

   + '<section class="block"><h2>What to try</h2><ul>'+r.try.map(x=>'<li>'+x+'</li>').join('')+'</ul></section>'
   + '<section class="block"><h2>The record</h2><div id="rec-host"></div></section>'

      ? '<section class="block"><h2>Why it was not straightforward</h2>'

      : '<section class="block"><h2>Why it was not straightforward</h2><p>'+r.why+'</p></section>');

function wireRecord(r){
  const host = document.getElementById('rec-host');
  if (!host || !window.__DATA__) return;
  if (r.host === '__TEAMS__') { if (window.TeamsFlow) TeamsFlow.mount(host); return; }
  if (r.host === '__BOARD__') { if (window.MobileBoard) MobileBoard.mount(host, r.arg(window.__DATA__)); return; }
  if (r.host === '__TRACKER__') { if (window.TrackerFlow) TrackerFlow.mount(host); return; }
  /* A record page may be hosted by any of the widget bundles, not only
     CRMPages: two screens that were reachable solely as tabs inside other
     records now have pages of their own. */
  const P = (window.CRMPages && window.CRMPages[r.host])
         || (window.CRMWidgets3 && window.CRMWidgets3[r.host])
         || (window.CRMWidgets2 && window.CRMWidgets2[r.host]);
  if (P) P.mount(host, r.arg(window.__DATA__));
}


function viewOrgHealth(){
  return '<div class="pagehead"><h1>Org health report</h1>'
   + '<p class="sub">A CRM of any age accumulates automation nobody can account for. The platform keeps no reverse '
   + 'references, so “is this function still used?” has no direct answer — this is the answer, assembled by checking '
   + 'five entry channels for every one of them. Shown here against a generated org of 1,240 functions, not an employer’s.</p></div>'
   + '<section class="block"><h2>The report</h2><div id="oh-host"></div></section>'
   + '<section class="block"><h2>Why it is generated, and not real</h2>'
   + '<p>The instrument is the point, not the org it was run against. A real report is a portrait of somebody else’s '
   + 'security posture — how many credentials sit inline, how many integrations have no error handling — and that is '
   + 'not mine to publish, cleaned or otherwise. So the tooling is pointed at an invented org of a realistic size and '
   + 'shape instead. What it proves is the same: that the five channels can be reconciled at all, that the dead code '
   + 'can be named with a reason rather than a guess, and that the method knows where it is blind.</p></section>'
   + '<section class="block"><h2>What each panel is actually claiming, in the order it claims it</h2><ul>'
   + '<li><b>The completeness warning</b> — the class of function this method cannot see, and how large it is. '
   + 'It opens the report rather than closing it: a reader who takes the reachability numbers at face value has '
   + 'been misled, and finding that out underneath the chart is finding out too late.</li>'
   + '<li><b>Reachability</b> — a function is called dead only when a workflow rule, a schedule, a button, a widget '
   + 'and every other function all come back empty. Click a slice to see the list, with the entry points each one does have.</li>'
   + '<li><b>Broken connections</b> — the platform records that a connection stopped authenticating and keeps letting '
   + 'code call it. Nothing links the two facts together until something like this does, so the call sites have been '
   + 'failing quietly for as long as nobody looked.</li>'
   + '<li><b>Guarded calls</b> — the share of outbound calls wrapped in error handling. On an estate this size the '
   + 'number is usually single digits, and it is the reason a transient failure takes a whole rule down with it.</li>'
   + '<li><b>Rules that never fired</b> — active, wired, and executed exactly never, usually because a criterion still '
   + 'names a field that was renamed.</li>'
   + '</ul></section>';
}

function wireSFLWC(){
  const host = document.getElementById('sflwc-host');
  if (!host || !window.__DATA__ || !window.SFLWC) return;
  const employment = (window.__DATA__.Employment || []).slice();
  // Same contact-selection rule as the Zoho history page (REC 'contact' entry): pick
  // whoever has the most employment rows, so the screen never opens on a single row.
  const by = {}; employment.forEach(e => by[e.Contact] = (by[e.Contact]||0) + 1);
  const best = Object.entries(by).sort((a,b) => b[1]-a[1])[0];
  const contactId = best ? best[0] : ((window.__DATA__.Contacts||[])[0] || {}).id;
  // The generator's own ceiling on employment rows per contact is 4 (data/generate.mjs,
  // not touched by this work). This demo's Definition of Done calls for 5+ visible rows
  // on the Salesforce tab, so one extra, clearly synthetic row is appended for the
  // Salesforce-emulator copy of the data only — window.__DATA__.Employment itself (and
  // therefore the Zoho tab, which reads it separately) is never mutated.
  const extraId = 'sf-demo-extra-' + contactId;
  if (!employment.some(e => e.id === extraId)) {
    employment.push({ id: extraId, Contact: contactId, Account_Name: null,
      Company: 'Northbeam Engineering (Salesforce-tab demo row)', Title: 'Earlier role',
      Seniority: 'Middle', Email: null, Start_Date: '2010-01-01', End_Date: '2013-01-01',
      Is_Main: false, Status: 'Past', Buyer_Role: null,
      Comment: 'Added only so the Salesforce tab has five rows to show — the generated dataset caps employment history at four per contact.' });
  }
  if (window.mockSF) window.mockSF.load(employment);
  window.SFLWC.mount(host, contactId);
}

const SF_SYNC_ROWS=[
  ['No cycle across a run', 'The schedule itself is the loop — a rebuild of the same function call, walking a pre-built list of page numbers with a completion flag', 'A Queueable chains itself once per page — enqueueJob(new DeltaSyncJob(...)) inside execute() reads as a loop even though each iteration is a separate transaction'],
  ['Time ceiling', '120 seconds on a single synchronous function call', 'Governor limits per transaction — at most 100 callouts, plus Queueable chaining’s own depth limits — so the job bounds itself by a page-count budget per transaction, not a wall clock, and re-chains into a fresh transaction for more budget'],
  ['Where state lives', 'A field on a record, or a small standalone module — there is nowhere else to keep a delta token between runs', 'Sync_Checkpoint__c, a Custom Object — chosen over Platform Cache because it survives an org restart or a cache eviction and is visible in the UI, which mattered more than the extra read/write latency'],
  ['Secrets', 'A connection object inside the platform — the credential never appears in code', 'A Named Credential — same idea, same guarantee: zero secrets in Apex or metadata'],
  ['Observability', 'The sync stage is written onto the record itself, so “why is this empty” is answered by the data', 'A Platform Event published after every page, read live by a subscribing LWC monitor via empApi — push instead of pull, otherwise the same instinct'],
  ['Testability', 'A hand-built offline stand-in (this whole site’s platform emulator) — nothing in Zoho’s own tooling mocks a connection call', 'HttpCalloutMock, built into the platform — a real testing seam the Deluge side has to construct from scratch'],
  ['Suppressing automation on a bulk load', 'An empty trigger list passed with the bulk API call turns off every rule and workflow for the run', 'No direct equivalent — Salesforce triggers are not switched off by a request flag; the closest available tool is a static/bypass flag pattern written into the trigger handlers themselves, and it has to be built and maintained by hand']
];
function viewSFSync(){
  const table='<div class="scroll"><table><thead><tr><th>Problem</th><th>Deluge (Zoho)</th><th>Apex (Salesforce)</th></tr></thead><tbody>'
    + SF_SYNC_ROWS.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')
    + '</tbody></table></div>';
  return '<div class="pagehead"><h1>Apex vs Deluge: the same sync, twice</h1>'
   + '<p class="sub">The delta-sync pattern from the Zoho side (seventeen mailboxes, a checkpoint per page, a hard '
   + 'time ceiling), rebuilt on Salesforce primitives. Not the '
   + 'code — the decisions. Where the two platforms genuinely diverge is the last row, and it is the one worth '
   + 'reading slowly.</p>'

   + '<section class="block"><h2>The comparison</h2>'+table+'</section>'
   + '<section class="block"><h2>Same steps, different mechanism</h2><div id="sfsync-diagram"></div></section>'
   + '<section class="block"><h2>Why this page exists</h2>'
   + '<p>Anyone can restate what a platform’s documentation says. The useful version of this comparison is knowing '
   + 'which rows have a real answer on both sides and which one does not — suppressing automation during a bulk '
   + 'load is trivial in Zoho and has no built-in equivalent in Apex. Naming that gap plainly is worth more than a '
   + 'table that reads clean.</p></section>';
}
function sfSyncFallbackSVG(){
  const steps=['Read checkpoint','Fetch delta page','Handle 429 / invalid token','Write checkpoint','Chain / re-schedule'];
  const w=760,colW=140,gap=10,x0=8,yTop=14,yBot=104,h=64;
  const col=(i)=>x0+i*(colW+gap);
  const box=(i,y,label,sub)=>'<rect x="'+col(i)+'" y="'+y+'" width="'+colW+'" height="'+h+'" rx="8" '
    +'fill="#F8F9FB" stroke="#D9DCE5"/>'
    +'<text x="'+(col(i)+colW/2)+'" y="'+(y+26)+'" text-anchor="middle" font-family="DM Mono, monospace" '
    +'font-size="9.5" fill="#16181D">'+esc(label)+'</text>'
    +'<text x="'+(col(i)+colW/2)+'" y="'+(y+42)+'" text-anchor="middle" font-family="DM Mono, monospace" '
    +'font-size="9.5" fill="#8A8F9C">'+esc(sub)+'</text>';
  const arrow=(i)=>'<line x1="'+(col(i)+colW)+'" y1="'+(yTop+h/2)+'" x2="'+(col(i+1))+'" y2="'+(yTop+h/2)+'" '
    +'stroke="#B0B5C2" stroke-width="1.5" marker-end="url(#sfsync-arrow)"/>'
    +'<line x1="'+(col(i)+colW)+'" y1="'+(yBot+h/2)+'" x2="'+(col(i+1))+'" y2="'+(yBot+h/2)+'" '
    +'stroke="#B0B5C2" stroke-width="1.5" marker-end="url(#sfsync-arrow)"/>';
  let body='<defs><marker id="sfsync-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">'
    +'<path d="M0,0 L6,3 L0,6 Z" fill="#B0B5C2"/></marker></defs>';
  body+='<text x="'+x0+'" y="'+(yTop-2)+'" font-family="DM Mono, monospace" font-size="9.5" fill="#5B5BD6">DELUGE (ZOHO)</text>';
  body+='<text x="'+x0+'" y="'+(yBot-2)+'" font-family="DM Mono, monospace" font-size="9.5" fill="#5B5BD6">APEX (SALESFORCE)</text>';
  const subsTop=['scheduled fn reads var','delta query, page N','clear var, full read','write var','next scheduled tick'];
  const subsBot=['checkpoint SOQL','callout via Named Cred','clear token, refetch','update Sync_Checkpoint__c','enqueueJob(this)'];
  steps.forEach((s,i)=>{ body+=box(i,yTop,s,subsTop[i]); body+=box(i,yBot,s,subsBot[i]); if(i<steps.length-1) body+=arrow(i); });
  return '<svg viewBox="0 0 '+w+' 150" width="100%" role="img" aria-label="Delta sync steps, Deluge above and Apex below">'+body+'</svg>';
}
function wireSFSync(){
  const host=document.getElementById('sfsync-diagram'); if(!host) return;
  if (window.Diagrams && typeof window.Diagrams.chain==='function') {
    try { host.innerHTML=''; window.Diagrams.chain(host, {
      lanes:[
        {label:'Deluge (Zoho)', steps:['Read checkpoint','Fetch delta page','Handle 429 / invalid token','Write checkpoint','Next scheduled tick']},
        {label:'Apex (Salesforce)', steps:['Read checkpoint','Fetch delta page','Handle 429 / invalid token','Write checkpoint','enqueueJob(this)']}
      ]
    }); return; } catch(e) { /* fall through to the static SVG below */ }
  }
  host.innerHTML = sfSyncFallbackSVG();
}

  const sections=c.body.map(([head,text,anchor])=>sec(head,'<p>'+text+'</p>',anchor));
  if(window.Diagrams){

    const specs=(c.dgs||(c.dg?[c.dg]:[])).slice()
      .sort((a,b)=>(b.at!=null?b.at:1)-(a.at!=null?a.at:1));

  const [k,id]=h.split('/');
  if(!k) return null;
  if(FIXED[k]!==undefined) return FIXED[k];
  if(k==='rec'  && REC2ITEM[id])  return 'p/'+REC2ITEM[id];
  if(k==='demo' && DEMO2ITEM[id]) return 'p/'+DEMO2ITEM[id];
  if((k==='flow'||k==='case') && ALL[id]) return 'p/'+id;
  if((k==='flow'||k==='case') && RETIRED[id]) return RETIRED[id];
  if(k==='p' && !ALL[id] && RETIRED[id]) return RETIRED[id];
  if(k==='about') return '';
  if(k==='zoho' && id && CASE_ALIAS[id]) return 'zoho/'+CASE_ALIAS[id];
  return null;
}

function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const moved=legacyTarget(h);
  if(moved!==null){ location.replace('#/'+moved); return; }

  const [kind,id,sub]=h.split('/');
  let body,active,item=null,cs=null,wide=false;
  if(!kind){ body=vAbout(); active='about'; }
  else if(kind==='p'&&ALL[id]){ item=ALL[id]; body=vItem(item); active=item.tab; wide=!!(PAGE[item.id]&&PAGE[item.id].wide); }
  else if(kind==='zoho'&&id&&CASE_BY_SLUG[id]){ cs=CASE_BY_SLUG[id]; body=vCaseStudy(cs); active='zoho'; wide=!!cs.embed; }
  else if(kind==='about-demos'){ body=vAboutDemos(); active='zoho'; }
  else if(TABVIEW[kind]&&!id){ body=TABVIEW[kind](); active=kind; }
  else { location.replace('#/'); return; }

  const view=document.getElementById('view');
  view.classList.toggle('wide', wide);
  view.innerHTML=body;
  drawTabs(active);
  window.scrollTo(0,0);
  if(active==='about'&&kind!=='p') wireAbout();
  if(item && PAGE[item.id] && PAGE[item.id].wire) PAGE[item.id].wire();
  if(cs) wireCaseStudy(cs);
  /* #/p/<id>/<section> opens a long note at one of its sections. */
  if(item && sub){ const t=document.getElementById('sec-'+sub); if(t) t.scrollIntoView({block:'start'}); }

  const els=document.querySelectorAll('.rv');
  if(els.length&&'IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06});
    els.forEach(el=>io.observe(el));
  } else els.forEach(el=>el.classList.add('in'));
}
addEventListener('click',e=>{const b=e.target.closest('[data-scroll]'); if(!b) return;
 const t=document.getElementById(b.dataset.scroll); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});});
addEventListener('hashchange',route);
route();

</script>
