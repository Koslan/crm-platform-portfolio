<title>Kostiantyn Buriak — Zoho CRM platform &amp; integration engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Light minimalism — committed single light theme, explicit colors everywhere */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F8F9FB;color:#16181D;font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid #5B5BD6;outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(248,249,251,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid #E7E9F0;padding:13px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:600;font-size:17px;letter-spacing:-.02em;margin-right:22px;cursor:pointer}
.logo span{color:#5B5BD6}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{font-weight:500;font-size:14px;color:#5D636E;padding:7px 13px;border-radius:999px}
.tabs a:hover{color:#16181D;background:#EEF0F5}
.tabs a.on{color:#FFFFFF;background:#16181D}
.tabs a .nb{font:500 9.5px "DM Mono",monospace;color:#5B5BD6;vertical-align:6px;margin-left:3px}
.tabs a.on .nb{color:#A5A5F0}
.cvbtn{margin-left:auto;font-weight:500;font-size:13.5px;color:#fff;background:#5B5BD6;
  border-radius:999px;padding:8px 16px}
.cvbtn:hover{filter:brightness(1.07)}

/* ---------- layout ---------- */
.page{max-width:980px;margin:0 auto;padding:56px 32px 80px}
.eyebrow{font:500 12px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#5B5BD6;margin:0 0 14px}
h1{font-weight:600;font-size:clamp(30px,4.4vw,44px);line-height:1.12;letter-spacing:-.035em;margin:0 0 16px;text-wrap:balance}
h2{font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0 0 6px}
.lede{font-size:17px;line-height:1.65;color:#5D636E;max-width:58ch;margin:0 0 24px}
.pagelead{font-size:16px;line-height:1.7;color:var(--ink-2);max-width:66ch;margin:0 0 26px}
.whyh{font:600 15px/1.4 "Instrument Sans",system-ui,sans-serif;margin:22px 0 6px}
.whyh:first-child{margin-top:0}
.toc{display:grid;gap:8px;margin:0 0 30px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.toc .k{font:500 11.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8F9C}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 0;color:inherit}
.toc button b{display:block;font-weight:600;font-size:15px;color:#5B5BD6}
.toc button:hover b{text-decoration:underline}
.toc button span{display:block;font-size:13.5px;line-height:1.5;color:var(--ink-2);margin-top:2px}
.intro{font-size:15.5px;line-height:1.65;color:#5D636E;max-width:62ch;margin:0 0 18px}
.sechead{font:500 11.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8F9C;margin:48px 0 16px;
  display:flex;align-items:baseline;gap:12px}
.sechead::after{content:"";flex:1;border-top:1px solid #E7E9F0;transform:translateY(-3px)}
.sechead:first-of-type{margin-top:8px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:48px;align-items:start;margin-bottom:8px}
.photo{width:180px;height:180px;border-radius:22px;object-fit:cover;border:1px solid #E7E9F0;
  box-shadow:0 12px 32px -14px rgba(22,24,29,.25);justify-self:end}
.ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctas a{display:inline-flex;align-items:center;font-weight:500;font-size:14px;
  padding:10px 18px;border-radius:999px;line-height:1;white-space:nowrap}
.ctas a.pri{background:#16181D;color:#fff}
.ctas a.pri:hover{background:#2A2D35}
.ctas a.sec{border:1px solid #D9DCE5;color:#16181D;background:#fff}
.ctas a.sec:hover{border-color:#B9BECD}
.stats{display:flex;gap:22px 28px;flex-wrap:wrap;margin-top:30px}
/* The Zoho index reuses the hero stat row as a scale strip under the lede:
   same type, one step down in weight, ruled off rather than floating. */
.scale{margin:22px 0 4px;padding-top:18px;border-top:1px solid #E7E9F0;gap:30px}
.scale .stat b{font-size:20px}
.alsolab{font:400 11.5px "DM Mono",monospace;letter-spacing:.06em;color:#8A8F9C;margin:16px 0 8px}
/* A piece of work with one screen behind it should not read as a card that
   failed to find its neighbours: alone, the card takes a deliberate width
   instead of one auto-fill track with empty space beside it. */
.bsec .cards:has(.card:only-child){grid-template-columns:minmax(0,min(520px,100%))}
.stat b{display:block;font-weight:600;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font:400 12px "DM Mono",monospace;color:#8A8F9C}

/* ---------- cards & lists ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:19px 21px;display:block}
.card:hover{border-color:#C9CEDC;box-shadow:0 8px 24px -14px rgba(22,24,29,.18)}
.card h3{font-weight:600;font-size:15.5px;letter-spacing:-.015em;margin:0 0 7px}
.card p{font-size:13.5px;line-height:1.55;color:#5D636E;margin:0 0 12px}
.chip{display:inline-block;font:400 11px "DM Mono",monospace;padding:3px 10px;border-radius:999px;
  background:#EEF0F5;color:#5D636E;margin-right:6px}
.chip.acc{background:#EDEDFB;color:#5B5BD6}
.chip.warn{background:#FBF3E8;color:#B0722A}

.rowlist{background:#fff;border:1px solid #E7E9F0;border-radius:14px;overflow:hidden}
.rowlist a{display:flex;align-items:baseline;gap:12px;padding:11px 18px;border-bottom:1px solid #EEF0F5;font-size:14px}
.rowlist a:last-child{border-bottom:none}
.rowlist a:hover{background:#F5F6FA}
.rowlist .rt{font-weight:500;white-space:nowrap}
.rowlist .rs{color:#8A8F9C;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rowlist .rk{font:400 10.5px "DM Mono",monospace;color:#B0B5C2;white-space:nowrap}

.callout{background:#fff;border:1px solid #E7E9F0;border-left:3px solid #B0722A;border-radius:10px;
  padding:15px 19px;color:#5D636E;font-size:14px;line-height:1.6;max-width:62ch;margin:18px 0}
.callout.acc{border-left-color:#5B5BD6}
.callout b{color:#16181D}
.callout .k{font:500 10.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:5px;color:#8A8F9C}

/* ---------- about: skills & experience ---------- */
.hl{background:linear-gradient(transparent 64%,#DDDDF9 64%);padding:0 1px}
.bsec{margin-top:72px}
.bsec .idx{font:500 12px "DM Mono",monospace;letter-spacing:.14em;color:#5B5BD6;display:block;margin-bottom:6px}
.bsec > h2{font-weight:600;font-size:clamp(22px,3vw,28px);letter-spacing:-.03em;margin:0 0 8px}
.bsec .sub{color:#5D636E;font-size:15px;max-width:60ch;margin:0 0 22px}

/* skill chips with hover detail */
.sk{position:relative;display:inline-block;font:400 12px "DM Mono",monospace;background:#F1F2F7;color:#5D636E;
  border-radius:999px;padding:4px 11px;margin:0 5px 6px 0}
.sk.has{background:#EDEDFB;color:#4C4CC4;cursor:help;border:1px dashed #C9C9F2}
.sk.has:hover,.sk.has:focus-visible{background:#5B5BD6;color:#fff;border-color:#5B5BD6}
.sk .tip{display:none;position:absolute;left:0;bottom:calc(100% + 9px);z-index:40;width:min(330px,72vw);
  background:#16181D;color:#E8EAF2;font:400 12.5px/1.55 "Instrument Sans",system-ui,sans-serif;
  border-radius:11px;padding:11px 14px;box-shadow:0 14px 34px -12px rgba(22,24,29,.45);
  white-space:normal;letter-spacing:0}
.sk .tip::after{content:"";position:absolute;top:100%;left:18px;border:6px solid transparent;border-top-color:#16181D}
.sk .tip.big{width:min(470px,84vw)}
.sk .tip .tl{display:block;font:500 10px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8B8FF0;margin-bottom:6px}
.sk .tip .tb{display:block;margin-top:7px;color:#C2C7D4}
.sk .tip .tm{display:block;margin-top:8px;font:400 10px "DM Mono",monospace;letter-spacing:.06em;color:#6B7080}
.sk.has:hover .tip,.sk.has:focus-within .tip,.sk.has:focus-visible .tip{display:block}
.sk .tip b{color:#fff}
.hoverhint{font:400 11.5px "DM Mono",monospace;color:#9A9FAC;margin:-12px 0 14px}
.hoverhint i{font-style:normal;color:#5B5BD6}

.kv{display:grid;grid-template-columns:190px minmax(0,1fr);gap:2px 22px;font-size:14px;
  background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:20px 24px}
.kv dt{font:500 11px "DM Mono",monospace;letter-spacing:.07em;text-transform:uppercase;color:#8A8F9C;padding-top:5px}
.kv dd{margin:0 0 12px;color:#5D636E;line-height:1.6}
.kv dd:last-child{margin-bottom:0}
.kv dd b{color:#16181D;font-weight:600}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv dt{padding-top:10px}}

.job{display:grid;grid-template-columns:128px minmax(0,1fr);gap:26px;margin-bottom:16px;
  background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:26px 28px}
.job.cur{border-color:#C9C9F2;box-shadow:0 10px 30px -18px rgba(91,91,214,.35)}
.job .when .yr{font-weight:600;font-size:16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.job .when .dur{font:400 11.5px "DM Mono",monospace;color:#8A8F9C;margin-top:3px}
.job .when .now{display:inline-block;font:500 10px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  color:#5B5BD6;background:#EDEDFB;border-radius:999px;padding:2px 8px;margin-top:8px}
.job h3{font-weight:600;font-size:19px;letter-spacing:-.025em;margin:0}
.job h3 span{font-weight:400;color:#5D636E;font-size:16px}
.job .meta{font:400 12px "DM Mono",monospace;color:#8A8F9C;margin:4px 0 12px}
.job p{margin:0 0 12px;max-width:66ch;color:#5D636E;font-size:14.5px;line-height:1.65}
.job p b, .job li b{color:#16181D;font-weight:600}
.job ul{margin:0 0 14px;padding-left:18px;max-width:68ch;color:#5D636E;font-size:14px;line-height:1.6}
.job li{margin-bottom:7px}
.job li::marker{color:#B9BCF0}
.job .g{font:500 10.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8F9C;
  margin:16px 0 8px}
.stack{margin-top:14px}
@media(max-width:700px){.job{grid-template-columns:1fr;gap:8px;padding:20px}}

.proj{background:#F7F7FD;border:1px solid #E0E0F5;border-radius:12px;padding:14px 18px;margin-top:6px}
.proj .k{font:500 10.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#7A7AC9;
  display:block;margin-bottom:9px}
.proj a{display:inline-block;font-size:13px;font-weight:500;color:#5B5BD6;background:#fff;border:1px solid #DCDCF6;
  border-radius:999px;padding:5px 12px;margin:0 6px 6px 0}
.proj a:hover{background:#EDEDFB}
.proj a small{font-weight:400;color:#8A8F9C;margin-left:5px}

.edu{background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:24px 28px;display:grid;
  grid-template-columns:64px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:18px}
.edu .crest{width:64px;height:64px;border-radius:14px;background:#EDEDFB;color:#5B5BD6;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.edu h3{font-weight:600;font-size:17px;letter-spacing:-.02em;margin:0 0 3px}
.edu .deg{font-size:14px;color:#5D636E;margin:0 0 4px}
.edu .meta{font:400 11.5px "DM Mono",monospace;color:#8A8F9C;margin:0 0 10px}
.edu p{font-size:13.5px;line-height:1.6;color:#5D636E;margin:0;max-width:64ch}
@media(max-width:560px){.edu{grid-template-columns:1fr}}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.course{background:#fff;border:1px solid #E7E9F0;border-radius:12px;padding:14px 17px}
.course .p{font:400 10.5px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8F9C;margin-bottom:4px}
.course h4{font-weight:600;font-size:13.5px;letter-spacing:-.01em;margin:0 0 2px}
.course .yr{font:400 11px "DM Mono",monospace;color:#B0B5C2}
.course a{color:#5B5BD6;font-weight:500;font-size:12px}

.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cert{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:18px 20px;display:block}
.cert:hover{border-color:#C9C9F2;box-shadow:0 8px 24px -14px rgba(91,91,214,.3)}
.cert .badge{width:34px;height:34px;border-radius:9px;background:#EDEDFB;color:#5B5BD6;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:10px}
.cert h3{font-weight:600;font-size:14.5px;letter-spacing:-.015em;margin:0 0 3px}
.cert .yr{font:400 11.5px "DM Mono",monospace;color:#8A8F9C}
.cert .vf{font-size:12.5px;font-weight:500;color:#5B5BD6;margin-top:9px;display:block}
.runcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.runcard{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:18px 20px}
.runcard h3{font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin:0 0 5px}
.runcard .rc-sub{font-size:12.5px;line-height:1.5;color:#5D636E;margin:0 0 10px}
.runcard ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.55;color:#5D636E}
.runcard li{margin-bottom:5px}
.runcard a{color:#5B5BD6;font-weight:500}

/* integration map */
.imap{background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:18px 18px 8px;overflow-x:auto}
.imap svg{display:block;max-width:100%;height:auto;min-width:640px}
.iedge{stroke:#C3C8D6;stroke-width:1.6;fill:none;cursor:pointer}
.iedge.on,.iedge:hover{stroke:#5B5BD6;stroke-width:2.6}
.ielab{font:500 10.5px "DM Mono",monospace;fill:#8A8F9C;cursor:pointer}
.ielab.on,.ielab:hover{fill:#5B5BD6}
.inode rect{fill:#F8F9FB;stroke:#D9DCE5;rx:10;cursor:pointer}
.inode text{font:600 12.5px "Instrument Sans",sans-serif;fill:#16181D;pointer-events:none}
.inode .isub{font:400 9.5px "DM Mono",monospace;fill:#8A8F9C}
.inode.on rect,.inode:hover rect{stroke:#5B5BD6;fill:#EDEDFB}
.inode.center rect{fill:#16181D;stroke:#16181D}
.inode.center text{fill:#fff}
.imap-detail{border-top:1px solid #EEF0F5;margin-top:6px;padding:14px 6px 10px;min-height:64px}
.imap-detail .t{font-weight:600;font-size:14.5px;margin:0 0 4px}
.imap-detail p{font-size:13.5px;color:#5D636E;line-height:1.6;margin:0;max-width:70ch}
.imap-detail a{color:#5B5BD6;font-weight:500}
.imap-hint{font:400 11.5px "DM Mono",monospace;color:#9A9FAC}

/* diagrams engine — see src/diagrams.js */
.dg{background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:16px 18px 14px;margin:20px 0}
.dg-title{font:500 11.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A8F9C;margin:0 0 10px}
.dg-canvas{overflow-x:auto}
.dg-canvas svg{display:block;height:auto}
.dg-canvas svg[data-dg-fluid]{max-width:100%}
.dgedge{stroke:#C3C8D6;stroke-width:1.6;fill:none}
.dgedge.dgasync{stroke-dasharray:4,4}
.dgedge.dgrail{stroke-dasharray:2,3}
.dgedge.dgtrans{cursor:pointer}
.dgedge.dgtrans:hover,.dgedge.dgtrans.on{stroke-width:2.6}
.dgnode rect,.dgcell rect,.dgtile rect,.dgbucket rect,.dgrule rect,.dgasyncnode rect{cursor:pointer}
.dgnode rect{fill:#F8F9FB;stroke:#D9DCE5}
.dgnode text{font:600 12.5px "Instrument Sans",sans-serif;fill:#16181D;pointer-events:none}
.dgnode.on rect,.dgnode:hover rect,.dgnode:focus-visible rect{stroke:#5B5BD6;fill:#EDEDFB}
.dgnode:focus-visible{outline:none}
.dgnode.dgfinal rect{stroke-width:1.6}
.dgnode.dgrule rect{fill:#F8F9FB;stroke:#D9DCE5}
.dgnode.dgbucket rect{fill:#F8F9FB;stroke:#D9DCE5}
.dgnode.dgbucket.dghuman rect{fill:#F6EFE3;stroke:#B0722A}
.dgnode.dgasyncnode rect{fill:#F8F9FB;stroke:#D9DCE5;stroke-dasharray:3,3}
.dgfail{cursor:pointer}
.dgfail polygon{fill:#B0722A;stroke:#B0722A}
.dgfail.on polygon,.dgfail:hover polygon{fill:#96601E;stroke:#96601E}
.dgcell{cursor:pointer}
.dgcell rect{transition:stroke-width .1s}
.dgcell.on rect,.dgcell:hover rect,.dgcell:focus-visible rect{stroke-width:2.2}
.dgtile{cursor:pointer}
.dgtile.on rect,.dgtile:hover rect,.dgtile:focus-visible rect{stroke-width:2}
[data-dgid]:focus-visible{outline:2px solid #5B5BD6;outline-offset:2px}
.dg-legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:12px;font:400 10.5px "DM Mono",monospace;color:#8A8F9C}
.dg-legend span{display:inline-flex;align-items:center;gap:6px}
.dg-legend i{display:inline-block;width:16px;height:2px;background:#C3C8D6}
.dg-legend i.lg-dash{background:transparent;border-top:2px dashed #C3C8D6}
.dg-legend i.lg-warn{background:#B0722A}
.dg-legend i.lg-diamond{width:10px;height:10px;background:#B0722A;transform:rotate(45deg);border-radius:2px}
.dg-legend i.lg-tick{width:2px;height:14px;background:#5B5BD6}
.dg-legend i.lg-final{width:14px;height:14px;border-radius:8px;border:1.6px solid #16181D;background:#fff}
.dg-legend i.lg-cell{width:14px;height:14px;border-radius:3px;background:#F8F9FB;border:1px solid #D9DCE5}
.dg-legend i.lg-owner{background:#EDEDFB;border-color:#5B5BD6}
.dg-legend i.lg-source{background:#F8F9FB;border-color:#D9DCE5}
.dg-legend i.lg-never{background:repeating-linear-gradient(45deg,#D9DCE5,#D9DCE5 2px,#fff 2px,#fff 5px)}
.dg-legend i.lg-create{background:linear-gradient(135deg,#EDEDFB 50%,#F8F9FB 50%);border-color:#5B5BD6}
.dg-legend i.lg-trunc{background:#F8F9FB;border-color:#B0722A;clip-path:polygon(0 0,80% 0,100% 20%,100% 100%,0 100%)}
.dg-legend i.lg-human{background:#F6EFE3;border-color:#B0722A}
.dg-legend i.lg-gate{width:14px;height:2px;background:none;border-top:1.4px dashed #B0722A}
.dg-blind{font-size:13px;color:#5D636E;line-height:1.6;margin:10px 0;max-width:70ch}
.dg-blind b{color:#16181D;font-weight:600}
.dg-rule{font:600 14.5px "Instrument Sans",sans-serif;color:#16181D;margin:14px 0 0;max-width:60ch}
.dg-note{font-size:12.5px;color:#8A8F9C;line-height:1.6;margin:8px 0 0;max-width:70ch}
.dg-detail{border-top:1px solid #EEF0F5;margin-top:12px;padding:12px 4px 2px;min-height:56px}
.dg-detail .t{font-weight:600;font-size:14px;margin:0 0 4px}
.dg-detail p{font-size:13.5px;color:#5D636E;line-height:1.6;margin:0 0 6px;max-width:70ch}
.dg-detail a{color:#5B5BD6;font-weight:500}
/* chain, drawn in HTML so it wraps instead of shrinking */
.dgc{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px 34px;padding:6px 2px 2px}
.dgc-col{position:relative;flex:0 0 140px;width:140px;display:flex;flex-direction:column;gap:7px}
.dgc-col+.dgc-col::before{content:"";position:absolute;left:-30px;top:23px;width:20px;height:2px;background:#C3C8D6}
.dgc-col+.dgc-col::after{content:"";position:absolute;left:-14px;top:18px;border:6px solid transparent;border-left:7px solid #C3C8D6}
.dgc-step{background:#F8F9FB;border:1px solid #D9DCE5;border-radius:10px;padding:9px 10px;min-height:48px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;justify-content:center}
.dgc-step b{display:block;font:600 12.5px "Instrument Sans",sans-serif;color:#16181D;line-height:1.25}
.dgc-step small{display:block;font:400 9.5px "DM Mono",monospace;color:#8A8F9C;margin-top:3px}
.dgc-step.on,.dgc-step:hover,.dgc-step:focus-visible{border-color:#5B5BD6;background:#EDEDFB}
.dgc-cp{font:400 9.5px "DM Mono",monospace;color:#5B5BD6;padding-left:8px;border-left:2px solid #5B5BD6;line-height:1.3;margin-left:4px}
.dgc-fail{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:400 9.5px "DM Mono",monospace;color:#96601E;
  background:#F7EADB;border:1px solid #E0C7A8;border-radius:6px;padding:3px 8px 3px 6px;cursor:pointer;margin-left:4px}
.dgc-fail i{width:8px;height:8px;background:#B0722A;transform:rotate(45deg);border-radius:1px;flex:none}
.dgc-fail.on,.dgc-fail:hover,.dgc-fail:focus-visible{border-color:#B0722A;background:#F3DFC6}
.dgc-rail{background:#fff;border:1px dashed #C3C8D6;border-radius:8px;padding:6px 8px 6px 24px;font:400 10px "DM Mono",monospace;color:#5D636E;
  cursor:pointer;line-height:1.35;position:relative;margin-left:4px}
.dgc-rail .g{position:absolute;left:8px;top:6px;color:#8A8F9C;font-size:12px}
.dgc-rail small{display:block;color:#9A9FAC;margin-top:2px;font-size:9.5px}
.dgc-rail.on,.dgc-rail:hover,.dgc-rail:focus-visible{border-color:#5B5BD6;color:#16181D}
/* layers, drawn in HTML so each band wraps its nodes */
.dgl{display:flex;flex-direction:column;padding:4px 0 2px}
.dgl-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px 14px;align-items:center;background:#F5F6FA;border-radius:12px;padding:11px 13px}
.dgl-lab{font:500 9.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8F9C;line-height:1.4}
.dgl-nodes{display:flex;flex-wrap:wrap;gap:8px}
.dgl-node{background:#fff;border:1px solid #D9DCE5;border-radius:9px;padding:7px 11px;cursor:pointer;min-width:0}
.dgl-node b{display:block;font:600 12.5px "Instrument Sans",sans-serif;color:#16181D;line-height:1.25}
.dgl-node small{display:block;font:400 9.5px "DM Mono",monospace;color:#8A8F9C;margin-top:2px}
.dgl-node.on,.dgl-node:hover,.dgl-node:focus-visible{border-color:#5B5BD6;background:#EDEDFB}
.dgl-row.dgl-core{background:#16181D}
.dgl-core .dgl-lab{color:#A5A8F5}
.dgl-core .dgl-node{background:#23262E;border-color:#3A3E4A}
.dgl-core .dgl-node b{color:#fff}
.dgl-core .dgl-node small{color:#B0B5C2}
.dgl-core .dgl-node.on,.dgl-core .dgl-node:hover,.dgl-core .dgl-node:focus-visible{border-color:#8B8FF0;background:#2C2F5A}
.dgl-arrow{display:flex;align-items:center;gap:12px;padding:3px 0 3px 138px;min-height:34px}
.dgl-arrow i{width:2px;height:24px;background:#C3C8D6;position:relative;flex:none}
.dgl-arrow i::after{content:"";position:absolute;left:-5px;bottom:-3px;border:6px solid transparent;border-top:7px solid #C3C8D6;border-bottom:0}
.dgl-arrow.dgl-async i{background:repeating-linear-gradient(#C3C8D6 0 3px,transparent 3px 6px)}
.dgl-arrow span{font:400 10px "DM Mono",monospace;color:#8A8F9C;line-height:1.4}
.dgl-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.dgl-cols .dgl-row{grid-template-columns:1fr;align-content:start;height:100%}
.dgl-gap{text-align:center;font:400 10.5px "DM Mono",monospace;letter-spacing:.06em;color:#96601E;padding:8px 0;margin:8px 0;
  border-top:1px dashed #E0C7A8;border-bottom:1px dashed #E0C7A8}
.dgl-back{display:flex;align-items:center;gap:12px;padding:6px 0 6px 138px;min-height:34px}
.dgl-back i{width:2px;height:24px;background:repeating-linear-gradient(#B0B5C2 0 3px,transparent 3px 6px);position:relative;flex:none}
.dgl-back i::after{content:"";position:absolute;left:-5px;top:-3px;border:6px solid transparent;border-bottom:7px solid #B0B5C2;border-top:0}
.dgl-back span{font:400 10px "DM Mono",monospace;color:#8A8F9C;line-height:1.4}
@media(max-width:640px){
  .dgl-row{grid-template-columns:1fr;gap:6px}
  .dgl-arrow,.dgl-back{padding-left:14px}
  .dgc{gap:16px 30px}
  .dgc-col{flex-basis:calc(50% - 15px);width:auto}
}

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);}
.legacy .mono{font-family:"DM Mono",ui-monospace,monospace}
.legacy main{padding:0 0 80px; min-width:0}
.legacy .chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
  font-family:"DM Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid transparent; white-space:nowrap;}
.legacy .chip.live{background:var(--ok-bg); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.legacy .chip.emul{background:var(--warn-bg); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.legacy .chip.note{background:var(--idle-bg); color:var(--ink-3); border-color:var(--line)}
.legacy .chip.plain{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}
.legacy .pagehead{padding:38px 0 0}
.legacy .pagehead h1{font-size:31px; letter-spacing:-.015em; line-height:1.2}
.legacy .pagehead .sub{color:var(--ink-2); font-size:16px; margin-top:10px; max-width:62ch}
.legacy .metarow{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.legacy section.block{margin-top:34px}
.legacy section.block > h2{font-size:12px; font-family:"DM Mono",monospace; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.legacy section.block p{margin:0 0 12px; max-width:66ch; color:var(--ink-2)}
.legacy section.block p strong{color:var(--ink); font-weight:600}
.legacy section.block ul{margin:0 0 12px; padding-left:20px; max-width:66ch; color:var(--ink-2)}
.legacy section.block li{margin-bottom:6px}
.legacy section.block li::marker{color:var(--line-strong)}
.legacy .card{background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow)}
.legacy .stage{border:1px dashed var(--line-strong); border-radius:9px; background:var(--surface-2);
  min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:38px 24px; color:var(--ink-3);}
.legacy .stage .lbl{font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.legacy .stage .hint{font-size:13.5px; max-width:44ch}
.legacy .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px}
.legacy .tile{display:block; padding:16px 17px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); cursor:pointer; color:inherit;}
.legacy .tile:hover{border-color:var(--line-strong); text-decoration:none; box-shadow:var(--shadow)}
.legacy .tile h3{font-size:16px; margin-bottom:5px; letter-spacing:-.01em}
.legacy .tile p{font-size:13.5px; color:var(--ink-3); margin:0 0 11px; line-height:1.5}
.legacy .tile .foot{display:flex; gap:6px; flex-wrap:wrap}
.legacy table{border-collapse:collapse; width:100%; font-size:13.5px}
.legacy th, .legacy td{text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top}
.legacy th{font-family:"DM Mono",monospace; font-size:10.5px; letter-spacing:.1em;
   text-transform:uppercase; color:var(--ink-3); font-weight:500}
.legacy td.num{font-variant-numeric:tabular-nums; text-align:right}
.legacy .scroll{overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--surface)}
.legacy .callout{border-left:3px solid var(--warn); background:var(--warn-bg); color:var(--ink);
  padding:13px 16px; border-radius:0 7px 7px 0; font-size:14px; max-width:66ch;}
.legacy .callout.acc{border-left-color:var(--accent); background:var(--accent-soft)}
.legacy .callout p:last-child{margin-bottom:0}
.legacy .callout .k{font-family:"DM Mono",monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; display:block; margin-bottom:5px; color:var(--ink-2)}
.legacy .kv{display:grid; grid-template-columns:150px minmax(0,1fr); gap:2px 18px; font-size:14px}
.legacy .kv dt{font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); padding-top:4px}
.legacy .kv dd{margin:0 0 10px; color:var(--ink-2)}
.legacy .console{display:grid; gap:12px}
.legacy .qbox{width:100%; min-height:96px; resize:vertical; padding:12px 14px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:"DM Mono",monospace; font-size:13px; line-height:1.6;}
.legacy .qbox:focus{outline:2px solid var(--accent); outline-offset:1px}
.legacy .btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.legacy button.act{font:500 13px/1 "Instrument Sans",sans-serif; padding:9px 15px; border-radius:7px; cursor:pointer;
  border:1px solid var(--accent); background:var(--accent); color:#fff;}
.legacy button.act:hover{filter:brightness(1.08)}
.legacy button.ghost{font:400 12.5px/1 "DM Mono",monospace; padding:7px 11px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);}
.legacy button.ghost:hover{border-color:var(--line-strong); color:var(--ink)}
.legacy button.ghost[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.legacy .result{font-family:"DM Mono",monospace; font-size:11.5px; color:var(--ink-3); letter-spacing:.03em}
.legacy .errbox{border-left:3px solid var(--crit); background:var(--crit-bg); color:var(--ink);
  padding:11px 14px; border-radius:0 7px 7px 0; font-family:"DM Mono",monospace; font-size:12.5px;}
.legacy .counters{display:flex; flex-wrap:wrap; gap:7px}
.legacy .counter{border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:7px 11px; min-width:96px;}
.legacy .counter b{display:block; font-family:"DM Mono",monospace; font-size:16px; font-variant-numeric:tabular-nums}
.legacy .counter span{font-size:10.5px; color:var(--ink-3); letter-spacing:.05em; text-transform:uppercase}
</style>

 {h:'Cleaning up contacts, deduplication and enrichment', tag:'CONTACTS',
  intro:'Contacts had been created situationally for years, so duplicates were everywhere — worst where one person held roles at several sub-companies of the same group. The fix was a model rather than a clean-up script: contacts and accounts joined many-to-many, every existing record migrated onto it, and enrichment wired in so a provider credit is spent once. Every account went through the analysis; new contacts now arrive through the same identity rules.',

 {h:'Trade shows: booking, meetings, follow-up', tag:'EVENTS',

 {h:'AI in the CRM: recaps, loss analysis, drafted text', tag:'AI',

 {h:'Connecting Teams, Slack and Jira to the CRM', tag:'SYNC',
  intro:'CRM tasks and tracker issues talk to each other directly, and the topic chats in Teams and Slack feed the tracker: comments are collected, filed against the right issue, and never retyped by hand. The hard part is not the transport — it is deciding which system is right when two of them disagree.',

 {h:'Weekly reports, reminders and workflows', tag:'AUTOMATION',
  intro:'Hundreds of automations run the routine — workflows, blueprints, schedulers, external flows and server-side jobs. Sales leads get their weekly picture assembled for them; individual salespeople get the reminders that keep records moving, delivered where they already work rather than in an inbox nobody opens.',

const AI_GROUPS=[
 {h:'AI in engineering', tag:'ENGINEERING',

 {h:'AI as a business solution', tag:'WORKFLOWS',

 {h:'AI assistance inside CRM interfaces', tag:'INTERFACES',

const ALL={};
function reg(items,tab,group){
 if(!isPublic(tab)) return;
 const list=items.filter(it=>!PUBLIC_HIDDEN_ITEMS.includes(it.id) && (SHOW_PLANNED || it.kind!=='plan'));
 list.forEach((it,i)=>ALL[it.id]={...it,tab,group,idx:i,list});
}
ZOHO_GROUPS.forEach(g=>reg(g.items,'zoho',g.h));
AI_GROUPS.forEach(g=>reg(g.items,'ai',g.h));
/* The cross-platform port lives under the contacts work on the Zoho tab, but it is Salesforce
   work and follows that section's switch. */
if(isPublic('salesforce')) reg(SF_ITEMS,'zoho','Cleaning up contacts, deduplication and enrichment');
reg(FS_ITEMS,'fullstack','Full-stack');
/* The AI pages that are Zoho work first — the model is one stage of a CRM process, the
   assistant writes into CRM records, the MCP surface fronts the org tooling — are registered
   under Zoho when the AI section is off, instead of disappearing with the tab. The rest of
   that tab (AI in engineering, recurring reports, the plan page) stays with it. */
const AI_UNDER_ZOHO=['chat-recap','agent-journal','loss-analysis','mcp-product','code-intelligence'];
if(!isPublic('ai')){
 const all=AI_GROUPS.flatMap(g=>g.items);
 reg(AI_UNDER_ZOHO.map(id=>all.find(i=>i.id===id)).filter(Boolean),'zoho','AI in the CRM: recaps, loss analysis, drafted text');
}

function wireCaseStudy(c){
 if(!(c.embed&&PAGE[c.embed])) return;
 const host=document.getElementById('cs-embed'); if(!host) return;
 const pg=PAGE[c.embed];
 if(pg.wire) pg.wire(c.embedTab?{tab:c.embedTab}:undefined);
 /* A record page mounts asynchronously and opens on its first tab; when the case
    wants another tab, click it once the tab strip exists. The event page takes
    the tab directly through its wire(), so this only matters for the others. */
 if(c.embedTab && c.embed!=='event'){
  let tries=0;
  const tick=()=>{ const b=host.querySelector('.tabs button[data-t="'+c.embedTab+'"]');
   if(b){ if(b.getAttribute('aria-selected')!=='true') b.click(); return; }
   if(++tries<40) setTimeout(tick,100); };
  setTimeout(tick,100);
 }
}

  +'<div class="sechead">The invented company</div><dl class="kv"><dt>Company</dt><dd>'+CO.name+'</dd>'
  +'<dt>Business</dt><dd>'+CO.what+'</dd>'
  +'<dt>Why this one</dt><dd>It needs the same shapes the work needs — accounts and people, a service '
  +'catalogue sold across '+CO.unit+'s, programmes tracked in an issue tracker, and a sales team that meets '
  +'clients at trade shows — without resembling any employer.</dd></dl>';
}

function vAI(){
 return '<p class="eyebrow">Architecture and implementation, not a prompt gallery</p><h1>Applied AI</h1>'
  +'<p class="lede">I design and implement AI across three layers of the CRM platform: engineering the system '
  +'itself, running evidence-based business workflows, and assisting salespeople inside the interfaces they '
  +'already use. The model handles interpretation and drafting; the surrounding architecture handles data '
  +'collection, permissions, validation, scheduling, human review, write-back and auditability.</p>'
  +'<div class="callout"><span class="k">The boundary</span>'
  +'<p style="margin:0">Grounded in evidence, bounded by deterministic controls, auditable after every write. '
  +'Where a model is trusted with a judgement, the page says so; where the surrounding code does the work and '
  +'the model only drafts, it says that too.</p></div>'
  +groupSections(AI_GROUPS);
}
function vFS(){
 return '<p class="eyebrow">The engineering around CRM work</p><h1>Full-stack</h1>'
  +'<p class="lede">CRM work does not stop at the platform boundary. I build the missing layer around it: '
  +'external interfaces and standalone sites, Node.js and Python automation, server-side integration services, '
  +'data-processing tools and workers for operations that do not fit inside Zoho’s execution limits.</p>'
  /* The four categories below are real work, but the write-ups are not published
     here yet. Naming them without cards is the honest shape: inventing four case
     studies to fill a grid would be the one thing this tab must not do. */
  +'<div class="callout"><span class="k">Not published yet</span>'
  +'<p style="margin:0">Four categories of this work sit outside the portfolio for now — an external service '
  +'taking the operations the CRM cannot run, a Node.js and Python integration backend, interfaces built outside '
  +'the CRM around CRM data, and migration and transformation tooling. Each needs its own write-up with the real '
  +'boundary, failure model and hand-back, and none of them is worth a card until it has one. What follows is the '
  +'part that is finished — and it is the same engineering, applied to this site.</p></div>'
  +'<div class="sechead">How this portfolio is engineered</div>'
  +'<p class="sub">The portfolio is itself a compact example of the surrounding engineering: production-derived '
  +'CRM interfaces run against synthetic data, a platform emulator and deliberate failure modes inside one static '
  +'build.</p>'
  +split(FS_ITEMS);
}

/* ---------------- item page ---------------- */
function pager(it){
 const list=siblings(it), idx=list.findIndex(x=>x.id===it.id);
 const prev=list[idx-1],next=list[idx+1];
 return '<div class="pager">'
  +(prev?'<a href="#/p/'+prev.id+'"><span class="lab">&larr; previous</span>'+esc(prev.t)+'</a>':'<span></span>')
  +(next?'<a href="#/p/'+next.id+'" style="text-align:right"><span class="lab">next &rarr;</span>'+esc(next.t)+'</a>':'<span></span>')
  +'</div>';
}

 document.getElementById('tabs').innerHTML=TABS.map(t=>

  +t.t+(t.nb?'<span class="nb">'+t.nb+'</span>':'')+'</a>').join('');
}

const CASES = {
  /* Pages promised on the index and now written. Each follows the same
     three obligations as the rest of the site: name the constraint before
     the solution, and say what the solution cost. */
  'Written up from the platform work':[
    {id:'contact-model', t:'One person, several companies — without duplicate identities',
     sub:'A many-to-many contact model, the migration onto it, and the identity rules every inbound path now obeys.',
     body:[
      ['One person, several employers, and a field that holds one',
       'A contact record stores one company. That is fine until the client is a group: somebody holds a role at the parent, a second at a subsidiary, and a history at a third that was acquired two years ago. A single company field forces a choice between losing that history and creating a second person to carry it, and years of records made situationally had settled on the second. The result was not an untidy database. It was duplicates concentrated precisely where the money is — on the multi-entity accounts — and enrichment credits being spent on identities the CRM already held.'],
      ['A junction, not a bigger text field',
       'The person and the company became separate identities joined through a junction module, so a role is a record in its own right: which company, over what period, and whether it is the current main one. Nothing survives as a pseudo-relation inside a text field, which means employment history can be queried rather than read, and “who do we know across this group” has an answer that does not depend on which subsidiary somebody happened to type on the day.'],
      ['Migrating records that were already wrong',
       'The existing records had to move onto the model, and they were not clean when they moved, so the migration was a reconciliation rather than a copy. Candidates were gathered across the whole account hierarchy instead of the single account, then matched on ordered evidence — authoritative identifiers first, normalised contact evidence next, a normalised profile URL last — and anything that could not be proved was left for a person rather than merged on a likelihood. The asymmetry is deliberate: a surviving duplicate is visible and irritating, while a wrong merge quietly destroys somebody’s history and leaves no trace that it happened.'],
      ['What every inbound path now has to do',
       'A model is only worth having if every route obeys it. Identity resolution runs before creation on every inbound path, and enrichment runs only after resolution — so a provider credit is spent once, on a person the CRM has established it genuinely does not know. Ambiguous matches stay visible as ambiguous instead of being settled by whichever integration happened to run last, and a new integration does not get to arrive with its own private definition of a duplicate.'],
      ['The trade',
       'The relationship layer is real complexity, and every consumer — widget, report, integration — has to understand it. That cost is taken deliberately, because the simplicity it replaced existed only in the schema. Users were already carrying the complexity as duplicate records, lost employment history and a question about a group account that nobody could answer; they were simply carrying it without any of the tools this model hands back.']]},
    {id:'deluge-cicd', t:'From browser-only code to reviewed delivery',
     sub:'Pull, analyse, review, deploy, run and verify — one controlled toolchain around a browser-only editor.',
     body:[
      ['A browser editor is not a development environment',
       'The platform presents functions one at a time in a browser editor. That is enough to change a line. It is not enough to search the estate for a pattern that repeats, to review a change touching four functions as one change, to know what else calls the thing being edited, or to establish afterwards that production received what was approved. Without those, deployment means somebody pasting text into a form and remembering that they did.'],
      ['Pull, and normalise into something reviewable',
       'The estate is pulled into a local searchable codebase and normalised into the same analysis system that carries the dependency and invocation index, so a change is read against what calls it rather than on its own. This is the extraction the org tooling is built on; the pipeline is what happens to that code afterwards.'],
      ['Review as the gate, git as the record',
       'Changes are made under git review. That is unremarkable anywhere else and is the entire point here: it gives the platform an authored change history it does not otherwise have, and a place where a second person can disagree before production sees anything. It also makes the reasoning durable — why a criterion was changed outlives the conversation in which somebody decided to change it.'],
      ['Deploy, run, and prove it landed',
       'Delivery does not end with a successful request. The platform will accept a save and then serve something else, so a deployment counts as landed only when an independent read returns the same content, compared by hash rather than by eye. The function is then run through the same tooling with its output captured against the version that produced it, which makes a failure attributable to a specific change instead of to somebody’s recollection of one.'],
      ['What the pipeline rests on',
       'It stands on platform surfaces that are less complete and less stable than a real source API: some endpoints are undocumented, the versions were found empirically, and part of the flow depends on a session that expires. So every unsupported path and manual fallback is written down and kept visible rather than being allowed to settle into tribal knowledge. A pipeline whose failure modes are undocumented is a pipeline that strands whoever inherits it, which is the same problem it was built to solve.']]},
    {id:'code-intelligence', t:'Code intelligence across the whole org',
     sub:'Full-org extraction, AI-assisted review, dependency analysis and risk discovery across the function estate.',
     body:[
      ['One function at a time is the wrong unit',
       'Reviewing a pasted function cannot reveal a pattern duplicated across two hundred others, a missing failure policy repeated at every call site, or a change that breaks an invocation path three systems away. The unit of the problem is the estate, not the file. The code has to exist as one system before anything — a model or a person — can reason about the system rather than about the snippet on screen.'],
      ['The workflow',
       'With the estate extracted and joined to dependency, invocation and configuration evidence, AI is pointed at the work that scales badly for a person: reviewing for missing error handling, finding patterns that disagree with each other across modules, flagging where a proposed change carries regression risk, tracing what a rename actually touches, and drafting documentation nobody wants to write twice. Findings are review material. Nothing travels from a finding straight into production.'],
      ['From finding to change',
       'Approved work goes down the ordinary delivery path — source review, tests, controlled deployment, verification by read-back. Reusable skills encode the review stages and the platform’s own constraints, so the process is a file that gets changed deliberately rather than a prompt somebody rebuilds from memory and slightly differently each time.'],
      ['What it cannot decide',
       'It can find suspicious code and explain why the code deserves attention. It cannot decide what the business meant, and it cannot prove a function is unused from code alone — that needs the five entry channels, and even then the answer is bounded by the one class of function the extraction cannot see. The output worth worrying about here is not a wrong finding, which review catches, but a confident silence over the part of the estate nobody realised was missing from it.']]},
    {id:'team-intelligence', t:'Recurring team intelligence, delivered automatically',
     sub:'AI-generated reports and management summaries with deterministic scheduling and delivery controls.',
     body:[
      ['A report nobody has time to assemble',
       'A sales lead needs a regular picture of what moved, what stalled and what now needs a decision. Assembled by hand it costs the most expensive hour of the week and gets dropped whenever the week is busy — which is reliably the week it mattered. Handed naively to a model, it produces confident prose over whatever data happened to be reachable, which is worse, because it reads exactly like the version that was checked.'],
      ['Deterministic evidence, bounded interpretation',
       'So the evidence is assembled by deterministic code: the period selected, the records pulled, access and data-quality rules applied, and the package built before a model is involved at all. The model then receives one bounded task over a governed input — turn this into the narrative the team reads — and nothing else. Scheduling, delivery, staleness detection and failure reporting all stay outside it, because none of them get better when they are guessed.'],
      ['Delivery, and the failure that has to be visible',
       'The output names its period and its sources, separates what is missing from what is interpreted, and keeps links back to the records behind each claim, so a reader who disbelieves a sentence can reach the deal it came from. When generation fails or the evidence is incomplete, that becomes a visible state rather than a shorter report that still looks finished — a report which silently narrows its own scope is the dangerous one, because it is still trusted. The same machinery points at individuals as well as teams: the reminders that keep records moving, delivered where people already work rather than into an inbox nobody opens.'],
      ['The trade',
       'A generated narrative is easier to read and harder to compare than a table. So the structured metrics stay structured and remain the source of truth; the narrative explains them and never replaces the fields underneath. The risk this design exists to hold off is a team that gradually starts reporting on the prose instead of the numbers, and it is held off by keeping the numbers visibly in charge rather than by trusting anybody to remember.']]},
    {id:'widget-system', t:'Seventy widgets as one product system',
     sub:'Shared components, services, versioning and mobile adaptation behind 70+ production interfaces.',
     body:[
      ['Seventy widgets, or seventy copies of the same table',
       'Seventy independent widgets are seventy versions of the same table, the same validation rule, the same failure message and the same date formatting, each drifting on its own schedule. The visible estate grows and delivery slows with every copy, because a fix has to be found in seventy places before it can be applied in one — and the seventieth is always the one nobody remembers.'],
      ['A shared layer, with rules about changing it',
       'The widgets share component patterns, service wrappers around the platform SDK, a common error envelope and one visual language. What makes that a system rather than a folder of helpers is the rules attached to it: versioning, and a stated compatibility policy for changing something seventy screens depend on.'],
      ['Three surfaces, one set of decisions',
       'Desktop, Canvas and mobile are three hosts with different space, different input, and on a phone no developer tools at all. They reuse the same decisions — the same data access, the same validation, the same failure behaviour — and adapt only the presentation to the host, rather than forking the logic once per surface and then maintaining three versions of the same bug.'],
      ['Quality at a scale nobody can click through',
       'Nobody reviews seventy widgets by hand before a release. The offline SDK harness runs them against seeded data and deliberate failures, and browser checks run at desktop and phone widths, failing on any console error rather than only on a failed assertion. The aim is not a coverage number; it is that a change to the shared layer is verified somewhere other than in production, on somebody else’s afternoon.'],
      ['The trade',
       'A shared layer makes local changes safer and platform-wide changes more consequential: one careless edit to a shared component reaches every screen at once. That is exactly why versioning and compatibility rules are part of the product rather than cleanup deferred to later. The cost is real and worth naming — a change that would take an afternoon inside one isolated widget takes longer here, and that slower path is what buys the other sixty-nine screens not breaking.']]}],
