const LEAD={
 event:'One campaign record carries the event from preparation to follow-up: several hundred target contacts, a meeting schedule, a booking flow that checks people and rooms, and mobile interfaces for the team on the floor. The widgets share one data model, so every view is another operating surface over the same event rather than a separate tool.',
 board:'The same event platform on the device people carry at the venue: a room timeline, team load, conflict and travel warnings, and a recap flow that writes back to CRM. The interface is designed for short interactions, unreliable attention and a host environment with no mobile developer tools.',
 solution:'A programme record becomes an account-planning surface: business units on one axis, service lines on the other, and the latest deal visible in every cell. Unworked potential stays visible alongside pipeline, and a new opportunity starts from the exact row and column where the gap was found.',
 orghealth:'A mature CRM accumulates automation nobody can fully account for. This report reconciles every function against rules, schedules, buttons, widgets and other functions, then distinguishes reachable code, unsupported assumptions and genuine audit gaps. The public dataset is generated; the instrument and the method are the real work.',
 'org-tooling':'Zoho exposes the running platform, but not the complete codebase, dependency graph or change history an engineering team needs. I built the missing layer around it: function extraction, configuration snapshots, dependency and invocation analysis, external-call inventory, Git review, and tools that deploy and run approved functions.',
 'chat-tracker':'A tagged Teams reply becomes the correct Jira comment without manual re-entry. The thread carries context, CRM carries routing and delivery state, and Jira owns the issue and its visibility. Every run is safe to replay, and missing routing data is skipped rather than guessed.',
 'cross-system':'Integration becomes dangerous when transport is implemented before ownership. These cases start by naming which system owns each field, what may fill an empty value, what must never overwrite a person, and when automation must refuse rather than guess.',
 'chat-recap':'Meetings held in Teams use Teams transcripts; meetings held elsewhere use Krisp. Both enter the same process: resolve the meeting and the account, gather the evidence, generate a recap to the corporate standard, validate it and write the structured result back to CRM. The source boundary is open to further providers without changing the workflow around it.',
 'loss-analysis':'A free-text explanation cannot be compared across deals. This design gathers evidence from six sources, materialises a human-correctable intermediate record, then asks the model to place the case inside the company’s own taxonomy. Evidence collection and classification are deliberately separated, so a correction does not require repeating the whole pipeline.',
 'agent-journal':'A write-capable agent needs more than a chat history. This portfolio prototype resolves a command against the live field list, validates the target, pauses on high-risk changes, and writes every proposed action to a filterable journal with the before and after state.',
 'mcp-product':'Claude works with CRM records and related operations through a scoped MCP surface connected to the surrounding Zoho tooling. Reusable skills combine record operations with function pull, analysis, deploy and run capabilities, turning one-off prompts into repeatable development, audit and operational workflows.',
 'ai-workflow':'AI is used throughout delivery: designing new functions and interfaces, generating Deluge, JavaScript and Python, reviewing existing code, expanding tests, identifying regression risk, analysing dependencies and maintaining documentation. The extracted org provides the context; Git review, controlled deployment and automated checks provide the acceptance boundary.',
 harness:'A widget normally runs only inside a live CRM and the SDK it controls. I built an offline test harness around the subset the widget estate actually uses: lifecycle, record APIs, queries, function calls, connection calls, validation and failure envelopes. Production-derived interfaces can now be exercised before deployment, against repeatable data and deliberate failures.',
 generator:'Random data makes every review noisy, while perfectly clean data removes the cases CRM software must survive. The generator solves both: a fixed seed makes every diff reproducible, and explicit defect injection creates missing emails, conflicting meetings and duplicate-looking identities on purpose.',
 'ci-guards':'Every public replica begins with private source material, so every file is a possible leak. The build checks generated-data integrity, scans source for values shaped like real org identifiers, hosts, domains or credentials, and runs the full behavioural suite before publication.',
 site:'This site turns the offline widget harness into a public environment: production-derived interfaces run against synthetic records, an emulated platform SDK and deliberate latency, throttling, token and validation failures. The company and the surrounding application shells are invented; no employer endpoint, credential or internal identifier is present.',
 'sf-lwc':'The workflow is the constant: change the main employer with two ordered writes, restore the old state if the second fails, and surface field-access errors as user-facing messages. The Zoho widget and the Salesforce Lightning Web Component implement that same contract through different platform primitives.'
};

      + 'for a person on the fields that matter, and the journal every action writes to — a module with filters, not '

/* A write-up with a screen behind it says so and links to it. */
const PAIR={
  'org-tooling':'orghealth', 'cross-system':'event'
};

function sec(h, inner){ return '<div class="sechead">'+esc(h)+'</div><div class="prose">'+inner+'</div>'; }

function vCase(c){
  let h='';
  if(c.role) h+='<div class="callout acc"><span class="k">My role on this one</span><p>'+c.role+'</p></div>';
  const sections=c.body.map(([head,text])=>sec(head,'<p>'+text+'</p>'));
  if(window.Diagrams){
    /* A write-up may carry more than one diagram. Splicing runs from the last
       position backwards so an earlier insert cannot shift a later index. */
    const specs=(c.dgs||(c.dg?[c.dg]:[])).slice()
      .sort((a,b)=>(b.at!=null?b.at:1)-(a.at!=null?a.at:1));
    specs.forEach(d=>{
      const at=Math.min(d.at!=null?d.at:1, sections.length);
      sections.splice(at,0,window.Diagrams.render(d));
    });
  }
  return h + sections.join('');
}
function vHow(){
  return ABOUT.body.map(([h,t])=>sec(h,'<p>'+t+'</p>')).join('')
   + sec('Legend','<dl class="kv"><dt>Company</dt><dd>'+CO.name+'</dd>'
     + '<dt>Business</dt><dd>'+CO.what+'</dd>'
     + '<dt>Why this one</dt><dd>It needs the same shapes the work needs — accounts and people, a service '
     + 'catalogue sold across '+CO.unit+'s, programmes tracked in an issue tracker, and a sales team that meets '
     + 'clients at trade shows — without resembling any employer of mine.</dd></dl>');
}

/* The site's own page markup opens with its own title block; the new one is
   already printed above it, so it is taken out rather than shown twice. */
function withoutPagehead(html){
  const d=document.createElement('div'); d.innerHTML=html;
  const ph=d.querySelector('.pagehead'); if(ph) ph.remove();
  return d.innerHTML;
}

function vItem(it){
  const p=PAGE[it.id], c=CASE_BY_ID[it.id];
  let h='<a class="back" href="#/'+it.tab+'">&larr; '+esc(it.group)+'</a>'
   +'<h1 style="font-size:clamp(26px,3.6vw,36px)">'+esc(it.t)+'</h1>'
   +'<p class="lede">'+esc(it.s)+'</p>'
   +'<div style="margin:0 0 8px">'+kchip(it.kind)+'<span class="chip">'+esc(it.group)+'</span>'
   +(MAT[it.id]||[]).map(m=>'<span class="chip">'+esc(m)+'</span>').join('')+'</div>'
   +(LEAD[it.id]?'<p class="pagelead">'+esc(LEAD[it.id])+'</p>':'');

  if(p)        h+='<div class="legacy">'+withoutPagehead(p.render())+'</div>';
  else if(c)   h+=vCase(c);
  else if(it.kind==='plan')
    h+='<div class="sechead">Planned</div><div class="stage"><span class="lbl">not built yet</span>'
      +'<span class="hint">This one is on the list, not on the site. It is listed so the gap is visible '
      +'rather than implied.</span></div>';
  else
    h+='<div class="sechead">Not written yet</div><div class="stage"><span class="lbl">write-up pending</span>'
      +'<span class="hint">The work exists in this repository; the page describing it has not been written.</span></div>';

  const pair=PAIR[it.id];
  if(pair && ALL[pair])
    h+='<div class="sechead">See it live</div><div class="callout acc"><span class="k">Related demo</span>'
      +'<p style="margin:0"><a href="#/p/'+pair+'">'+esc(ALL[pair].t)+' &rarr;</a></p></div>';

  return h+pager(it);
}

/* Old routes stay alive: everything that was ever linked resolves to its new page. */
const REC2ITEM={solution:'solution',board:'board',tracker:'chat-tracker',teams:'chat-recap'};
const DEMO2ITEM={'solution-map':'solution','event-contacts':'event','meeting-board':'board'};
/* `salesforce` was a top-level tab until the Salesforce work moved into About as
   one CRM track; an old link should land on the section that now carries it
   rather than silently falling through to the default view. */
const FIXED={orghealth:'p/orghealth',event:'p/event',how:'p/site',salesforce:'about'};
function legacyTarget(h){
  const [k,id]=h.split('/');
  if(!k) return null;
  if(FIXED[k]) return FIXED[k];
  if(k==='rec'  && REC2ITEM[id])  return 'p/'+REC2ITEM[id];
  if(k==='demo' && DEMO2ITEM[id]) return 'p/'+DEMO2ITEM[id];
  if((k==='flow'||k==='case') && ALL[id]) return 'p/'+id;
  return null;
}

function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const moved=legacyTarget(h);
  if(moved){ location.replace('#/'+moved); return; }

  const [kind,id]=h.split('/');
  let body,active,item=null;
  if(!kind){ body=vAbout(); active='about'; }
  else if(kind==='p'&&ALL[id]){ item=ALL[id]; body=vItem(item); active=item.tab; }
  else if(TABVIEW[kind]){ body=TABVIEW[kind](); active=kind; }
  else { body=vAbout(); active='about'; }

  const view=document.getElementById('view');
  view.classList.toggle('wide', !!(item && PAGE[item.id] && PAGE[item.id].wide));
  view.innerHTML=body;
  drawTabs(active);
  window.scrollTo(0,0);
  if(active==='about'&&kind!=='p') wireAbout();
  if(item && PAGE[item.id] && PAGE[item.id].wire) PAGE[item.id].wire();

  const els=document.querySelectorAll('.rv');
  if(els.length&&'IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06});
    els.forEach(el=>io.observe(el));
  } else els.forEach(el=>el.classList.add('in'));
}
addEventListener('hashchange',route);
route();

</script>
