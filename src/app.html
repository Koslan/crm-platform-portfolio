<title>Kostiantyn Buriak — CRM platform field notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Light minimalism — committed single light theme, explicit colors everywhere */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F8F9FB;color:#16181D;font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid #5B5BD6;outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(248,249,251,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid #E7E9F0;padding:13px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:600;font-size:17px;letter-spacing:-.02em;margin-right:22px;cursor:pointer}
.logo span{color:#5B5BD6}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{font-weight:500;font-size:14px;color:#5D636E;padding:7px 13px;border-radius:999px}
.tabs a:hover{color:#16181D;background:#EEF0F5}
.tabs a.on{color:#FFFFFF;background:#16181D}
.tabs a .nb{font:500 9.5px "DM Mono",monospace;color:#5B5BD6;vertical-align:6px;margin-left:3px}
.tabs a.on .nb{color:#A5A5F0}
.cvbtn{margin-left:auto;font-weight:500;font-size:13.5px;color:#fff;background:#5B5BD6;
  border-radius:999px;padding:8px 16px}
.cvbtn:hover{filter:brightness(1.07)}

/* ---------- layout ---------- */
.page{max-width:980px;margin:0 auto;padding:56px 32px 80px}
.eyebrow{font:500 12px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#5B5BD6;margin:0 0 14px}
h1{font-weight:600;font-size:clamp(30px,4.4vw,44px);line-height:1.12;letter-spacing:-.035em;margin:0 0 16px;text-wrap:balance}
h2{font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0 0 6px}
.lede{font-size:17px;line-height:1.65;color:#5D636E;max-width:58ch;margin:0 0 24px}
.pagelead{font-size:16px;line-height:1.7;color:var(--ink-2);max-width:66ch;margin:0 0 26px}
.intro{font-size:15.5px;line-height:1.65;color:#5D636E;max-width:62ch;margin:0 0 18px}
.sechead{font:500 11.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8F9C;margin:48px 0 16px;
  display:flex;align-items:baseline;gap:12px}
.sechead::after{content:"";flex:1;border-top:1px solid #E7E9F0;transform:translateY(-3px)}
.sechead:first-of-type{margin-top:8px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:48px;align-items:start;margin-bottom:8px}
.photo{width:180px;height:180px;border-radius:22px;object-fit:cover;border:1px solid #E7E9F0;
  box-shadow:0 12px 32px -14px rgba(22,24,29,.25);justify-self:end}
.ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctas a{display:inline-flex;align-items:center;font-weight:500;font-size:14px;
  padding:10px 18px;border-radius:999px;line-height:1;white-space:nowrap}
.ctas a.pri{background:#16181D;color:#fff}
.ctas a.pri:hover{background:#2A2D35}
.ctas a.sec{border:1px solid #D9DCE5;color:#16181D;background:#fff}
.ctas a.sec:hover{border-color:#B9BECD}
.stats{display:flex;gap:32px;flex-wrap:wrap;margin-top:30px}
/* The Zoho index reuses the hero stat row as a scale strip under the lede:
   same type, one step down in weight, ruled off rather than floating. */
.scale{margin:22px 0 4px;padding-top:18px;border-top:1px solid #E7E9F0;gap:30px}
.scale .stat b{font-size:20px}
.alsolab{font:400 11.5px "DM Mono",monospace;letter-spacing:.06em;color:#8A8F9C;margin:16px 0 8px}
/* A piece of work with one screen behind it should not read as a card that
   failed to find its neighbours: alone, the card takes a deliberate width
   instead of one auto-fill track with empty space beside it. */
.bsec .cards:has(.card:only-child){grid-template-columns:minmax(0,min(520px,100%))}
.stat b{display:block;font-weight:600;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font:400 12px "DM Mono",monospace;color:#8A8F9C}

/* ---------- cards & lists ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:19px 21px;display:block}
.card:hover{border-color:#C9CEDC;box-shadow:0 8px 24px -14px rgba(22,24,29,.18)}
.card h3{font-weight:600;font-size:15.5px;letter-spacing:-.015em;margin:0 0 7px}
.card p{font-size:13.5px;line-height:1.55;color:#5D636E;margin:0 0 12px}
.chip{display:inline-block;font:400 11px "DM Mono",monospace;padding:3px 10px;border-radius:999px;
  background:#EEF0F5;color:#5D636E;margin-right:6px}
.chip.acc{background:#EDEDFB;color:#5B5BD6}
.chip.warn{background:#FBF3E8;color:#B0722A}

.rowlist{background:#fff;border:1px solid #E7E9F0;border-radius:14px;overflow:hidden}
.rowlist a{display:flex;align-items:baseline;gap:12px;padding:11px 18px;border-bottom:1px solid #EEF0F5;font-size:14px}
.rowlist a:last-child{border-bottom:none}
.rowlist a:hover{background:#F5F6FA}
.rowlist .rt{font-weight:500;white-space:nowrap}
.rowlist .rs{color:#8A8F9C;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rowlist .rk{font:400 10.5px "DM Mono",monospace;color:#B0B5C2;white-space:nowrap}

.callout{background:#fff;border:1px solid #E7E9F0;border-left:3px solid #B0722A;border-radius:10px;
  padding:15px 19px;color:#5D636E;font-size:14px;line-height:1.6;max-width:62ch;margin:18px 0}
.callout.acc{border-left-color:#5B5BD6}
.callout b{color:#16181D}
.callout .k{font:500 10.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:5px;color:#8A8F9C}

/* ---------- about: skills & experience ---------- */
.hl{background:linear-gradient(transparent 64%,#DDDDF9 64%);padding:0 1px}
.bsec{margin-top:72px}
.bsec .idx{font:500 12px "DM Mono",monospace;letter-spacing:.14em;color:#5B5BD6;display:block;margin-bottom:6px}
.bsec > h2{font-weight:600;font-size:clamp(22px,3vw,28px);letter-spacing:-.03em;margin:0 0 8px}
.bsec .sub{color:#5D636E;font-size:15px;max-width:60ch;margin:0 0 22px}

/* skill chips with hover detail */
.sk{position:relative;display:inline-block;font:400 12px "DM Mono",monospace;background:#F1F2F7;color:#5D636E;
  border-radius:999px;padding:4px 11px;margin:0 5px 6px 0}
.sk.has{background:#EDEDFB;color:#4C4CC4;cursor:help;border:1px dashed #C9C9F2}
.sk.has:hover,.sk.has:focus-visible{background:#5B5BD6;color:#fff;border-color:#5B5BD6}
.sk .tip{display:none;position:absolute;left:0;bottom:calc(100% + 9px);z-index:40;width:min(330px,72vw);
  background:#16181D;color:#E8EAF2;font:400 12.5px/1.55 "Instrument Sans",system-ui,sans-serif;
  border-radius:11px;padding:11px 14px;box-shadow:0 14px 34px -12px rgba(22,24,29,.45);
  white-space:normal;letter-spacing:0}
.sk .tip::after{content:"";position:absolute;top:100%;left:18px;border:6px solid transparent;border-top-color:#16181D}
.sk .tip.big{width:min(470px,84vw)}
.sk .tip .tl{display:block;font:500 10px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8B8FF0;margin-bottom:6px}
.sk .tip .tb{display:block;margin-top:7px;color:#C2C7D4}
.sk .tip .tm{display:block;margin-top:8px;font:400 10px "DM Mono",monospace;letter-spacing:.06em;color:#6B7080}
.sk.has:hover .tip,.sk.has:focus-within .tip,.sk.has:focus-visible .tip{display:block}
.sk .tip b{color:#fff}
.hoverhint{font:400 11.5px "DM Mono",monospace;color:#9A9FAC;margin:-12px 0 14px}
.hoverhint i{font-style:normal;color:#5B5BD6}

.kv{display:grid;grid-template-columns:190px minmax(0,1fr);gap:2px 22px;font-size:14px;
  background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:20px 24px}
.kv dt{font:500 11px "DM Mono",monospace;letter-spacing:.07em;text-transform:uppercase;color:#8A8F9C;padding-top:5px}
.kv dd{margin:0 0 12px;color:#5D636E;line-height:1.6}
.kv dd:last-child{margin-bottom:0}
.kv dd b{color:#16181D;font-weight:600}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv dt{padding-top:10px}}

.job{display:grid;grid-template-columns:128px minmax(0,1fr);gap:26px;margin-bottom:16px;
  background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:26px 28px}
.job.cur{border-color:#C9C9F2;box-shadow:0 10px 30px -18px rgba(91,91,214,.35)}
.job .when .yr{font-weight:600;font-size:16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.job .when .dur{font:400 11.5px "DM Mono",monospace;color:#8A8F9C;margin-top:3px}
.job .when .now{display:inline-block;font:500 10px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  color:#5B5BD6;background:#EDEDFB;border-radius:999px;padding:2px 8px;margin-top:8px}
.job h3{font-weight:600;font-size:19px;letter-spacing:-.025em;margin:0}
.job h3 span{font-weight:400;color:#5D636E;font-size:16px}
.job .meta{font:400 12px "DM Mono",monospace;color:#8A8F9C;margin:4px 0 12px}
.job p{margin:0 0 12px;max-width:66ch;color:#5D636E;font-size:14.5px;line-height:1.65}
.job p b, .job li b{color:#16181D;font-weight:600}
.job ul{margin:0 0 14px;padding-left:18px;max-width:68ch;color:#5D636E;font-size:14px;line-height:1.6}
.job li{margin-bottom:7px}
.job li::marker{color:#B9BCF0}
.job .g{font:500 10.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8F9C;
  margin:16px 0 8px}
.stack{margin-top:14px}
@media(max-width:700px){.job{grid-template-columns:1fr;gap:8px;padding:20px}}

.proj{background:#F7F7FD;border:1px solid #E0E0F5;border-radius:12px;padding:14px 18px;margin-top:6px}
.proj .k{font:500 10.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#7A7AC9;
  display:block;margin-bottom:9px}
.proj a{display:inline-block;font-size:13px;font-weight:500;color:#5B5BD6;background:#fff;border:1px solid #DCDCF6;
  border-radius:999px;padding:5px 12px;margin:0 6px 6px 0}
.proj a:hover{background:#EDEDFB}
.proj a small{font-weight:400;color:#8A8F9C;margin-left:5px}

.edu{background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:24px 28px;display:grid;
  grid-template-columns:64px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:18px}
.edu .crest{width:64px;height:64px;border-radius:14px;background:#EDEDFB;color:#5B5BD6;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.edu h3{font-weight:600;font-size:17px;letter-spacing:-.02em;margin:0 0 3px}
.edu .deg{font-size:14px;color:#5D636E;margin:0 0 4px}
.edu .meta{font:400 11.5px "DM Mono",monospace;color:#8A8F9C;margin:0 0 10px}
.edu p{font-size:13.5px;line-height:1.6;color:#5D636E;margin:0;max-width:64ch}
@media(max-width:560px){.edu{grid-template-columns:1fr}}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.course{background:#fff;border:1px solid #E7E9F0;border-radius:12px;padding:14px 17px}
.course .p{font:400 10.5px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8F9C;margin-bottom:4px}
.course h4{font-weight:600;font-size:13.5px;letter-spacing:-.01em;margin:0 0 2px}
.course .yr{font:400 11px "DM Mono",monospace;color:#B0B5C2}
.course a{color:#5B5BD6;font-weight:500;font-size:12px}

.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cert{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:18px 20px;display:block}
.cert:hover{border-color:#C9C9F2;box-shadow:0 8px 24px -14px rgba(91,91,214,.3)}
.cert .badge{width:34px;height:34px;border-radius:9px;background:#EDEDFB;color:#5B5BD6;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:10px}
.cert h3{font-weight:600;font-size:14.5px;letter-spacing:-.015em;margin:0 0 3px}
.cert .yr{font:400 11.5px "DM Mono",monospace;color:#8A8F9C}
.cert .vf{font-size:12.5px;font-weight:500;color:#5B5BD6;margin-top:9px;display:block}
.runcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.runcard{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:18px 20px}
.runcard h3{font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin:0 0 5px}
.runcard .rc-sub{font-size:12.5px;line-height:1.5;color:#5D636E;margin:0 0 10px}
.runcard ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.55;color:#5D636E}
.runcard li{margin-bottom:5px}
.runcard a{color:#5B5BD6;font-weight:500}

/* integration map */
.imap{background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:18px 18px 8px;overflow-x:auto}
.imap svg{display:block;max-width:100%;height:auto;min-width:640px}
.iedge{stroke:#C3C8D6;stroke-width:1.6;fill:none;cursor:pointer}
.iedge.on,.iedge:hover{stroke:#5B5BD6;stroke-width:2.6}
.ielab{font:500 10.5px "DM Mono",monospace;fill:#8A8F9C;cursor:pointer}
.ielab.on,.ielab:hover{fill:#5B5BD6}
.inode rect{fill:#F8F9FB;stroke:#D9DCE5;rx:10;cursor:pointer}
.inode text{font:600 12.5px "Instrument Sans",sans-serif;fill:#16181D;pointer-events:none}
.inode .isub{font:400 9.5px "DM Mono",monospace;fill:#8A8F9C}
.inode.on rect,.inode:hover rect{stroke:#5B5BD6;fill:#EDEDFB}
.inode.center rect{fill:#16181D;stroke:#16181D}
.inode.center text{fill:#fff}
.imap-detail{border-top:1px solid #EEF0F5;margin-top:6px;padding:14px 6px 10px;min-height:64px}
.imap-detail .t{font-weight:600;font-size:14.5px;margin:0 0 4px}
.imap-detail p{font-size:13.5px;color:#5D636E;line-height:1.6;margin:0;max-width:70ch}
.imap-detail a{color:#5B5BD6;font-weight:500}
.imap-hint{font:400 11.5px "DM Mono",monospace;color:#9A9FAC}

/* diagrams engine — see src/diagrams.js */
.dg{background:#fff;border:1px solid #E7E9F0;border-radius:16px;padding:16px 18px 14px;margin:20px 0}
.dg-title{font:500 11.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A8F9C;margin:0 0 10px}
.dg-canvas{overflow-x:auto}
.dg-canvas svg{display:block;height:auto}
.dg-canvas svg[data-dg-fluid]{max-width:100%}
.dgedge{stroke:#C3C8D6;stroke-width:1.6;fill:none}
.dgedge.dgasync{stroke-dasharray:4,4}
.dgedge.dgrail{stroke-dasharray:2,3}
.dgedge.dgtrans{cursor:pointer}
.dgedge.dgtrans:hover,.dgedge.dgtrans.on{stroke-width:2.6}
.dgnode rect,.dgcell rect,.dgtile rect,.dgbucket rect,.dgrule rect,.dgasyncnode rect{cursor:pointer}
.dgnode rect{fill:#F8F9FB;stroke:#D9DCE5}
.dgnode text{font:600 12.5px "Instrument Sans",sans-serif;fill:#16181D;pointer-events:none}
.dgnode.on rect,.dgnode:hover rect,.dgnode:focus-visible rect{stroke:#5B5BD6;fill:#EDEDFB}
.dgnode:focus-visible{outline:none}
.dgnode.dgfinal rect{stroke-width:1.6}
.dgnode.dgrule rect{fill:#F8F9FB;stroke:#D9DCE5}
.dgnode.dgbucket rect{fill:#F8F9FB;stroke:#D9DCE5}
.dgnode.dgbucket.dghuman rect{fill:#F6EFE3;stroke:#B0722A}
.dgnode.dgasyncnode rect{fill:#F8F9FB;stroke:#D9DCE5;stroke-dasharray:3,3}
.dgfail{cursor:pointer}
.dgfail polygon{fill:#B0722A;stroke:#B0722A}
.dgfail.on polygon,.dgfail:hover polygon{fill:#96601E;stroke:#96601E}
.dgcell{cursor:pointer}
.dgcell rect{transition:stroke-width .1s}
.dgcell.on rect,.dgcell:hover rect,.dgcell:focus-visible rect{stroke-width:2.2}
.dgtile{cursor:pointer}
.dgtile.on rect,.dgtile:hover rect,.dgtile:focus-visible rect{stroke-width:2}
[data-dgid]:focus-visible{outline:2px solid #5B5BD6;outline-offset:2px}
.dg-legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:12px;font:400 10.5px "DM Mono",monospace;color:#8A8F9C}
.dg-legend span{display:inline-flex;align-items:center;gap:6px}
.dg-legend i{display:inline-block;width:16px;height:2px;background:#C3C8D6}
.dg-legend i.lg-dash{background:transparent;border-top:2px dashed #C3C8D6}
.dg-legend i.lg-warn{background:#B0722A}
.dg-legend i.lg-diamond{width:10px;height:10px;background:#B0722A;transform:rotate(45deg);border-radius:2px}
.dg-legend i.lg-tick{width:2px;height:14px;background:#5B5BD6}
.dg-legend i.lg-final{width:14px;height:14px;border-radius:8px;border:1.6px solid #16181D;background:#fff}
.dg-legend i.lg-cell{width:14px;height:14px;border-radius:3px;background:#F8F9FB;border:1px solid #D9DCE5}
.dg-legend i.lg-owner{background:#EDEDFB;border-color:#5B5BD6}
.dg-legend i.lg-source{background:#F8F9FB;border-color:#D9DCE5}
.dg-legend i.lg-never{background:repeating-linear-gradient(45deg,#D9DCE5,#D9DCE5 2px,#fff 2px,#fff 5px)}
.dg-legend i.lg-create{background:linear-gradient(135deg,#EDEDFB 50%,#F8F9FB 50%);border-color:#5B5BD6}
.dg-legend i.lg-trunc{background:#F8F9FB;border-color:#B0722A;clip-path:polygon(0 0,80% 0,100% 20%,100% 100%,0 100%)}
.dg-legend i.lg-human{background:#F6EFE3;border-color:#B0722A}
.dg-legend i.lg-gate{width:14px;height:2px;background:none;border-top:1.4px dashed #B0722A}
.dg-blind{font-size:13px;color:#5D636E;line-height:1.6;margin:10px 0;max-width:70ch}
.dg-blind b{color:#16181D;font-weight:600}
.dg-rule{font:600 14.5px "Instrument Sans",sans-serif;color:#16181D;margin:14px 0 0;max-width:60ch}
.dg-note{font-size:12.5px;color:#8A8F9C;line-height:1.6;margin:8px 0 0;max-width:70ch}
.dg-detail{border-top:1px solid #EEF0F5;margin-top:12px;padding:12px 4px 2px;min-height:56px}
.dg-detail .t{font-weight:600;font-size:14px;margin:0 0 4px}
.dg-detail p{font-size:13.5px;color:#5D636E;line-height:1.6;margin:0 0 6px;max-width:70ch}
.dg-detail a{color:#5B5BD6;font-weight:500}

/* skill matrix */
.mx{background:#fff;border:1px solid #E7E9F0;border-radius:16px;overflow:hidden}
.mx .mxhead{display:grid;grid-template-columns:130px repeat(3,1fr);border-bottom:1px solid #E7E9F0;background:#F8F9FB}
.mx .mxhead div{padding:10px 14px;font:500 10.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A8F9C}
.mx .mxrow{display:grid;grid-template-columns:130px repeat(3,1fr);border-bottom:1px solid #EEF0F5}
.mx .mxrow:last-child{border-bottom:none}
.mx .mxdom{padding:13px 14px;font:500 11px "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#5D636E}
.mx .mxcell{padding:11px 12px;border-left:1px solid #EEF0F5}
.mxc{display:inline-block;font:400 11.5px "DM Mono",monospace;border-radius:999px;padding:3px 10px;margin:0 5px 6px 0;cursor:pointer;border:1px solid transparent}
.mxc.l1{background:#5B5BD6;color:#fff}
.mxc.l2{background:#EDEDFB;color:#4C4CC4}
.mxc.l3{background:#fff;color:#5D636E;border-color:#D9DCE5}
.mxc:hover,.mxc.on{outline:2px solid #16181D;outline-offset:1px}
.mxlegend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 2px 0;font:400 11.5px "DM Mono",monospace;color:#8A8F9C}
.mxlegend .mxc{cursor:default;margin:0 4px 0 0}
.story{background:#16181D;color:#E8EAF2;border-radius:14px;padding:20px 24px;margin-top:14px}
.story .sk-t{font:500 11px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8B8FF0;display:block;margin-bottom:8px}
.story h3{color:#fff;font-weight:600;font-size:17px;margin:0 0 12px;letter-spacing:-.02em}
.story .row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px;font-size:13.5px;line-height:1.6}
.story .row dt{font:500 10.5px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#7C818F;padding-top:3px}

.story .scode{background:#0B0D11;border:1px solid #23262E;border-radius:10px;padding:13px 16px;margin:6px 0 2px;

/* was → became */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #E7E9F0;border-radius:14px;overflow:hidden;margin:6px 0 16px}
.ba .col{padding:16px 20px}
.ba .col.was{background:#F8F9FB;border-right:1px solid #E7E9F0}
.ba .col.now{background:#F7F7FD}
.ba .k{font:500 10.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:10px}
.ba .was .k{color:#9A6A3A}.ba .now .k{color:#4C4CC4}
.ba ul{margin:0;padding-left:16px;font-size:13px;line-height:1.55;color:#5D636E}
.ba li{margin-bottom:7px}
.ba .was li::marker{color:#D8B48E}.ba .now li::marker{color:#B9BCF0}

.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.shots a{display:block;border:1px solid #E7E9F0;border-radius:12px;overflow:hidden;background:#fff}

.shots .cap small{display:block;font:400 10.5px "DM Mono",monospace;color:#8A8F9C;margin-top:1px}

/* live counters */
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.live .lc{background:#fff;border:1px solid #E7E9F0;border-radius:14px;padding:18px 20px}
.live .lc b{display:block;font-weight:600;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.live .lc b em{font-style:normal;color:#5B5BD6}

const ZOHO_GROUPS=[
 {h:'Cleaning up contacts, deduplication and enrichment', tag:'CONTACTS',
  intro:'Contacts had been created situationally for years, so duplicates were everywhere — worst where one person held roles at several sub-companies of the same group. The fix was a model rather than a clean-up script: contacts and accounts joined many-to-many, every existing record migrated onto it, and enrichment wired in so a provider credit is spent once. Every account went through the analysis; new contacts now arrive through the same identity rules.',
  items:[
   {id:'enrichment',t:'Contact enrichment',kind:'live',s:'Provider people matched against the CRM through four identity keys before a single one is written.'},
   {id:'contact-model',t:'One person, several companies — without duplicate identities',kind:'plan',s:'A many-to-many contact model, the migration onto it, and the identity rules every inbound path now obeys.'}],
  also:['sf-lwc'], alsoLabel:'The same contract on another platform'},
 {h:'Trade shows: booking, meetings, follow-up', tag:'EVENTS',
  intro:'One system takes an industry event from preparation, through the floor, to post-analysis. Meetings are booked and tracked from the CRM, run from a phone at the venue, and reached through the tools people already live in — with a calendar sync that keeps every side honest.',
  items:[
   {id:'event',t:'One event system, end to end',kind:'live',s:'Targeting, booking, conflict checks, mobile execution and reconciliation on one campaign record.'},
   {id:'board',t:'The event floor, designed for a phone',kind:'live',s:'A room-by-room schedule, team load and assisted recap flow for a surface with no developer tools.'},
   {id:'calendar-sync',t:'Delta sync across seventeen calendars',kind:'plan',s:'A checkpoint written on every page, because the language has no while loop and a run can die on page forty.'},
   {id:'mobile-canvas',t:'Building for a surface with no devtools',kind:'plan',s:'An on-screen console with a ring buffer, and the bugs it was the only way to catch.'}]},
 {h:'AI in the CRM: recaps, loss analysis, drafted text', tag:'AI',
  intro:'Recaps write themselves from what a meeting left behind, lost deals get a two-stage analysis against a corporate taxonomy, and inside the widgets a model drafts the text where a standard, careful wording matters more than a fast one. Each of them records what it did somewhere a person can argue with it. This is one of the six pieces of platform work, but the pages themselves are written up as one capability on the Applied AI tab rather than split across two indexes.',
  items:[],
  also:['chat-recap','loss-analysis','ai-interface-assistance','agent-journal'], alsoLabel:'Written up on the Applied AI tab'},
 {h:'Connecting Teams, Slack and Jira to the CRM', tag:'SYNC',
  intro:'CRM tasks and tracker issues talk to each other directly, and the topic chats in Teams and Slack feed the tracker: comments are collected, filed against the right issue, and never retyped by hand. The hard part is not the transport — it is deciding which system is right when two of them disagree.',
  items:[
   {id:'chat-tracker',t:'One thread across Teams, Zoho and Jira',kind:'emul',s:'CRM owns routing and delivery state; stable markers make every ten-minute run safe to replay.'},
   {id:'cross-system',t:'Who is allowed to be right?',kind:'note',s:'Field authority, reconciliation and refusal rules for systems that disagree.'},
   {id:'teams-jira',t:'Teams → CRM → Jira, and who owns what',kind:'plan',s:'An ownership matrix across four systems, a text contract as the mapping mechanism, and idempotency on both arms.'}]},
 {h:'Weekly reports, reminders and workflows', tag:'AUTOMATION',
  intro:'Hundreds of automations run the routine — workflows, blueprints, schedulers, external flows and server-side jobs. Sales leads get their weekly picture assembled for them; individual salespeople get the reminders that keep records moving, delivered where they already work rather than in an inbox nobody opens.',
  items:[
   {id:'cockpit',t:'Sales cockpit',kind:'live',s:'Open value, overdue deals, agreements waiting and tasks past due — for the team or for one person.'},
   {id:'reporting',t:'The week that reports itself',kind:'plan',s:'Weekly summaries for sales leads and per-person reminders, assembled on a schedule and delivered where people already work.'}]},
 {h:'Org tooling, CI/CD, deployment and the external server', tag:'PLATFORM',
  intro:'Tooling for the org itself: extraction the platform refuses to offer, a config history it never kept, an audit that names the limits of its own method — and, for the operations that do not fit inside the org at all, an external server that takes the heavy work and hands the result back.',
  items:[
   {id:'orghealth',t:'An org audit that names what it cannot see',kind:'live',s:'A generated 1,240-function org reconciled against five entry channels, with blind spots stated first.'},
   {id:'solution',t:'A business map the standard CRM could not draw',kind:'live',s:'Service lines against business units, with live pipeline and opportunity creation in the same matrix.'},
   {id:'org-tooling',t:'The engineering layer Zoho did not provide',kind:'note',s:'Pull the org into one searchable system, map dependencies and turn browser-only change into reviewed delivery.'},
   {id:'deluge-cicd',t:'From browser-only code to reviewed delivery',kind:'plan',s:'Pull, analyse, review, deploy, run and verify — one controlled toolchain around a browser-only editor.'},
   {id:'widget-system',t:'Seventy widgets as one product system',kind:'plan',s:'Shared components, services, versioning and mobile adaptation behind 70+ production interfaces.'},
   {id:'external-server',t:'The work that does not fit inside the org',kind:'plan',s:'Complex operations moved to an external server, and the line for deciding what goes out.'}]}
];
/* AI is a capability across three layers of the platform, not a collection of
   prompts: the engineering of the system itself, the business workflows run on
   evidence, and the assistance offered inside the interfaces people already use.
   A fourth section carries the access layer, because what a model is allowed to
   do is a separate decision from what it is asked to do. Same shape as
   ZOHO_GROUPS, so a page that belongs to two tabs is linked (`also`) rather than
   registered twice. */
const AI_GROUPS=[
 {h:'AI in engineering', tag:'ENGINEERING',
  intro:'Zoho keeps most of its code behind browser editors and disconnected configuration screens, so the extraction and analysis layer had to exist before a model could be useful against it. With the org in one searchable system, AI designs functions and interfaces, generates Deluge, JavaScript and Python, reviews existing code, expands tests, identifies regression risk and analyses dependencies. Generation was never the bottleneck; verification is, so Git review, controlled deployment and automated checks decide what ships.',
  items:[
   {id:'code-intelligence',t:'Code intelligence across the whole org',kind:'plan',s:'Full-org extraction, AI-assisted review, dependency analysis and risk discovery across the function estate.'},
   {id:'ai-workflow',t:'How AI-assisted delivery is verified',kind:'note',s:'Generated work passes source review, behavioural tests, leak guards and controlled promotion before production.'}],
  also:['org-tooling','deluge-cicd'], alsoLabel:'The tooling this runs on, on the Zoho tab'},
 {h:'AI as a business solution', tag:'WORKFLOWS',
  intro:'An AI feature in a CRM is an integration and control system before it is a model call. Evidence has to be gathered, identities resolved, permissions enforced, outputs validated and failures made recoverable; the model receives one bounded interpretation task inside that system. Meetings held in Teams use Teams transcripts, meetings held elsewhere use Krisp, and a source adapter keeps the process open to further providers without changing the recap standard or the write-back.',
  items:[
   {id:'chat-recap',t:'From transcript to a corporate-standard meeting recap',kind:'emul',s:'Teams, Krisp and future sources feed one governed evidence-to-recap pipeline.'},
   {id:'loss-analysis',t:'From six evidence sources to one governed loss reason',kind:'note',s:'A two-stage classification pipeline with a human-correctable intermediate record.'},
   {id:'team-intelligence',t:'Recurring team intelligence, delivered automatically',kind:'plan',s:'AI-generated reports and management summaries with deterministic scheduling and delivery controls.'}]},
 {h:'AI assistance inside CRM interfaces', tag:'INTERFACES',
  intro:'AI is embedded in more than ten interfaces where it lowers the cost of keeping CRM data useful — drafting, rewriting and standardising text without sending a salesperson to a separate tool. The strongest case is short reporting from a phone, where the interface reduces the input cost and the model turns a rough note into the structure the business expects. Assistance stays bounded: the interface fixes the target record and the allowed operation, validation decides what may be saved, human-written fields are not silently replaced, and the result can be reviewed or undone.',
  items:[
   {id:'ai-interface-assistance',t:'AI at the point of CRM input',kind:'plan',s:'Drafting and rewriting across 10+ interfaces, especially short reports from mobile devices.'},
   {id:'agent-journal',t:'Controlled write-back with an action journal',kind:'live',s:'Every proposed change carries a before/after diff and a human gate for high-risk fields.'}],
  also:['board'], alsoLabel:'The mobile recap this sits inside, on the Zoho tab'},
 {h:'Control and access', tag:'ACCESS',
  intro:'Claude works with CRM records and related operations through a scoped MCP surface connected to the surrounding Zoho tooling, and reusable skills combine record operations with function pull, analysis, deploy and run — turning one-off prompts into repeatable development, audit and operational workflows. MCP decides which operations exist; it does not make a model correct. Permissions, validation, risk gates, confirmation and the audit trail stay outside model judgement.',
  items:[
   {id:'mcp-product',t:'Scoped AI access to CRM',kind:'note',s:'Typed operations for records and platform tooling, with permissions and validation outside the model.'}]}
];

  +'<div class="bsec rv"><span class="idx">05 / HOW I RUN A PLATFORM</span><h2>What this looks like off the keyboard</h2>'
  +'<p class="sub">The part of platform ownership that is not code: discovery, governance, adoption and the discipline that keeps the other six sections true.</p>'
  +'<div class="runcards">'
  +'<div class="runcard"><h3>Business analysis &amp; functional design</h3><p class="rc-sub">Turning a stakeholder request into a data model, not just a screen.</p><ul><li>Stakeholder discovery before a single field gets built — what the request is actually trying to solve.</li><li>Translate &#8220;I want a button&#8221; into entities, relationships and validation rules.</li><li>Push back on requirements that would break the platform, with a working alternative attached — spec before code.</li></ul></div>'
  +'<div class="runcard"><h3>CRM administration &amp; access governance</h3><p class="rc-sub">Who sees what, and why, enforced by design rather than habit.</p><ul><li>Profiles, roles, sharing rules and layouts designed around how teams actually work.</li><li>Access follows the org chart and survives reorgs, because it hangs on roles rather than named users.</li><li>Changes to the access model go through a controlled review, not a live edit.</li></ul></div>'

function drawTabs(active){
 document.getElementById('tabs').innerHTML=TABS.map(t=>
  '<a href="#/'+(t.id==='about'?'':t.id)+'" class="'+(t.id===active?'on':'')+'">'
  +t.t+(t.nb?'<span class="nb">'+t.nb+'</span>':'')+'</a>').join('');
}
function route(){
 const h=location.hash.replace(/^#\/?/,'');
 const [kind,id]=h.split('/');
 let body,active;
 if(!kind){body=vAbout();active='about';}
 else if(kind==='p'&&ALL[id]){body=vItem(ALL[id]);active=ALL[id].tab;}
 else if(TABVIEW[kind]){body=TABVIEW[kind]();active=kind;}
 else{body=vAbout();active='about';}
 document.getElementById('view').innerHTML=body;
 drawTabs(active);
 window.scrollTo(0,0);
 if(active==='about'&&kind!=='p') wireAbout();
 const els=document.querySelectorAll('.rv');
 if(els.length&&'IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
   if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06});
  els.forEach(el=>io.observe(el));
 } else els.forEach(el=>el.classList.add('in'));
}

        'start-end:cal':{t:'Start / end time — Calendar', d:'The calendar owns time: it is where people accept and move things.'},
        'meeting-type:cal':{t:'Meeting type — never from the calendar', d:'The meeting type is never taken from the calendar side, even though the calendar has an event type of its own.'},
        'meeting-type:crm':{t:'Meeting type — CRM owns it', d:'A person typed it. Judgement belongs to the CRM.'},
        'room-note:crm':{t:'Room note — CRM owns it', d:'A person typed it. Judgement belongs to the CRM.'},
        'recap:crm':{t:'Recap — CRM owns it', d:'A person typed it. The recap is judgement, not a fact carried in from elsewhere.'},
        'delivery-state:tracker':{t:'Delivery state — tracker owns it', d:'The issue tracker is authoritative over its own delivery state.'},
        'chat':{t:'Chat owns nothing', d:'The whole Chat column is source or never — the chat is where a decision gets made in conversation, not where it is stored.'},
        'unnamed-a:cal':{t:'Not written, for length reasons — field unnamed', d:'The write-up: "two fields are never written at all because of length ceilings." It does not say which two. This row stands for one of them.'},
        'unnamed-b:cal':{t:'Not written, for length reasons — field unnamed', d:'The write-up: "two fields are never written at all because of length ceilings." It does not say which two. This row stands for the other one.'},
        'unnamed-c:cal':{t:'Truncated — field unnamed', d:'The write-up: "one is truncated." It does not say which field, or to what length.'}
       }
      },
      {kind:'funnel', at:6,
       aria:'Funnel from a conference export through four ordered rules to seven outcome buckets, two of them worked by a person',
       input:{n:'Conference export', count:'several hundred rows'},
       rules:[
        {id:'profile', n:'Profile lookup by slug, path anchor', order:1},
        {id:'account', n:'Account check', order:2},
        {id:'email', n:'Email', order:3},
        {id:'name', n:'Name, tie-break: account then email', order:4}
       ],
       buckets:[
        {id:'matched-profile', n:'Matched by profile', who:'auto'},
        {id:'matched-disagree', n:'Matched, account disagrees', who:'auto'},
        {id:'matched-email-name', n:'Matched by email or name', who:'auto'},
        {id:'needs-enrichment', n:'Needs enrichment', who:'auto'},
        {id:'created-enrichment', n:'Created from enrichment', who:'auto'},
        {id:'ambiguous', n:'Ambiguous', who:'human'},
        {id:'unresolved', n:'Unresolved', who:'human'}
       ],
       gates:[{after:'name', n:'no candidate resolves → ambiguous with the candidates attached, never the first one'}],
       detail:{
        profile:{t:'Profile lookup by slug, with a path anchor', d:'Done on the slug with a path anchor rather than the whole URL, so an extended slug and a trailing slash both still hit, while the anchor stops a slug matching in the middle of somebody else’s address.'},
        account:{t:'Account check', d:'First tie-breaker when several candidates come back.'},
        email:{t:'Email', d:'Second tie-breaker, run only after account.'},
        name:{t:'Name, fixed tie-break order', d:'Tie-breakers run in a fixed order — account first, then email — and if none resolves it, the row goes to ambiguous with the candidates attached rather than taking the first.'},
        'matched-profile':{t:'Matched by profile', d:'The strongest signal: a direct profile-URL hit.'},
        'matched-disagree':{t:'Matched, account disagrees', d:'A profile match exists, but the account on the row does not agree with it — reported rather than silently trusted.'},
        'matched-email-name':{t:'Matched by email or name', d:'Resolved through the tie-break chain: account first, then email.'},
        'needs-enrichment':{t:'Needs enrichment', d:'No match yet; queued for the enrichment provider.'},
        'created-enrichment':{t:'Created from enrichment', d:'A new contact created from what enrichment returned.'},
        ambiguous:{t:'Ambiguous — worked by a person', d:'The tool deliberately does not push for full automation. No candidate resolves → ambiguous with the candidates attached, never the first one.'},
        unresolved:{t:'Unresolved — worked by a person', d:'Nothing matched at all; left for a human rather than guessed.'}
       }
      }
     ],
     body:[
      ['The common shape','Every one of these crosses a boundary the CRM does not own. On the other side sits a calendar that cannot be asked about every meeting, a chat card that cannot fetch a row, an events feed that never re-sends, a tracker whose files cannot be closed to a role, and a conference export whose company column is regularly wrong. None of that can be fixed from this side, so the work is deciding — in writing, before the code — what the CRM is allowed to believe, what it is allowed to overwrite, and where it should stop and hand the row to a person. Eight of those decisions follow, ordered by the question each one answers.'],
      ['Which system is allowed to be right','A meeting exists in a calendar, in the CRM, in a chat thread and in an issue. Each has a legitimate claim on part of it. Left alone, every sync overwrites the previous one and the humans stop trusting the record. Written down as a table, this settles most arguments before they start. Enforcement lives in the payload builder, where create and update are separated: two fields are never written at all because of length ceilings, and one is truncated. The source gives the mechanism, not the field names, so the three placeholder rows in the matrix below are left unnamed rather than guessed.'],
      ['One field, two systems, and a rule about who wins','A meeting is held, or declined, or still booked. Deciding it from the calendar means asking the calendar about every meeting, every hour — impossible at any real volume. Deciding it from the CRM alone means never learning about cancellations, because a cancellation happens in the calendar and the CRM row simply becomes a past meeting that looks attended. So: two processes, each authoritative over exactly one thing. The hourly one works only from CRM data, computing an end time from the start plus the duration with two fallbacks, and moves a row from booked to held; it never touches a declined row, because that is a final state. The second and much more expensive one is authoritative over one question only — was this cancelled — and asks the calendar about rows already marked held, where a cancelled flag and a missing event both mean declined. It walks one month per run, capped at a few hundred rows, so a full year takes twelve passes and a cancelled meeting can sit mislabelled for a while: the deliberate price of not calling the calendar hourly for everything. The month is a constant in the code rather than a parameter — crude, but the run is then perfectly reproducible. The write result comes back in three different shapes depending on the path taken, so success is checked three ways in sequence; and a row locked by a state machine refuses the write with a marker buried inside the response body rather than a status code, so those are counted as skipped, not as failures, because they are neither.'],
      ['Keeping what a human typed through an automatic resync','Every time a meeting updates from the calendar, its participant list is rebuilt: internal people matched against the staff directory, external ones against the account’s contacts. But the calendar knows nothing about buyer roles — economic, technical, user, coach — and those are exactly what somebody sat down and worked out. So existing participants are read first and indexed by a composite key of address and role; for each external address the rebuild checks all four roles for an existing key before assigning anything, and restores the role it finds. Only a genuinely new person gets a default. Historic rows carry the old spelling of those roles, from before the picklist was renamed, so a second pass maps the old values onto the new ones rather than quietly dropping the classification on every record created before the rename. What stays risky is the write path: the roles live in a subform, and a subform is replaced wholesale rather than patched row by row, so anything not in the array being sent stops existing. The role-restoring logic makes the content correct and does nothing about that. Saying so is more useful than implying the problem is solved.'],
      ['Matching transcripts by score, not by key','A transcript arrives with its own identifier, its own clock and its own attendee list. Time is the only shared signal, and it is weak: a sixty-minute meeting may have run twenty-two, so “same time” becomes an overlap problem between intervals of different length. The answer is a score rather than a boolean. Overlap is measured as two coverage ratios and the larger is taken, so a meeting nested inside another still scores full, with a penalty proportional to the duration gap subtracted. Modifiers follow: a service hint, e-mail addresses lifted out of the transcript body and intersected with the attendee list, a penalty when a transcript already exists. The strongest modifier is the recording owner — a bonus when they are present, a penalty when the attendee list is populated and they are not. Above the score sits a gate: if the owner is known and the best candidate does not contain them, a second pass runs, and if nothing qualifies the automatic link is refused outright. Two thresholds instead of one: the link is written above forty, the transcript text is only copied into the meeting above sixty. “I think this is the meeting” and “I am willing to write data into it” are deliberately different decisions, and every candidate is kept with its score for a human to review.'],
      ['Sorting a conference export into buckets instead of matching it','Several hundred rows, no shared key with anything, and half the company names in the file are wrong. There is no single identifier: profile URLs are written differently on each side, email is missing for many people, the company column is regularly wrong, and enrichment names are sometimes mangled. So not a match — a classification, worked independently per bucket, as the funnel below sets out. Three write rules are what make the tool safe to run twice: a name is corrected only when the surname differs, because otherwise every Alex becomes an Alexander; title and email are filled only into an empty field and never over a live value; and everything else that merely differs is reported for a human to look at.'],
      ['A receiver that repairs its own payload','Events are not re-sent. A rejected write is a lost event, and the reason is unknown in advance: a date format, a length, a missing mandatory field, or a duplicate rule. So a five-attempt loop reads the field name out of the CRM error and rewrites the payload between attempts — a missing mandatory field gets a marked placeholder, any other named field is dropped and the attempt repeats, and a duplicate error carrying a record id switches the operation from create to update. When the culprit cannot be identified the loop stops on purpose instead of spinning. Everything dropped or substituted comes back in the response, so the record is saved degraded but visible. Idempotency is separate: a rolling journal of processed event ids on the record itself, which means a very old event could in theory be processed twice — the alternative was a record and an API call per event. A placeholder in a mandatory field puts marked rubbish in the data, which still beats a missing record.'],
      ['A two-card wizard in a chat, with nothing held open','A person takes minutes to fill in a form; a synchronous call has seconds. The trigger has to answer quickly, and a card is not an application: it has no state, cannot fetch more rows, and ends when it is submitted. Holding the request open while somebody thinks is not slow — it is impossible. So every human step is a callback subscription rather than a wait: the card posts, the flow suspends, the answer arrives as a new event. Around the card sits a loop — the card reports which button was pressed, and if it was a search rather than a submit, the loop reissues the card with fresh results, which is how a search across hundreds of accounts happens inside something that cannot fetch. The loop is bounded, a fixed number of iterations and half an hour, so a card somebody forgot about cannot hold a run open indefinitely. One detail is worth keeping: a dropdown returns exactly one value, so when the opportunity already linked to the meeting belongs to a different account it travels as a marked value — a prefix the saving function recognises and strips — and both ends know the choice was deliberate, through a control that cannot carry a flag. The first design edited the previous card in place, which meant tracking message identifiers and lost a race whenever two events arrived close together; replacing the card instead costs a little clutter in the chat and removes the entire class of problem.'],
      ['Attachments as links, after proving the proxy was the problem','Three constraints at once. The tracker is only reachable through a corporate proxy; the proxy answers the upload endpoint with 200 and an empty body, and no attachment appears; and the tracker itself cannot limit a file by visibility — a comment can be closed to a role, a file is visible to everyone who can see the issue, and the files that needed closing were the ones with rates in them. Localisation came by experiment rather than guesswork: downloading from storage works; building a multipart body works and 160 KB takes 0.88 seconds, so the bytes really do leave; JSON endpoints through the same proxy answer with content, including validation errors. Conclusion: the multipart body is what is lost. The fix is not a file but a remote link — a JSON call carrying a stable global id. JSON passes the proxy, the global id makes a ten-minute sync idempotent, and the link inherits the permissions of the storage it points at, which solves the third problem too. The file is not physically in the tracker, so someone without access to the folder hits a login — accepted deliberately, because the alternative hands rates to everyone who can open the issue.'],
      ['What the eight have in common','Three habits, and they are the actual content of this page. Write the ownership rule down before the code, because a rule that lives only in someone’s head gets re-decided on every sync. Separate “I think this is right” from “I am willing to write it” — the two thresholds in the transcript matcher, the create-versus-update split in the payload builder, the fill-only-into-an-empty-field rule in the import. And leave the ambiguous rows to a person on purpose: the funnel above ends in two human buckets, the transcript matcher refuses a link rather than guessing, and the receiver itemises what it dropped instead of hiding it. Each of those costs throughput, and each was the right trade at this volume. Where it is not — the wholesale subform write, the month-long lag on a cancellation, the rolling idempotency journal — is named in the sections above rather than smoothed over.']]}],
  'Platform and tooling':[
    {id:'org-tooling', t:'Building tooling for an org that will not export itself',
     sub:'Five problems, one method: when the platform refuses to answer a question, build the instrument that answers it anyway — and say plainly what it still cannot see.',
     dg:{kind:'authority', at:5,
      aria:'Ownership matrix: seven operations against a simple invoke key and a full OAuth flow, with the rule the line follows the secret, not the convenience',
      cols:[{id:'simple',n:'Simple key (function invoke)'},{id:'oauth',n:'Full OAuth flow'}],
      rows:[
       {id:'call-fn', n:'Call a server-side function'},
       {id:'read', n:'Read records'},
       {id:'create', n:'Create'},
       {id:'update', n:'Update'},
       {id:'delete', n:'Delete'},
       {id:'query', n:'Run a query'},
       {id:'third-party', n:'Use a third-party credential'}
      ],
      cells:{
       'call-fn:simple':'owner', 'call-fn:oauth':'never',
       'read:simple':'never', 'read:oauth':'owner',
       'create:simple':'never', 'create:oauth':'owner',
       'update:simple':'never', 'update:oauth':'owner',
       'delete:simple':'never', 'delete:oauth':'owner',
       'query:simple':'never', 'query:oauth':'owner',
       'third-party:simple':'owner', 'third-party:oauth':'never'
      },
      rule:'The line follows the secret, not the convenience.',
      detail:{
       'call-fn:simple':{t:'Call a server-side function — simple key', d:'The simple key that lets an outside script invoke a server-side function.'},
       'third-party:simple':{t:'Third-party credential — stays behind the simple key', d:'Anything needing a third-party credential stays inside a server-side function and is invoked with the simple key, so the credential never leaves the platform.'},
       'read:oauth':{t:'Read — full OAuth flow', d:'Create, update, delete, query — everything that touches records goes directly over the full flow from the tool, with the token cached and refreshed a minute before it expires.'},
       'create:oauth':{t:'Create — full OAuth flow', d:'Batched at ninety per write, following the platform’s own limits.'},
       'delete:oauth':{t:'Delete — full OAuth flow', d:'Batched at a hundred per delete.'},
       'query:oauth':{t:'Query — full OAuth flow', d:'No more than a hundred values in a single set membership test.'}
      }
     },
     body:[
      ['Extracting the code the platform will not export','No API returns the list of functions — not one; the documented parameter rejects every value, and the CLI exports metadata and widgets, never automation. The fix: a negative result recorded first — fifty-five parameter values and roughly a hundred and fifty endpoint/version/header combinations tried across production, sandbox and the interface domain — then four routes in order: ids harvested from a captured session, a console script under session cookies, a function deployed inside the org that calls the closed endpoint from the inside where authorisation differs, and finally the interface’s own internal call. Fifteen hundred functions in ten to fifteen minutes. The route depends on a browser session that expires in about half an hour and on an internal object the vendor may rename, so it is written up as a reproducible procedure with its failure points named, not a one-off trick.'],
      ['A config snapshot in git, standing in for the change history the platform lacks','Half the configuration — schedules, client scripts, buttons, webhooks, connections, approvals, pipelines — sits behind the interface domain with no documented API, each setting on its own unpredictable API version. A twenty-five minute refresh covers modules, layouts, rules, buttons, views, blueprints, schedules, webhooks, connections, roles and profiles; versions were found empirically and pinned, and response diagnostics are written to their own file so it is visible which endpoints answered at all. The snapshot lives in git, and the diff between commits does the job the missing change history would have done — with an explicit list of what still needs a manual export, declared up front rather than discovered later.'],
      ['Classifying fifteen hundred functions across five entry points','A function can be reached from a rule, a schedule, a button, a widget, or another function — five channels, none of them linked. One index across all five means every function judged dead carries an explicit trail: not in the rule map, not in schedules, not on a button, not in the widget grep, not called by another function, plus a cycle check among the orphans. Alongside it: buttons deleted without their functions, rules sharing identical criteria, and rules marked active that had never once run because their criteria referenced a renamed field. One class of function was unreachable by the same method — a different identifier namespace, with a one-in-twenty-two name-match rate — so the report opens with a completeness section stating plainly that anything called only from there is misclassified, naming three ways to close the gap. An audit that names the limit of its own method is worth more than one that reads clean.'],
      ['Counting every way the org reaches outside','A connection is referenced by a literal string inside a function body — no index, no usage view, nothing that notices when a connection stops authenticating while code keeps calling it. A sweep across every function and widget script normalises each call into a URL pattern, attaches it to its connection and, where one exists, the rule that triggers it, producing a table with a row per service: call volume, distinct files, methods, connections, and the share of calls wrapped in error handling. The findings changed behaviour: a large share of connections turned out never to be used at all; a handful had stopped authenticating and were still being called from hundreds of places, meaning those calls had been failing silently; error-handling coverage across the busiest services was close to zero; and a single shared credential appeared inline in hundreds of files, making rotation a refactor rather than a setting. Shown here running against an invented org of the same shape — the real output is a portrait of somebody else’s security posture.'],
      ['Two credentials, and a line drawn between them','The simple key that lets an outside script invoke a server-side function does not work for reading or writing records, or running a query — those need a full authorisation flow, and wrapping every record operation in its own function to dodge that means a new function forever. A single request path handles both, with retries: an authorisation failure clears the cached token and retries, a rate limit respects the interval the server asks for and falls back to bounded backoff, and batch sizes follow the platform’s own limits — a hundred for deletes, ninety for writes, pages of two hundred for reads, no more than a hundred values in a set membership test. Bulk loads pass an empty trigger list, suppressing every rule and state machine for the run — without it, two hundred records fire the whole automation estate and the run becomes unpredictable; legitimate automation has to be caught up separately afterwards, a decision made consciously rather than discovered.']]}],
  'AI in the CRM':[
    {id:'loss-analysis', t:'Loss analysis in two stages, with the taxonomy in the prompt',
     sub:'A free-text answer is useless for reporting. It has to land in the company’s own categories.',
     role:'Prototyped the direction and contributed to the design; another engineer implemented and owned it.',
     body:[
      ['The constraint','The evidence is spread across the CRM, the issue tracker and analytics; the function time limit does not allow gathering it and reasoning about it in one call; and an unconstrained answer cannot be compared between deals.'],
      ['What was built','Roughly ten times more code gathering evidence than calling the model. Six sources, plus derived behavioural signals that exist nowhere as fields — how many times the start date moved, which stage the deal stalled in, whether this client had ever been won before. Tracker comments are filtered by author so the model reads the outside voice, not the CRM’s own echo. Then two stages: the first is explicitly forbidden to analyse and must list the holes in the data; its output is materialised as a record; the second reads that and does one thing — place the case in a seven-kilobyte taxonomy of thirty-eight causes with rules for choosing between them. A human can correct the middle and re-run only the second stage.'],
      ['The trade, said out loud','No structured output anywhere: the answer is parsed by markdown anchors and substring checks. Stop reasons are not inspected, so a truncated answer is indistinguishable from a complete one. And the category is never written to a structured field — the assignment is commented out — so the very reporting the pipeline exists for cannot be built. A schema, validation against the taxonomy, and a picklist field are the obvious repairs.']]},
    {id:'agent-journal', t:'An agent allowed to write, and a journal that keeps it honest',
     sub:'Designed and built for this portfolio; not run against a production org. Said plainly, because it would come out anyway.',
     body:[
      ['Three problems, one screen','Recognition mangles mixed-language vocabulary and company names; a write-capable agent can be wrong with no control loop, because the platform’s own audit trail only exports through the interface; and a chat command names no record. The screen below is the answer to all three at once, not a description of one — try it.'],
      ['Why a journal and not a log file','Every action writes to a module, not a file: time, channel, utterance, parsed intent, target record, a before-and-after diff, the result. A module is a screen with filters. Above a risk threshold — a fixed list of fields, not a judgement the model makes — the diff is shown and the agent waits for a person.'],
      ['The trade','The journal duplicates what the record already holds; taken knowingly, because the alternative is an agent nobody can audit. What stays true even now it is live: nothing here runs against a real org, and the parsing is pre-recorded rather than a live model call, exactly like the rest of this site.']]},
    {id:'ai-workflow', t:'AI-assisted engineering, honestly',
     sub:'How this site and its tests are built and kept green — the gates, and what they cannot catch.',
     body:[
      ['The constraint','Generation is not the bottleneck. A model writes a screen, a data module or a write-up in seconds; verifying that any of it is correct — that it matches the source it claims to replicate, that it did not silently break another surface, that no employer data leaked into a public repository — takes the rest of the time. The constraint on shipping fast with AI assistance is checking, not typing.'],
      ['What was built','Gates, not trust. Two hundred and six headless checks fail the build on any console error, not just a failed assertion — a widget that throws quietly is a widget that fails silently in front of a recruiter. CI runs a guard that scans for anything resembling a real org id, domain or key and refuses the build if it finds one, because a portfolio is exactly the surface a leaked credential would sit on unnoticed. The dataset generator is seeded, so the same run always produces the same data and a diff is reviewable instead of noise. And one rule holds across every pass: one surface at a time, and a written specification of the discrepancies goes up for agreement before anything is touched — this file is the current example.'],
      ['The trade','Gates catch form, not meaning. A console-clean, leak-free build that faithfully reproduces the wrong behaviour still passes every check here. Fidelity to the original — the actual point of a replica site — is held by a text map and by discipline in following it, not by a machine. Saying "I use AI to build" describes nothing on its own; the gates are what would have to be described, and most people who say it are not asked to.']]},
    {id:'mcp-product', t:'Three kinds of AI work, and the CRM only had two',
     sub:'Evidence-gathering versus inference, and MCP as the emulator’s own idea, pointed at a real org.',
     body:[
      ['The constraint','This portfolio already shows two kinds of AI work: a pipeline that gathers evidence and calls a model once, twice, at the end (loss analysis); and an agent that writes, gated by validation and a human (the journal above). Neither is what most people mean when they say "AI in the CRM" today — they mean a model working the org directly, the way an assistant with MCP access does. Building that third kind honestly means being precise about where a model earns its place and where it does not, because a CRM pipeline is mostly evidence-gathering, and a model dropped into the wrong part of it produces a plausible, ungrounded answer instead of a correct one.'],
      ['What was built','A three-way split, stated as a rule rather than a feeling. Deterministic operations — a stage change, a lookup, a picklist validation, a query against two hundred records — stay deterministic; nothing about them benefits from a model guessing. Classification and rewriting are where a model belongs: turning a rambling transcript into a recap, placing a loss reason in a taxonomy, correcting a mis-heard company name. MCP is the connecting piece — a typed, scoped surface for exactly the calls a model is allowed to make against org data, with the record shapes and the refusals defined outside the model, not inside its judgement. That is the same idea as the emulator this whole site runs on, aimed the other direction: instead of standing in for the platform so code can run outside it, MCP stands in front of the platform so a model can act on it safely.'],
      ['The trade','MCP is access control, not correctness control — a well-typed tool call can still carry a bad instruction, so the validation and the risk gate shown in the journal above are still the part doing the actual work. Naming the three kinds plainly is the whole contribution here: a portfolio that only ever says "AI" without saying which of the three it means is not saying anything a hiring manager can evaluate.']]}],
  'Full-stack':[
    {id:'harness', t:'The test harness this site grew from',
     sub:'A widget only runs inside the CRM, and deploying to production to see if a change works is not verification.',
     body:[
      ['The constraint','Every widget on this site is an iframe the platform loads, initialised through an SDK it controls. There is no offline mode, no local server that behaves like the platform, and no sanctioned way to run a widget without a live org in front of it — so the only feedback loop on offer was pushing to production and watching.'],
      ['What was built','An offline test harness: stubbed SDK primitives plus a headless browser, so every widget on this site runs the same code it would run inside the CRM, against a generated dataset, with nothing live behind it. Checks spread across many files cover routing, the record pages, both booking wizards and the chat flow. The suite fails on any console error, not only a failed assertion — a widget that quietly logs and carries on is still a bug. `test/browser.mjs` locates Playwright wherever it happens to live, a local devDependency or a global CI install, so the same test files run unmodified in both places.'],
      ['The trade','The stand reproduces the surface of the SDK, not the platform underneath it. Anything a widget does through an undocumented call, a quirk of the real iframe host, or a platform-side limit this stand does not model will pass here and still need a first run against a real org — this catches regressions in what is already understood, not everything the platform can do.']]},
    {id:'generator', t:'A seeded dataset with deliberate defects',
     sub:'Random data makes every diff noisy; clean data makes the demo dishonest, because a real CRM is never this tidy.',
     body:[
      ['The constraint','A dataset regenerated differently on every run turns every code review into a diff against noise — nobody can tell whether a changed number is a bug or a new random seed. But a dataset scrubbed clean of the mess real CRMs accumulate would misrepresent the actual job: contacts with no email, meetings that drift out of sync with the calendar, and duplicate-looking records are not edge cases, they are Tuesday.'],
      ['What was built','A seeded generator: the same seed produces the same dataset every time, so a pull request changes exactly what it says it changes and nothing else. On top of that, defects are injected on purpose rather than accidental — contacts missing an email address, meetings whose stored time has drifted from what the calendar would say — because the widgets that handle those cases need something to handle. A trimmed copy, `dataset.slim.json`, ships with the build, alongside a referential-integrity check that fails outright if the trimming leaves a dangling reference behind.'],
      ['The trade','The trimmed dataset still runs to 1.13 MB inlined directly into the page. That is the cost of having no backend: every record the demos touch has to already be sitting in the browser before the first click.']]},
    {id:'ci-guards', t:'CI guards against leaks',
     sub:'A portfolio that leaks a real employer’s data is worse than no portfolio at all.',
     body:[
      ['The constraint','Every surface on this site is a rebuild of something that first existed inside a real org, which means every source file is a place a real identifier, host or naming convention could slip back in — a copy-pasted comment, a variable name carried over out of habit, a fixture value nobody thought to change.'],
      ['What was built','Three guards run in `deploy.yml` before anything ships: a referential-integrity check over the generated dataset, an identifier scan across the source files for anything shaped like a real org id, host, corporate domain or credential, and the full behavioural test run. Any one of the three failing blocks the deploy.'],
      ['The trade','The identifier scan matches shape, not meaning — a pattern search, not a reviewer who understands what it is looking at. What counts as safe to say about the work versus what must never cross over is a written map and a discipline followed by hand, not something a regular expression can enforce on its own.']]}],
  'Salesforce':[
    {id:'sf-sync', t:'Apex vs Deluge: the same sync, twice',
     sub:'The delta-sync pattern from the Zoho side, rebuilt on Salesforce primitives. Not the code — the decisions.',
     body:[
      ['The constraint','Same shape as the Deluge original running behind the event campaign page\'s calendar sync: seventeen mailboxes, a delta query per mailbox, a hard ceiling on how long any one unit of work may run, and three error classes that each need a different reaction — throttling should slow a mailbox rather than fail it, an invalid or expired token should fall back to a full read in the same run, and anything else should mark the mailbox skipped without taking the rest of the batch down.'],
      ['What was built','DeltaSyncJob, a Queueable that chains itself once per page — Apex has no while loop across transactions either, so the mechanism is the same idea as the Deluge page-number walk, just built on a primitive that can enqueue its own continuation. A Custom Object, Sync_Checkpoint__c, is written after every page — not just at the end — so a chain that dies on page forty resumes on page forty-one. Three error branches mirror the Deluge ones exactly: a 429 leaves the checkpoint untouched and re-chains with a delay; an invalid token clears itself and re-fetches as a full read inside the same execute(); anything else marks the checkpoint failed and returns without throwing, so one bad mailbox cannot take a batch job down. Config — page size, the per-transaction page ceiling, which Named Credential to call through — lives in a Custom Metadata Type, deployable and inspectable the same way the classes are. Every page also publishes a Platform Event, so a monitor component can show a run live without polling.'],
      ['The trade','Custom Object over Platform Cache for the checkpoint, deliberately: Platform Cache is faster but evaporates on a cache eviction or an org restart, and a checkpoint that quietly disappears mid-sync is worse than one that is a little slower to read. HttpCalloutMock replaces every external call in tests — this repository never contacts a real mail provider, in tests or otherwise. The comparison table below is the actual content of this page; read it end to end rather than the prose above, which only sets up why it exists.']]}
  ]
};

function wireRecord(r){

  if (r.host === '__BOARD__') { if (window.MobileBoard) MobileBoard.mount(host, r.arg(window.__DATA__)); return; }

  /* A record page may be hosted by any of the widget bundles, not only
     CRMPages: two screens that were reachable solely as tabs inside other
     records now have pages of their own. */

         || (window.CRMWidgets3 && window.CRMWidgets3[r.host])

  if (P) P.mount(host, r.arg(window.__DATA__));

function viewOrgHealth(){
  return '<div class="pagehead"><h1>Org health report</h1>'
   + '<p class="sub">A CRM of any age accumulates automation nobody can account for. The platform keeps no reverse '
   + 'references, so “is this function still used?” has no direct answer — this is the answer, assembled by checking '
   + 'five entry channels for every one of them.</p>'
   + '<div class="metarow"><span class="chip live">Live demo</span><span class="chip plain">Generated org, 1,240 functions</span>'
   + '<span class="chip plain">No employer configuration</span></div></div>'
   + '<section class="block"><h2>The report</h2><div id="oh-host"></div></section>'
   + '<section class="block"><h2>Why it is generated, and not real</h2>'
   + '<p>The instrument is the point, not the org it was run against. A real report is a portrait of somebody else’s '
   + 'security posture — how many credentials sit inline, how many integrations have no error handling — and that is '
   + 'not mine to publish, cleaned or otherwise. So the tooling is pointed at an invented org of a realistic size and '
   + 'shape instead. What it proves is the same: that the five channels can be reconciled at all, that the dead code '
   + 'can be named with a reason rather than a guess, and that the method knows where it is blind.</p></section>'
   + '<section class="block"><h2>What each panel is actually claiming</h2><ul>'
   + '<li><b>Reachability</b> — a function is called dead only when a workflow rule, a schedule, a button, a widget '
   + 'and every other function all come back empty. Click a slice to see the list, with the entry points each one does have.</li>'
   + '<li><b>Guarded calls</b> — the share of outbound calls wrapped in error handling. On an estate this size the '
   + 'number is usually single digits, and it is the reason a transient failure takes a whole rule down with it.</li>'
   + '<li><b>Broken connections</b> — the platform records that a connection stopped authenticating and keeps letting '
   + 'code call it. Nothing links the two facts together until something like this does.</li>'
   + '<li><b>Rules that never fired</b> — active, wired, and executed exactly never, usually because a criterion still '
   + 'names a field that was renamed.</li>'
   + '<li><b>The warning at the bottom</b> — the class of function this method cannot see. It is stated first, not last.</li>'
   + '</ul></section>';
}

function wireSFLWC(){
  const host = document.getElementById('sflwc-host');
  if (!host || !window.__DATA__ || !window.SFLWC) return;
  const employment = (window.__DATA__.Employment || []).slice();
  // Same contact-selection rule as the Zoho history page (REC 'contact' entry): pick
  // whoever has the most employment rows, so the screen never opens on a single row.
  const by = {}; employment.forEach(e => by[e.Contact] = (by[e.Contact]||0) + 1);
  const best = Object.entries(by).sort((a,b) => b[1]-a[1])[0];
  const contactId = best ? best[0] : ((window.__DATA__.Contacts||[])[0] || {}).id;
  // The generator's own ceiling on employment rows per contact is 4 (data/generate.mjs,
  // not touched by this work). This demo's Definition of Done calls for 5+ visible rows
  // on the Salesforce tab, so one extra, clearly synthetic row is appended for the
  // Salesforce-emulator copy of the data only — window.__DATA__.Employment itself (and
  // therefore the Zoho tab, which reads it separately) is never mutated.
  const extraId = 'sf-demo-extra-' + contactId;
  if (!employment.some(e => e.id === extraId)) {
    employment.push({ id: extraId, Contact: contactId, Account_Name: null,
      Company: 'Northbeam Engineering (Salesforce-tab demo row)', Title: 'Earlier role',
      Seniority: 'Middle', Email: null, Start_Date: '2010-01-01', End_Date: '2013-01-01',
      Is_Main: false, Status: 'Past', Buyer_Role: null,
      Comment: 'Added only so the Salesforce tab has five rows to show — the generated dataset caps employment history at four per contact.' });
  }
  if (window.mockSF) window.mockSF.load(employment);
  window.SFLWC.mount(host, contactId);
}

  ['Observability', 'The sync stage is written onto the record itself, so “why is this empty” is answered by the data', 'A Platform Event published after every page, read live by a subscribing LWC monitor via empApi — push instead of pull, otherwise the same instinct'],
  ['Testability', 'A hand-built offline stand-in (this whole site’s platform emulator) — nothing in Zoho’s own tooling mocks a connection call', 'HttpCalloutMock, built into the platform — a real testing seam the Deluge side has to construct from scratch'],
  ['Suppressing automation on a bulk load', 'An empty trigger list passed with the bulk API call turns off every rule and workflow for the run', 'No direct equivalent — Salesforce triggers are not switched off by a request flag; the closest available tool is a static/bypass flag pattern written into the trigger handlers themselves, and it has to be built and maintained by hand']
];
function viewSFSync(){
  const table='<div class="scroll"><table><thead><tr><th>Problem</th><th>Deluge (Zoho)</th><th>Apex (Salesforce)</th></tr></thead><tbody>'
    + SF_SYNC_ROWS.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')
    + '</tbody></table></div>';
  return '<div class="pagehead"><h1>Apex vs Deluge: the same sync, twice</h1>'
   + '<p class="sub">The delta-sync pattern from the Zoho side (seventeen mailboxes, a checkpoint per page, a hard '
   + 'time ceiling), rebuilt on Salesforce primitives. Not the '
   + 'code — the decisions. Where the two platforms genuinely diverge is the last row, and it is the one worth '
   + 'reading slowly.</p>'
   + '<div class="metarow"><span class="chip note">Write-up</span><span class="chip plain">Apex, not deployed to a live org</span></div></div>'
   + '<section class="block"><h2>The comparison</h2>'+table+'</section>'
   + '<section class="block"><h2>Same steps, different mechanism</h2><div id="sfsync-diagram"></div></section>'
   + '<section class="block"><h2>Why this page exists</h2>'
   + '<p>Anyone can restate what a platform’s documentation says. The useful version of this comparison is knowing '
   + 'which rows have a real answer on both sides and which one does not — suppressing automation during a bulk '
   + 'load is trivial in Zoho and has no built-in equivalent in Apex. Naming that gap plainly is worth more than a '
   + 'table that reads clean.</p></section>';
}
function sfSyncFallbackSVG(){
  const steps=['Read checkpoint','Fetch delta page','Handle 429 / invalid token','Write checkpoint','Chain / re-schedule'];
  const w=760,colW=140,gap=10,x0=8,yTop=14,yBot=104,h=64;
  const col=(i)=>x0+i*(colW+gap);
  const box=(i,y,label,sub)=>'<rect x="'+col(i)+'" y="'+y+'" width="'+colW+'" height="'+h+'" rx="8" '
    +'fill="#F8F9FB" stroke="#D9DCE5"/>'
    +'<text x="'+(col(i)+colW/2)+'" y="'+(y+26)+'" text-anchor="middle" font-family="DM Mono, monospace" '
    +'font-size="9.5" fill="#16181D">'+esc(label)+'</text>'
    +'<text x="'+(col(i)+colW/2)+'" y="'+(y+42)+'" text-anchor="middle" font-family="DM Mono, monospace" '
    +'font-size="9.5" fill="#8A8F9C">'+esc(sub)+'</text>';
  const arrow=(i)=>'<line x1="'+(col(i)+colW)+'" y1="'+(yTop+h/2)+'" x2="'+(col(i+1))+'" y2="'+(yTop+h/2)+'" '
    +'stroke="#B0B5C2" stroke-width="1.5" marker-end="url(#sfsync-arrow)"/>'
    +'<line x1="'+(col(i)+colW)+'" y1="'+(yBot+h/2)+'" x2="'+(col(i+1))+'" y2="'+(yBot+h/2)+'" '
    +'stroke="#B0B5C2" stroke-width="1.5" marker-end="url(#sfsync-arrow)"/>';
  let body='<defs><marker id="sfsync-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">'
    +'<path d="M0,0 L6,3 L0,6 Z" fill="#B0B5C2"/></marker></defs>';
  body+='<text x="'+x0+'" y="'+(yTop-2)+'" font-family="DM Mono, monospace" font-size="9.5" fill="#5B5BD6">DELUGE (ZOHO)</text>';
  body+='<text x="'+x0+'" y="'+(yBot-2)+'" font-family="DM Mono, monospace" font-size="9.5" fill="#5B5BD6">APEX (SALESFORCE)</text>';
  const subsTop=['scheduled fn reads var','delta query, page N','clear var, full read','write var','next scheduled tick'];
  const subsBot=['checkpoint SOQL','callout via Named Cred','clear token, refetch','update Sync_Checkpoint__c','enqueueJob(this)'];
  steps.forEach((s,i)=>{ body+=box(i,yTop,s,subsTop[i]); body+=box(i,yBot,s,subsBot[i]); if(i<steps.length-1) body+=arrow(i); });
  return '<svg viewBox="0 0 '+w+' 150" width="100%" role="img" aria-label="Delta sync steps, Deluge above and Apex below">'+body+'</svg>';
}
function wireSFSync(){
  const host=document.getElementById('sfsync-diagram'); if(!host) return;
  if (window.Diagrams && typeof window.Diagrams.chain==='function') {
    try { host.innerHTML=''; window.Diagrams.chain(host, {
      lanes:[
        {label:'Deluge (Zoho)', steps:['Read checkpoint','Fetch delta page','Handle 429 / invalid token','Write checkpoint','Next scheduled tick']},
        {label:'Apex (Salesforce)', steps:['Read checkpoint','Fetch delta page','Handle 429 / invalid token','Write checkpoint','enqueueJob(this)']}
      ]
    }); return; } catch(e) { /* fall through to the static SVG below */ }
  }
  host.innerHTML = sfSyncFallbackSVG();
}

 harness:['Architecture write-up'],
 generator:['Architecture write-up'],
